/**
 * AffixEditor: 词条 (Affix) 通用行编辑器
 * 内功 / 天赋 / Buff / 战场效果等所有携带 affixes 数组的数据共用。
 * affix 结构: { effect: {...}, minimumLevel, requiresEquippedInternalSkill? }
 */
class AffixEditor {
  constructor(refIndex) {
    this.refIndex = refIndex;
  }

  static STATS = [
    'attack', 'defence', 'speed', 'bili', 'gengu', 'shenfa', 'wuxing', 'dingli',
    'fuyuan', 'accuracy', 'crit_chance', 'crit_mult', 'anti_crit_chance', 'anti_debuff', 'lifesteal'
  ];
  static STAT_LABELS = {
    attack: '攻击', defence: '防御', speed: '行动速度', bili: '臂力', gengu: '根骨',
    shenfa: '身法', wuxing: '悟性', dingli: '定力', fuyuan: '福缘', accuracy: '命中',
    crit_chance: '暴击率', crit_mult: '暴击倍率', anti_crit_chance: '抗暴击', anti_debuff: '抗异常', lifesteal: '吸血'
  };
  static TYPES = [
    { value: 'stat_modifier', label: '属性修正 (stat_modifier)' },
    { value: 'skill_bonus_modifier', label: '武学加成 (skill_bonus_modifier)' },
    { value: 'legend_skill_chance_modifier', label: '传奇技触发率 (legend_skill_chance)' },
    { value: 'grant_talent', label: '授予天赋 (grant_talent)' },
    { value: 'grant_model', label: '化身模型 (grant_model)' }
  ];

  static defaultEffect(type) {
    switch (type) {
      case 'stat_modifier': return { type: 'stat_modifier', stat: 'attack', value: { op: 'add', delta: 1 } };
      case 'skill_bonus_modifier': return { type: 'skill_bonus_modifier', skillId: '', value: { op: 'add', delta: 0.05 } };
      case 'legend_skill_chance_modifier': return { type: 'legend_skill_chance_modifier', skillId: '', value: { op: 'add', delta: 0.05 } };
      case 'grant_talent': return { type: 'grant_talent', talentId: '' };
      case 'grant_model': return { type: 'grant_model', modelId: '', priority: 0, description: '' };
      default: return { type: 'stat_modifier', stat: 'attack', value: { op: 'add', delta: 1 } };
    }
  }

  render(affixes, opts = {}) {
    const list = Array.isArray(affixes) ? affixes : [];
    return `
      <div class="affix-editor" data-affix-host="1">
        ${list.length === 0 ? '<div class="empty-hint" style="font-size:12.5px; padding:8px; color:var(--text-muted);">暂无词条，点击下方添加</div>' : list.map((af, i) => this._rowHtml(af, i, opts)).join('')}
        <div class="affix-add-row">
          <select class="input-field affix-new-type">
            ${AffixEditor.TYPES.map(t => `<option value="${t.value}">${t.label}</option>`).join('')}
          </select>
          <button class="btn btn-secondary btn-sm affix-add-btn" type="button">+ 添加词条</button>
        </div>
      </div>
    `;
  }

  _rowHtml(af, i, opts) {
    const e = af.effect || {};
    const t = e.type || 'stat_modifier';
    const known = AffixEditor.TYPES.some(x => x.value === t);
    const val = e.value || {};
    const typeLabel = known ? '' : `<option value="${t}" selected>自定义 (${t})</option>`;

    let body = '';
    if (t === 'stat_modifier') {
      const statOptions = AffixEditor.STATS.includes(e.stat) || !e.stat
        ? AffixEditor.STATS
        : AffixEditor.STATS.concat([e.stat]);
      body = `
        <select class="input-field affix-f-stat" data-idx="${i}" style="width:150px;">
          ${statOptions.map(s => `<option value="${s}" ${e.stat === s ? 'selected' : ''}>${AffixEditor.STAT_LABELS[s] || s} (${s})</option>`).join('')}
        </select>
        <label class="affix-eq">数值 <input type="number" step="0.01" class="input-field affix-f-delta" data-idx="${i}" value="${val.delta != null ? val.delta : 0}" style="width:90px;"></label>
      `;
    } else if (t === 'skill_bonus_modifier' || t === 'legend_skill_chance_modifier') {
      body = `
        <input type="text" class="input-field affix-f-skillid" data-idx="${i}" value="${e.skillId || ''}" placeholder="武学ID" style="width:170px;" list="affixSkillIdList">
        <label class="affix-eq">数值 <input type="number" step="0.01" class="input-field affix-f-delta" data-idx="${i}" value="${val.delta != null ? val.delta : 0}" style="width:90px;"></label>
      `;
    } else if (t === 'grant_talent') {
      const talentIds = this.refIndex.talents.map(x => x.id);
      const options = talentIds.includes(e.talentId) || !e.talentId
        ? talentIds
        : talentIds.concat([e.talentId]);
      body = `
        <select class="input-field affix-f-talentid" data-idx="${i}" style="width:220px;">
          ${options.map(id => `<option value="${id}" ${e.talentId === id ? 'selected' : ''}>${id}</option>`).join('')}
        </select>
      `;
    } else if (t === 'grant_model') {
      body = `
        <input type="text" class="input-field affix-f-modelid" data-idx="${i}" value="${e.modelId || ''}" placeholder="模型ID 如 guoxiang" style="width:150px;">
        <label class="affix-eq">优先级 <input type="number" class="input-field affix-f-priority" data-idx="${i}" value="${e.priority != null ? e.priority : 0}" style="width:64px;"></label>
        <input type="text" class="input-field affix-f-desc" data-idx="${i}" value="${e.description || ''}" placeholder="化身描述" style="width:170px;">
      `;
    } else {
      body = `
        <textarea class="input-field affix-f-raw" data-idx="${i}" placeholder="effect JSON">${JSON.stringify(e, null, 2)}</textarea>
      `;
    }

    return `
      <div class="affix-row" data-idx="${i}">
        <div class="affix-row-head">
          <select class="input-field affix-type" data-idx="${i}">
            ${typeLabel}${AffixEditor.TYPES.map(x => `<option value="${x.value}" ${t === x.value ? 'selected' : ''}>${x.label}</option>`).join('')}
          </select>
          <label class="affix-lv">Lv≥ <input type="number" class="input-field affix-min-level" data-idx="${i}" value="${af.minimumLevel != null ? af.minimumLevel : 0}" min="0"></label>
          ${opts.showRequiresEquipped !== false ? `<label class="affix-eq"><input type="checkbox" class="affix-req-eq" data-idx="${i}" ${af.requiresEquippedInternalSkill ? 'checked' : ''}> 需装备内功</label>` : ''}
          <button class="btn btn-danger btn-sm affix-del" data-idx="${i}" type="button">✕ 删除</button>
        </div>
        <div class="affix-row-body">${body}</div>
      </div>
    `;
  }

  // onChange(rebuild): 结构性变更(类型切换/增删/JSON应用)传 true 让宿主重绘；字段微调传 false
  bind(rootEl, affixes, onChange) {
    const host = rootEl.querySelector('[data-affix-host]') || rootEl;
    if (!host || !Array.isArray(affixes)) return;

    const ensure = (i) => {
      if (!affixes[i].effect) affixes[i].effect = AffixEditor.defaultEffect('stat_modifier');
      return affixes[i];
    };

    host.querySelectorAll('.affix-add-btn').forEach(btn => {
      btn.onclick = () => {
        const typeSel = host.querySelector('.affix-new-type');
        const created = { effect: AffixEditor.defaultEffect(typeSel ? typeSel.value : 'stat_modifier'), minimumLevel: 1 };
        affixes.push(created);
        onChange(true);
      };
    });

    host.querySelectorAll('.affix-del').forEach(btn => {
      btn.onclick = () => {
        affixes.splice(parseInt(btn.dataset.idx, 10), 1);
        onChange(true);
      };
    });

    host.querySelectorAll('.affix-type').forEach(sel => {
      sel.onchange = () => {
        const af = ensure(parseInt(sel.dataset.idx, 10));
        af.effect = AffixEditor.defaultEffect(sel.value);
        onChange(true);
      };
    });

    host.querySelectorAll('.affix-min-level').forEach(inp => {
      inp.onchange = () => { ensure(parseInt(inp.dataset.idx, 10)).minimumLevel = parseFloat(inp.value) || 0; onChange(false); };
    });

    host.querySelectorAll('.affix-req-eq').forEach(chk => {
      chk.onchange = () => {
        const af = ensure(parseInt(chk.dataset.idx, 10));
        if (chk.checked) af.requiresEquippedInternalSkill = true;
        else delete af.requiresEquippedInternalSkill;
        onChange(false);
      };
    });

    host.querySelectorAll('.affix-f-stat').forEach(sel => {
      sel.onchange = () => { ensure(parseInt(sel.dataset.idx, 10)).effect.stat = sel.value; onChange(false); };
    });

    host.querySelectorAll('.affix-f-delta').forEach(inp => {
      inp.onchange = () => {
        const e = ensure(parseInt(inp.dataset.idx, 10)).effect;
        if (!e.value || typeof e.value !== 'object') e.value = { op: 'add', delta: 0 };
        e.value.op = e.value.op || 'add';
        e.value.delta = parseFloat(inp.value) || 0;
        onChange(false);
      };
    });

    host.querySelectorAll('.affix-f-skillid').forEach(inp => {
      inp.onchange = () => { ensure(parseInt(inp.dataset.idx, 10)).effect.skillId = inp.value.trim() || undefined; onChange(false); };
    });

    host.querySelectorAll('.affix-f-talentid').forEach(sel => {
      sel.onchange = () => { ensure(parseInt(sel.dataset.idx, 10)).effect.talentId = sel.value; onChange(false); };
    });

    host.querySelectorAll('.affix-f-modelid').forEach(inp => {
      inp.onchange = () => { ensure(parseInt(inp.dataset.idx, 10)).effect.modelId = inp.value.trim() || undefined; onChange(false); };
    });

    host.querySelectorAll('.affix-f-priority').forEach(inp => {
      inp.onchange = () => { ensure(parseInt(inp.dataset.idx, 10)).effect.priority = parseInt(inp.value, 10) || 0; onChange(false); };
    });

    host.querySelectorAll('.affix-f-desc').forEach(inp => {
      inp.onchange = () => { ensure(parseInt(inp.dataset.idx, 10)).effect.description = inp.value.trim() || undefined; onChange(false); };
    });

    host.querySelectorAll('.affix-f-raw').forEach(ta => {
      ta.onchange = () => {
        try {
          const parsed = JSON.parse(ta.value);
          if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('effect 必须是 JSON 对象');
          affixes[parseInt(ta.dataset.idx, 10)].effect = parsed;
          onChange(true);
        } catch (err) {
          alert('effect JSON 解析失败: ' + err.message);
        }
      };
    });
  }
}

/**
 * ItemView: 神兵与道具工坊
 */
class ItemView {
  constructor(adapter, refIndex, onSaveNotification) {
    this.adapter = adapter;
    this.refIndex = refIndex;
    this.resolver = new ResourceResolver(refIndex);
    this.notify = onSaveNotification;
    this.items = [];
    this.selectedItem = null;
    this.searchKeyword = '';
    this.categoryFilter = 'all';
    this.container = null;
  }

  render(parentEl) {
    this.container = parentEl;
    this.items = this.adapter.loadItems();
    if (this.items.length > 0 && !this.selectedItem) {
      this.selectedItem = this.items[0];
    }
    this._renderLayout();
  }

  _getFilteredItems() {
    return this.items.filter(item => {
      const matchKey = !this.searchKeyword ||
        (item.name && item.name.includes(this.searchKeyword)) ||
        (item.id && item.id.includes(this.searchKeyword));
      if (!matchKey) return false;

      if (this.categoryFilter === 'all') return true;
      if (this.categoryFilter === 'weapon') return item.slotType === 'weapon' || (Array.isArray(item.tagIds) && item.tagIds.includes('weapon'));
      if (this.categoryFilter === 'armor_acc') return item.slotType === 'armor' || item.slotType === 'accessory';
      if (this.categoryFilter === 'book') return item.type === 'skill_book' || item.type === 'talent_book' || item.type === 'special_skill_book';
      if (this.categoryFilter === 'pill') return item.type === 'consumable' || item.type === 'booster';
      if (this.categoryFilter === 'quest') return item.type === 'quest_item';
      return true;
    });
  }

  _renderLayout() {
    this.container.innerHTML = `
      <div class="view-split-layout">
        <!-- 左侧物品列表 -->
        <div class="sidebar-panel">
          <div class="sidebar-header">
            <input type="text" id="itemSearch" class="search-input" placeholder="🔍 搜索神兵/道具名或ID..." value="${this.searchKeyword}">
            <div class="filter-row">
              <button class="filter-chip ${this.categoryFilter === 'all' ? 'active' : ''}" data-cat="all">全部</button>
              <button class="filter-chip ${this.categoryFilter === 'weapon' ? 'active' : ''}" data-cat="weapon">神兵</button>
              <button class="filter-chip ${this.categoryFilter === 'armor_acc' ? 'active' : ''}" data-cat="armor_acc">防具饰品</button>
              <button class="filter-chip ${this.categoryFilter === 'book' ? 'active' : ''}" data-cat="book">秘籍</button>
              <button class="filter-chip ${this.categoryFilter === 'pill' ? 'active' : ''}" data-cat="pill">灵药</button>
              <button class="filter-chip ${this.categoryFilter === 'quest' ? 'active' : ''}" data-cat="quest">剧情</button>
            </div>
            <button id="addItemBtn" class="btn btn-primary" style="width: 100%; margin-top: 8px;">+ 新建神兵/道具</button>
          </div>
          <div class="item-list-scroll" id="itemList">
            ${this._renderItemListHtml()}
          </div>
        </div>

        <!-- 右侧物品详情表单 -->
        <div class="detail-panel" id="itemDetail">
          ${this.selectedItem ? this._renderDetailHtml(this.selectedItem) : '<div class="empty-hint" style="padding:40px; text-align:center; color:var(--text-muted);">请选择一个物品进行调校</div>'}
        </div>
      </div>
    `;

    this._bindEvents();
  }

  _renderItemListHtml() {
    const list = this._getFilteredItems();
    if (list.length === 0) return '<div class="empty-list" style="padding:40px; text-align:center; color:var(--text-muted);">未找到匹配的物品</div>';
    return list.map(item => {
      const isSelected = this.selectedItem && this.selectedItem.id === item.id;
      let badgeCls = 'badge-gray';
      let typeLabel = item.type || item.category || '道具';
      if (item.slotType === 'weapon') { badgeCls = 'badge-gold'; typeLabel = '神兵'; }
      else if (item.slotType === 'armor') { badgeCls = 'badge-blue'; typeLabel = '防具'; }
      else if (item.slotType === 'accessory') { badgeCls = 'badge-purple'; typeLabel = '饰品'; }
      else if (item.type === 'skill_book') { badgeCls = 'badge-green'; typeLabel = '秘籍'; }
      else if (item.type === 'consumable') { badgeCls = 'badge-red'; typeLabel = '丹药'; }

      return `
        <div class="list-item-card ${isSelected ? 'active' : ''}" data-id="${item.id}">
          ${this.resolver.renderImg(item.picture, item.name, 'item-list-thumb')}
          <div class="item-card-content">
            <div class="item-title-row">
              <span class="item-name text-gold">${item.name || item.id}</span>
              <span class="item-badge ${badgeCls}">${typeLabel}</span>
            </div>
            <div class="item-meta-row">
              <span class="meta-id">ID: ${item.id}</span>
              <span class="meta-price">💰 ${item.price || 0} 银两</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  _renderDetailHtml(it) {
    const isEq = it.category === 'equipment' || it.type === 'equipment';
    const affixes = it.affixes || [];

    return `
      <div class="form-scroll-wrapper">
        <div class="detail-header-bar">
          <div>
            <h2 class="detail-title text-gold">${it.name || it.id}</h2>
            <div class="detail-subtitle">ID: <code>${it.id}</code> · 类别: ${it.category || 'normal'} · 细分: ${it.type || 'normal'}</div>
          </div>
          <div class="btn-group">
            <button id="duplicateItemBtn" class="btn btn-secondary">克隆物品</button>
            <button id="deleteItemBtn" class="btn btn-danger">删除</button>
            <button id="saveItemsBtn" class="btn btn-primary">💾 保存更改</button>
          </div>
        </div>

        <!-- 原画与基础卡片 -->
        <div class="form-card">
          <h3>神兵插画与基本属性</h3>
          <div class="media-preview-header">
            ${this.resolver.renderImg(it.picture, it.name, 'item-large-preview')}
            <div>
              <div style="font-weight:bold; font-size:15px; margin-bottom:4px;">当前绑定图鉴: <code>${it.picture || '无'}</code></div>
              <button id="pickItemPicBtn" class="btn btn-secondary btn-sm">🖼️ 更换神兵插画图鉴</button>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>物品名称 (name)</label>
              <input type="text" class="input-field" id="it_name" value="${it.name || ''}">
            </div>
            <div class="form-group">
              <label>唯一标识 (id)</label>
              <input type="text" class="input-field" id="it_id" value="${it.id || ''}">
            </div>
            <div class="form-group">
              <label>大类架构 (category)</label>
              <select class="input-field" id="it_category">
                <option value="equipment" ${it.category === 'equipment' ? 'selected' : ''}>神兵装备 (equipment)</option>
                <option value="normal" ${it.category === 'normal' ? 'selected' : ''}>普通道具/秘籍/灵药 (normal)</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>细分类型 (type)</label>
              <select class="input-field" id="it_type">
                ${ItemSchema.types.map(t => `<option value="${t.value}" ${it.type === t.value ? 'selected' : ''}>${t.label}</option>`).join('')}
              </select>
            </div>
            <div class="form-group" id="slotTypeGroup" style="${isEq ? '' : 'display:none;'}">
              <label>装备槽位 (slotType)</label>
              <select class="input-field" id="it_slotType">
                ${ItemSchema.slotTypes.map(s => `<option value="${s.value}" ${it.slotType === s.value ? 'selected' : ''}>${s.label}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>品阶等级 (level)</label>
              <input type="number" class="input-field" id="it_level" value="${it.level || 1}" min="1">
            </div>
            <div class="form-group">
              <label>购买售价 (price)</label>
              <input type="number" class="input-field" id="it_price" value="${it.price || 0}" min="0">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>使用即消耗 (consumeOnUse)</label>
              <select class="input-field" id="it_consumeOnUse">
                <option value="false" ${!it.consumeOnUse ? 'selected' : ''}>否 (神兵/装备类)</option>
                <option value="true" ${it.consumeOnUse ? 'selected' : ''}>是 (药品/秘籍类)</option>
              </select>
            </div>
            <div class="form-group">
              <label>允许掉落 (canDrop)</label>
              <select class="input-field" id="it_canDrop">
                <option value="true" ${it.canDrop !== false ? 'selected' : ''}>允许掉落</option>
                <option value="false" ${it.canDrop === false ? 'selected' : ''}>不可掉落</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>物品详述文案 (description)</label>
            <textarea class="input-field" id="it_description">${it.description || ''}</textarea>
          </div>
        </div>

        <!-- 装备词条与天赋绑定 -->
        <div class="form-card" id="affixCard" style="${isEq ? '' : 'display:none;'}">
          <h3>
            <span>神兵词条与附加天赋 (Affixes)</span>
            <div class="btn-group">
              <button id="addStatAffixBtn" class="btn btn-secondary btn-sm">+ 属性词条</button>
              <button id="addTalentAffixBtn" class="btn btn-secondary btn-sm">+ 天赋词条</button>
            </div>
          </h3>
          <div id="affixListContainer">
            ${affixes.length === 0 ? '<div style="color:var(--text-muted); font-size:13px; padding:10px 0;">当前神兵暂未附加特殊词条</div>' : `
              <table class="sub-table">
                <thead>
                  <tr>
                    <th>词条类型</th>
                    <th>加成目标 / 天赋</th>
                    <th>数值</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody>
                  ${affixes.map((af, idx) => {
                    if (af.type === 'grant_talent') {
                      return `
                        <tr>
                          <td><span class="item-badge badge-purple">附加天赋</span></td>
                          <td>
                            <select class="input-field affix-talent-select" data-idx="${idx}">
                              ${this.refIndex.talents.map(t => `<option value="${t.id}" ${af.talentId === t.id ? 'selected' : ''}>${t.name || t.id}</option>`).join('')}
                            </select>
                          </td>
                          <td>--</td>
                          <td><button class="btn btn-danger btn-sm remove-affix-btn" data-idx="${idx}">删除</button></td>
                        </tr>
                      `;
                    } else {
                      const stat = af.stat || 'attack';
                      const delta = af.value ? (af.value.delta || 0) : 0;
                      return `
                        <tr>
                          <td><span class="item-badge badge-gold">属性加成</span></td>
                          <td>
                            <select class="input-field affix-stat-select" data-idx="${idx}">
                              ${ItemSchema.statOptions.map(opt => `<option value="${opt.value}" ${stat === opt.value ? 'selected' : ''}>${opt.label}</option>`).join('')}
                            </select>
                          </td>
                          <td>
                            <input type="number" class="input-field affix-delta-input" data-idx="${idx}" value="${delta}" style="width:100px;">
                          </td>
                          <td><button class="btn btn-danger btn-sm remove-affix-btn" data-idx="${idx}">删除</button></td>
                        </tr>
                      `;
                    }
                  }).join('')}
                </tbody>
              </table>
            `}
          </div>
        </div>
      </div>
    `;
  }

  _bindEvents() {
    const searchInput = this.container.querySelector('#itemSearch');
    if (searchInput) {
      searchInput.oninput = (e) => {
        this.searchKeyword = e.target.value.trim();
        this.container.querySelector('#itemList').innerHTML = this._renderItemListHtml();
        this._bindListClickEvents();
      };
    }

    this.container.querySelectorAll('.filter-chip').forEach(chip => {
      chip.onclick = () => {
        this.categoryFilter = chip.dataset.cat;
        this.container.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        this.container.querySelector('#itemList').innerHTML = this._renderItemListHtml();
        this._bindListClickEvents();
      };
    });

    const addBtn = this.container.querySelector('#addItemBtn');
    if (addBtn) {
      addBtn.onclick = () => {
        const newItem = ItemSchema.defaultItem();
        newItem.id = 'item_' + Date.now().toString().slice(-4);
        newItem.name = '自创新神兵';
        this.items.unshift(newItem);
        this.selectedItem = newItem;
        this._renderLayout();
        this.notify('已新建物品模版，请调校属性！');
      };
    }

    this._bindListClickEvents();
    this._bindFormEvents();
  }

  _bindListClickEvents() {
    this.container.querySelectorAll('.list-item-card').forEach(card => {
      card.onclick = () => {
        const id = card.dataset.id;
        this.selectedItem = this.items.find(i => i.id === id);
        this.container.querySelectorAll('.list-item-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        this.container.querySelector('#itemDetail').innerHTML = this._renderDetailHtml(this.selectedItem);
        this._bindFormEvents();
      };
    });
  }

  _bindFormEvents() {
    if (!this.selectedItem) return;
    const it = this.selectedItem;

    const pickPicBtn = this.container.querySelector('#pickItemPicBtn');
    if (pickPicBtn) {
      pickPicBtn.onclick = () => {
        MediaPickerModal.open({
          type: 'item',
          title: '从图鉴挑选神兵道具原画',
          current: it.picture,
          refIndex: this.refIndex,
          resourceResolver: this.resolver,
          onSelect: (ref) => {
            it.picture = ref;
            this._renderLayout();
          }
        });
      };
    }

    const catSelect = this.container.querySelector('#it_category');
    if (catSelect) {
      catSelect.onchange = (e) => {
        it.category = e.target.value;
        const isEq = it.category === 'equipment';
        const slotGrp = this.container.querySelector('#slotTypeGroup');
        const affixCard = this.container.querySelector('#affixCard');
        if (slotGrp) slotGrp.style.display = isEq ? '' : 'none';
        if (affixCard) affixCard.style.display = isEq ? '' : 'none';
      };
    }

    const addStatBtn = this.container.querySelector('#addStatAffixBtn');
    if (addStatBtn) {
      addStatBtn.onclick = () => {
        if (!Array.isArray(it.affixes)) it.affixes = [];
        it.affixes.push({
          type: 'stat_modifier',
          stat: 'attack',
          value: { op: 'add', delta: 30 }
        });
        this._renderLayout();
      };
    }

    const addTalentBtn = this.container.querySelector('#addTalentAffixBtn');
    if (addTalentBtn) {
      addTalentBtn.onclick = () => {
        if (!Array.isArray(it.affixes)) it.affixes = [];
        const tid = this.refIndex.talents.length > 0 ? this.refIndex.talents[0].id : '刀系装备';
        it.affixes.push({
          type: 'grant_talent',
          talentId: tid
        });
        this._renderLayout();
      };
    }

    this.container.querySelectorAll('.remove-affix-btn').forEach(btn => {
      btn.onclick = () => {
        const idx = parseInt(btn.dataset.idx, 10);
        it.affixes.splice(idx, 1);
        this._renderLayout();
      };
    });

    this.container.querySelectorAll('.affix-stat-select').forEach(sel => {
      sel.onchange = () => {
        const idx = parseInt(sel.dataset.idx, 10);
        if (it.affixes[idx]) it.affixes[idx].stat = sel.value;
      };
    });

    this.container.querySelectorAll('.affix-delta-input').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        if (it.affixes[idx]) {
          if (!it.affixes[idx].value) it.affixes[idx].value = { op: 'add', delta: 0 };
          it.affixes[idx].value.delta = parseFloat(inp.value) || 0;
        }
      };
    });

    this.container.querySelectorAll('.affix-talent-select').forEach(sel => {
      sel.onchange = () => {
        const idx = parseInt(sel.dataset.idx, 10);
        if (it.affixes[idx]) it.affixes[idx].talentId = sel.value;
      };
    });

    const dupBtn = this.container.querySelector('#duplicateItemBtn');
    if (dupBtn) {
      dupBtn.onclick = () => {
        const cloned = JSON.parse(JSON.stringify(it));
        cloned.id = it.id + '_copy';
        cloned.name = (it.name || it.id) + ' (副本)';
        this.items.unshift(cloned);
        this.selectedItem = cloned;
        this._renderLayout();
        this.notify('物品克隆成功！');
      };
    }

    const delBtn = this.container.querySelector('#deleteItemBtn');
    if (delBtn) {
      delBtn.onclick = () => {
        if (confirm(`确定要删除物品《${it.name || it.id}》吗？`)) {
          const idx = this.items.findIndex(i => i.id === it.id);
          if (idx !== -1) {
            this.items.splice(idx, 1);
            this.selectedItem = this.items[0] || null;
            this._renderLayout();
            this.notify('物品已成功删除');
          }
        }
      };
    }

    const saveBtn = this.container.querySelector('#saveItemsBtn');
    if (saveBtn) {
      saveBtn.onclick = async () => {
        saveBtn.innerText = '⏳ 保存中...';
        it.name = this.container.querySelector('#it_name').value.trim();
        it.id = this.container.querySelector('#it_id').value.trim();
        it.category = this.container.querySelector('#it_category').value;
        it.type = this.container.querySelector('#it_type').value;
        if (it.category === 'equipment') {
          it.slotType = this.container.querySelector('#it_slotType').value;
        }
        it.level = parseInt(this.container.querySelector('#it_level').value, 10) || 1;
        it.price = parseInt(this.container.querySelector('#it_price').value, 10) || 0;
        it.consumeOnUse = this.container.querySelector('#it_consumeOnUse').value === 'true';
        it.canDrop = this.container.querySelector('#it_canDrop').value === 'true';
        it.description = this.container.querySelector('#it_description').value.trim();

        const res = await this.adapter.saveItems(this.items);
        saveBtn.innerText = '💾 保存更改';
        if (res.success) {
          this.notify(`成功保存 ${this.items.length} 件神兵与道具至 items.json！${describeSaveState(res)}`, saveToastType(res));
          this._renderLayout();
        } else {
          this.notify('保存失败: ' + (res.error || '未知错误'), 'error');
        }
      };
    }
  }
}

/**
 * SkillView: 武学与招式工坊
 */
class SkillView {
  constructor(adapter, refIndex, onSaveNotification) {
    this.adapter = adapter;
    this.refIndex = refIndex;
    this.resolver = new ResourceResolver(refIndex);
    this.notify = onSaveNotification;
    this.skills = [];
    this.selectedSkill = null;
    this.searchKeyword = '';
    this.container = null;
  }

  render(parentEl) {
    this.container = parentEl;
    this.skills = this.adapter.loadExternalSkills();
    if (this.skills.length > 0 && !this.selectedSkill) {
      this.selectedSkill = this.skills[0];
    }
    this._renderLayout();
  }

  _getFilteredSkills() {
    return this.skills.filter(s => {
      return !this.searchKeyword ||
        (s.name && s.name.includes(this.searchKeyword)) ||
        (s.id && s.id.includes(this.searchKeyword));
    });
  }

  _renderLayout() {
    this.container.innerHTML = `
      <div class="view-split-layout">
        <!-- 左侧武学列表 -->
        <div class="sidebar-panel">
          <div class="sidebar-header">
            <input type="text" id="skillSearch" class="search-input" placeholder="🔍 搜索武学功法名称或ID..." value="${this.searchKeyword}">
            <button id="addSkillBtn" class="btn btn-primary" style="width: 100%; margin-top: 8px;">+ 自创新武学</button>
          </div>
          <div class="item-list-scroll" id="skillList">
            ${this._renderSkillListHtml()}
          </div>
        </div>

        <!-- 右侧武学表单 -->
        <div class="detail-panel" id="skillDetail">
          ${this.selectedSkill ? this._renderDetailHtml(this.selectedSkill) : '<div class="empty-hint" style="padding:40px; text-align:center; color:var(--text-muted);">请选择一门武学进行调校</div>'}
        </div>
      </div>
    `;

    this._bindEvents();
  }

  _renderSkillListHtml() {
    const list = this._getFilteredSkills();
    if (list.length === 0) return '<div class="empty-list" style="padding:40px; text-align:center; color:var(--text-muted);">未找到匹配的武学</div>';
    return list.map(s => {
      const isSelected = this.selectedSkill && this.selectedSkill.id === s.id;
      let badgeCls = 'badge-blue';
      if (s.type === 'quanzhang') badgeCls = 'badge-gold';
      if (s.type === 'daofa') badgeCls = 'badge-red';
      if (s.type === 'qimen') badgeCls = 'badge-purple';

      return `
        <div class="list-item-card ${isSelected ? 'active' : ''}" data-id="${s.id}">
          ${this.resolver.renderImg(s.icon, s.name, 'skill-list-thumb')}
          <div class="item-card-content">
            <div class="item-title-row">
              <span class="item-name text-blue">${s.name || s.id}</span>
              <span class="item-badge ${badgeCls}">${s.type || '外功'}</span>
            </div>
            <div class="item-meta-row">
              <span class="meta-id">ID: ${s.id}</span>
              <span class="meta-power">威力: ${s.powerBase || 0} (+${s.powerStep || 0}/级)</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  _renderDetailHtml(s) {
    const forms = s.formSkills || [];

    return `
      <div class="form-scroll-wrapper">
        <div class="detail-header-bar">
          <div>
            <h2 class="detail-title text-blue">${s.name || s.id}</h2>
            <div class="detail-subtitle">ID: <code>${s.id}</code> · 招式数: ${(s.formSkills || []).length} 招</div>
          </div>
          <div class="btn-group">
            <button id="duplicateSkillBtn" class="btn btn-secondary">克隆武学</button>
            <button id="deleteSkillBtn" class="btn btn-danger">删除</button>
            <button id="saveSkillsBtn" class="btn btn-primary">💾 保存更改</button>
          </div>
        </div>

        <!-- 基础信息与图标 -->
        <div class="form-card">
          <h3>功法纲要与图标</h3>
          <div class="media-preview-header">
            ${this.resolver.renderImg(s.icon, s.name, 'skill-large-preview')}
            <div>
              <div style="font-weight:bold; font-size:15px; margin-bottom:4px;">绑定武学图标: <code>${s.icon || '无'}</code></div>
              <button id="pickSkillIconBtn" class="btn btn-secondary btn-sm">🖼️ 更换武学图标</button>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>武学名称 (name)</label>
              <input type="text" class="input-field" id="sk_name" value="${s.name || ''}">
            </div>
            <div class="form-group">
              <label>唯一标识 (id)</label>
              <input type="text" class="input-field" id="sk_id" value="${s.id || ''}">
            </div>
            <div class="form-group">
              <label>兵刃系别 (type)</label>
              <select class="input-field" id="sk_type">
                ${SkillSchema.skillTypes.map(t => `<option value="${t.value}" ${s.type === t.value ? 'selected' : ''}>${t.label}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>威力基数 (powerBase)</label>
              <input type="number" step="0.1" class="input-field" id="sk_powerBase" value="${s.powerBase || 5}">
            </div>
            <div class="form-group">
              <label>每级威力增长 (powerStep)</label>
              <input type="number" step="0.05" class="input-field" id="sk_powerStep" value="${s.powerStep || 0.5}">
            </div>
            <div class="form-group">
              <label>消耗与难度系数 (hard)</label>
              <input type="number" step="0.5" class="input-field" id="sk_hard" value="${s.hard || 2}">
            </div>
            <div class="form-group">
              <label>冷却回合 (cooldown)</label>
              <input type="number" class="input-field" id="sk_cooldown" value="${s.cooldown || 0}" min="0">
            </div>
          </div>

          <div class="form-group">
            <label>功法描述 (description)</label>
            <textarea class="input-field" id="sk_description">${s.description || ''}</textarea>
          </div>
        </div>

        <!-- 进阶招式流派与攻击范围 -->
        <div class="form-card">
          <h3>
            <span>进阶招式表与打击范围 (Form Skills)</span>
            <button id="addFormBtn" class="btn btn-secondary btn-sm">+ 新增招式</button>
          </h3>
          <div id="formsContainer">
            ${forms.length === 0 ? '<div style="color:var(--text-muted); font-size:13px; padding:10px 0;">当前武学暂未配置专属招式</div>' : forms.map((f, idx) => {
              const targeting = f.targeting || { castSize: 1, impactType: 'line', impactSize: 3 };
              return `
                <div class="form-card" style="background:var(--bg-dark); border-color:var(--border-light); margin-top:10px;">
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <strong style="color:var(--accent-gold);">招式 #${idx + 1}: ${f.name || f.id}</strong>
                    <button class="btn btn-danger btn-sm remove-form-btn" data-idx="${idx}">删除此招</button>
                  </div>
                  <div class="form-row">
                    <div class="form-group">
                      <label>招式名称</label>
                      <input type="text" class="input-field form-name-input" data-idx="${idx}" value="${f.name || ''}">
                    </div>
                    <div class="form-group">
                      <label>招式ID</label>
                      <input type="text" class="input-field form-id-input" data-idx="${idx}" value="${f.id || ''}">
                    </div>
                    <div class="form-group">
                      <label>消耗怒气 (rage)</label>
                      <input type="number" class="input-field form-rage-input" data-idx="${idx}" value="${(f.cost && f.cost.rage) || 2}" min="0">
                    </div>
                    <div class="form-group">
                      <label>冷却回合 (CD)</label>
                      <input type="number" class="input-field form-cd-input" data-idx="${idx}" value="${f.cooldown || 2}" min="0">
                    </div>
                    <div class="form-group">
                      <label>解锁等级</label>
                      <input type="number" class="input-field form-unlock-input" data-idx="${idx}" value="${f.unlockLevel || 1}" min="1">
                    </div>
                  </div>

                  <div class="form-row">
                    <div class="form-group">
                      <label>攻击范围模式 (impactType)</label>
                      <select class="input-field form-impact-type-select" data-idx="${idx}">
                        ${SkillSchema.impactTypes.map(it => `<option value="${it.value}" ${targeting.impactType === it.value ? 'selected' : ''}>${it.label}</option>`).join('')}
                      </select>
                    </div>
                    <div class="form-group">
                      <label>波及范围大小 (impactSize)</label>
                      <input type="number" class="input-field form-impact-size-input" data-idx="${idx}" value="${targeting.impactSize || 3}" min="1" max="5">
                    </div>
                    <div class="form-group">
                      <label>施法距离 (castSize)</label>
                      <input type="number" class="input-field form-cast-size-input" data-idx="${idx}" value="${targeting.castSize !== null ? targeting.castSize : 1}" min="0" max="5">
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      </div>
    `;
  }

  _bindEvents() {
    const searchInput = this.container.querySelector('#skillSearch');
    if (searchInput) {
      searchInput.oninput = (e) => {
        this.searchKeyword = e.target.value.trim();
        this.container.querySelector('#skillList').innerHTML = this._renderSkillListHtml();
        this._bindListClickEvents();
      };
    }

    const addBtn = this.container.querySelector('#addSkillBtn');
    if (addBtn) {
      addBtn.onclick = () => {
        const newSkill = SkillSchema.defaultSkill();
        newSkill.id = 'skill_' + Date.now().toString().slice(-4);
        newSkill.name = '自创新功法';
        this.skills.unshift(newSkill);
        this.selectedSkill = newSkill;
        this._renderLayout();
        this.notify('已新建武学模版，请调校参数！');
      };
    }

    this._bindListClickEvents();
    this._bindFormEvents();
  }

  _bindListClickEvents() {
    this.container.querySelectorAll('.list-item-card').forEach(card => {
      card.onclick = () => {
        const id = card.dataset.id;
        this.selectedSkill = this.skills.find(s => s.id === id);
        this.container.querySelectorAll('.list-item-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        this.container.querySelector('#skillDetail').innerHTML = this._renderDetailHtml(this.selectedSkill);
        this._bindFormEvents();
      };
    });
  }

  _bindFormEvents() {
    if (!this.selectedSkill) return;
    const s = this.selectedSkill;

    const pickIconBtn = this.container.querySelector('#pickSkillIconBtn');
    if (pickIconBtn) {
      pickIconBtn.onclick = () => {
        MediaPickerModal.open({
          type: 'icon',
          title: '挑选武学招式图标',
          current: s.icon,
          refIndex: this.refIndex,
          resourceResolver: this.resolver,
          onSelect: (ref) => {
            s.icon = ref;
            this._renderLayout();
          }
        });
      };
    }

    const addFormBtn = this.container.querySelector('#addFormBtn');
    if (addFormBtn) {
      addFormBtn.onclick = () => {
        if (!Array.isArray(s.formSkills)) s.formSkills = [];
        s.formSkills.push({
          id: s.id + '.招式' + (s.formSkills.length + 1),
          name: (s.name || '武学') + '新招',
          description: '威力惊人的后发招式',
          hard: s.hard || 2.0,
          cooldown: 3,
          cost: { rage: 3 },
          powerExtra: 3.0,
          animation: 'quantou_zadi',
          audio: '音效.拳2',
          unlockLevel: 5,
          buffs: [],
          targeting: { castSize: 1, impactType: 'line', impactSize: 3 }
        });
        this._renderLayout();
      };
    }

    this.container.querySelectorAll('.remove-form-btn').forEach(btn => {
      btn.onclick = () => {
        const idx = parseInt(btn.dataset.idx, 10);
        s.formSkills.splice(idx, 1);
        this._renderLayout();
      };
    });

    this.container.querySelectorAll('.form-name-input').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        if (s.formSkills[idx]) s.formSkills[idx].name = inp.value.trim();
      };
    });

    this.container.querySelectorAll('.form-id-input').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        if (s.formSkills[idx]) s.formSkills[idx].id = inp.value.trim();
      };
    });

    this.container.querySelectorAll('.form-rage-input').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        if (s.formSkills[idx]) {
          if (!s.formSkills[idx].cost) s.formSkills[idx].cost = {};
          s.formSkills[idx].cost.rage = parseInt(inp.value, 10) || 0;
        }
      };
    });

    this.container.querySelectorAll('.form-cd-input').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        if (s.formSkills[idx]) s.formSkills[idx].cooldown = parseInt(inp.value, 10) || 0;
      };
    });

    this.container.querySelectorAll('.form-unlock-input').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        if (s.formSkills[idx]) s.formSkills[idx].unlockLevel = parseInt(inp.value, 10) || 1;
      };
    });

    this.container.querySelectorAll('.form-impact-type-select').forEach(sel => {
      sel.onchange = () => {
        const idx = parseInt(sel.dataset.idx, 10);
        if (s.formSkills[idx]) {
          if (!s.formSkills[idx].targeting) s.formSkills[idx].targeting = {};
          s.formSkills[idx].targeting.impactType = sel.value;
        }
      };
    });

    this.container.querySelectorAll('.form-impact-size-input').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        if (s.formSkills[idx]) {
          if (!s.formSkills[idx].targeting) s.formSkills[idx].targeting = {};
          s.formSkills[idx].targeting.impactSize = parseInt(inp.value, 10) || 1;
        }
      };
    });

    this.container.querySelectorAll('.form-cast-size-input').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        if (s.formSkills[idx]) {
          if (!s.formSkills[idx].targeting) s.formSkills[idx].targeting = {};
          s.formSkills[idx].targeting.castSize = parseInt(inp.value, 10) || 0;
        }
      };
    });

    const dupBtn = this.container.querySelector('#duplicateSkillBtn');
    if (dupBtn) {
      dupBtn.onclick = () => {
        const cloned = JSON.parse(JSON.stringify(s));
        cloned.id = s.id + '_copy';
        cloned.name = (s.name || s.id) + ' (重制)';
        this.skills.unshift(cloned);
        this.selectedSkill = cloned;
        this._renderLayout();
        this.notify('武学克隆成功！');
      };
    }

    const delBtn = this.container.querySelector('#deleteSkillBtn');
    if (delBtn) {
      delBtn.onclick = () => {
        if (confirm(`确定要删除武学《${s.name || s.id}》吗？`)) {
          const idx = this.skills.findIndex(i => i.id === s.id);
          if (idx !== -1) {
            this.skills.splice(idx, 1);
            this.selectedSkill = this.skills[0] || null;
            this._renderLayout();
            this.notify('武学已成功删除');
          }
        }
      };
    }

    const saveBtn = this.container.querySelector('#saveSkillsBtn');
    if (saveBtn) {
      saveBtn.onclick = async () => {
        saveBtn.innerText = '⏳ 保存中...';
        s.name = this.container.querySelector('#sk_name').value.trim();
        s.id = this.container.querySelector('#sk_id').value.trim();
        s.type = this.container.querySelector('#sk_type').value;
        s.powerBase = parseFloat(this.container.querySelector('#sk_powerBase').value) || 5;
        s.powerStep = parseFloat(this.container.querySelector('#sk_powerStep').value) || 0.5;
        s.hard = parseFloat(this.container.querySelector('#sk_hard').value) || 2;
        s.cooldown = parseInt(this.container.querySelector('#sk_cooldown').value, 10) || 0;
        s.description = this.container.querySelector('#sk_description').value.trim();

        const res = await this.adapter.saveExternalSkills(this.skills);
        saveBtn.innerText = '💾 保存更改';
        if (res.success) {
          this.notify(`成功保存 ${this.skills.length} 门外功至 external-skills.json！${describeSaveState(res)}`, saveToastType(res));
          this._renderLayout();
        } else {
          this.notify('保存失败: ' + (res.error || '未知错误'), 'error');
        }
      };
    }
  }
}

/**
 * InternalSkillView: 内功心法工坊
 * 编辑 internal-skills.json：阴阳硬属性、三维成长系数、内嵌招式与技能词条 (affixes)。
 */
class InternalSkillView {
  constructor(adapter, refIndex, onSaveNotification) {
    this.adapter = adapter;
    this.refIndex = refIndex;
    this.resolver = new ResourceResolver(refIndex);
    this.affixEditor = new AffixEditor(refIndex);
    this.notify = onSaveNotification;
    this.skills = [];
    this.selectedSkill = null;
    this.searchKeyword = '';
    this.container = null;
  }

  render(parentEl) {
    this.container = parentEl;
    this.skills = this.adapter.loadInternalSkills();
    if (this.skills.length > 0 && !this.selectedSkill) {
      this.selectedSkill = this.skills[0];
    }
    this._renderLayout();
  }

  _getFiltered() {
    return this.skills.filter(s => {
      return !this.searchKeyword ||
        (s.name && s.name.includes(this.searchKeyword)) ||
        (s.id && s.id.includes(this.searchKeyword));
    });
  }

  _renderLayout() {
    this.container.innerHTML = `
      <div class="view-split-layout">
        <div class="sidebar-panel">
          <div class="sidebar-header">
            <input type="text" id="internalSkillSearch" class="search-input" placeholder="🔍 搜索内功名称或ID..." value="${this.searchKeyword}">
            <button id="addInternalSkillBtn" class="btn btn-primary" style="width: 100%; margin-top: 8px;">+ 新创内功心法</button>
          </div>
          <div class="item-list-scroll" id="internalSkillList">
            ${this._renderListHtml()}
          </div>
        </div>
        <div class="detail-panel" id="internalSkillDetail">
          ${this.selectedSkill ? this._renderDetailHtml(this.selectedSkill) : '<div class="empty-hint" style="padding:40px; text-align:center; color:var(--text-muted);">请选择一门内功进行调校</div>'}
        </div>
      </div>
    `;
    this._bindEvents();
  }

  _renderListHtml() {
    const list = this._getFiltered();
    if (list.length === 0) return '<div class="empty-list" style="padding:40px; text-align:center; color:var(--text-muted);">未找到匹配的内功</div>';
    return list.map(s => {
      const isSelected = this.selectedSkill && s.id === this.selectedSkill.id;
      const affixCount = (s.affixes || []).length;
      return `
        <div class="list-item-card ${isSelected ? 'active' : ''}" data-id="${s.id}">
          <div class="item-card-content">
            <div class="item-title-row">
              <span class="item-name text-gold">${s.name || s.id}</span>
              <span class="item-badge badge-purple">${affixCount}词条</span>
            </div>
            <div class="item-meta-row">
              <span class="meta-id">ID: ${s.id}</span>
              <span>阴${s.yin ?? 0} · 阳${s.yang ?? 0} · 刚${s.hard ?? 1}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  _renderDetailHtml(s) {
    return `
      <div class="form-scroll-wrapper">
        <div class="detail-header">
          <h2>${s.name || s.id} <span class="img-placeholder" style="display:inline-flex; width:36px; height:36px; vertical-align:middle;"><span>🧘</span></span></h2>
          <div class="detail-subtitle">ID: <code>${s.id}</code> · 内嵌招式 ${(s.formSkills || []).length} 个 · 词条 ${(s.affixes || []).length} 条</div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button id="saveInternalSkillsBtn" class="btn btn-primary">💾 保存更改</button>
            <button id="dupInternalSkillBtn" class="btn btn-secondary">⧉ 克隆</button>
            <button id="delInternalSkillBtn" class="btn btn-danger">🗑️ 删除</button>
          </div>
        </div>

        <div class="form-card">
          <h3>🧾 基础信息</h3>
          <div class="form-row">
            <div class="form-group"><label>名称 (name)</label><input type="text" class="input-field" id="is_name" value="${s.name || ''}"></div>
            <div class="form-group"><label>唯一ID (id)</label><input type="text" class="input-field" id="is_id" value="${s.id || ''}"></div>
            <div class="form-group">
              <label>图标 (icon)</label>
              <div style="display:flex; gap:6px; align-items:center;">
                <input type="text" class="input-field" id="is_icon" value="${s.icon || ''}" placeholder="icon/icon_neigong_001" style="flex:1;">
                <button class="btn btn-secondary btn-sm" id="pickInternalIconBtn">🖼️ 挑选</button>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>说明 (description)</label>
            <textarea class="input-field" id="is_description" rows="2">${s.description || ''}</textarea>
          </div>
        </div>

        <div class="form-card">
          <h3>⚖️ 阴阳刚柔与成长系数</h3>
          <div class="form-row">
            <div class="form-group"><label>刚 (hard)</label><input type="number" step="0.1" class="input-field" id="is_hard" value="${s.hard != null ? s.hard : 1}"></div>
            <div class="form-group"><label>阴 (yin)</label><input type="number" class="input-field" id="is_yin" value="${s.yin != null ? s.yin : 0}"></div>
            <div class="form-group"><label>阳 (yang)</label><input type="number" class="input-field" id="is_yang" value="${s.yang != null ? s.yang : 0}"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>攻击系数 (attackScale)</label><input type="number" step="0.01" class="input-field" id="is_attack" value="${s.attackScale != null ? s.attackScale : 0}"></div>
            <div class="form-group"><label>防御系数 (defenceScale)</label><input type="number" step="0.01" class="input-field" id="is_defence" value="${s.defenceScale != null ? s.defenceScale : 0}"></div>
            <div class="form-group"><label>暴击系数 (criticalScale)</label><input type="number" step="0.01" class="input-field" id="is_critical" value="${s.criticalScale != null ? s.criticalScale : 0}"></div>
          </div>
        </div>

        <div class="form-card">
          <h3>⚔️ 内嵌招式 (formSkills) — <span style="font-size:12px; color:var(--text-muted);">${(s.formSkills || []).length} 个，JSON 编辑</span></h3>
          <details>
            <summary style="cursor:pointer; font-size:13px; color:var(--accent-gold); margin-bottom:6px;">展开 JSON 编辑（数组，元素为完整招式定义）</summary>
            <textarea class="input-field" id="is_formSkills" rows="10" style="font-family:monospace; font-size:12px;">${JSON.stringify(s.formSkills || [], null, 2)}</textarea>
            <button class="btn btn-secondary btn-sm" id="applyFormSkillsBtn" style="margin-top:6px;">✔️ 应用招式 JSON</button>
          </details>
        </div>

        <div class="form-card">
          <h3>✨ 技能词条 (affixes) — 按等级/装备条件生效</h3>
          <div id="internalAffixHost">${this.affixEditor.render(s.affixes, { showRequiresEquipped: true })}</div>
        </div>
      </div>
    `;
  }

  _bindEvents() {
    const searchInput = this.container.querySelector('#internalSkillSearch');
    if (searchInput) {
      searchInput.oninput = (e) => {
        this.searchKeyword = e.target.value.trim();
        this.container.querySelector('#internalSkillList').innerHTML = this._renderListHtml();
        this._bindListClickEvents();
      };
    }

    const addBtn = this.container.querySelector('#addInternalSkillBtn');
    if (addBtn) {
      addBtn.onclick = () => {
        const ns = {
          id: 'new_neigong_' + Date.now().toString().slice(-4),
          name: '新内功心法',
          description: '',
          icon: null,
          hard: 1, yin: 0, yang: 0,
          attackScale: 0, defenceScale: 0, criticalScale: 0,
          formSkills: [],
          affixes: []
        };
        this.skills.unshift(ns);
        this.selectedSkill = ns;
        this._renderLayout();
        this.notify('已新建内功心法，请调校后保存！');
      };
    }

    this._bindListClickEvents();

    if (!this.selectedSkill) return;
    const s = this.selectedSkill;
    const self = this;

    const pickIconBtn = this.container.querySelector('#pickInternalIconBtn');
    if (pickIconBtn) {
      pickIconBtn.onclick = () => {
        MediaPickerModal.open({
          type: 'icon',
          title: '挑选内功图标',
          current: s.icon,
          refIndex: this.refIndex,
          resourceResolver: this.resolver,
          onSelect: (ref) => {
            s.icon = ref;
            this._renderLayout();
          }
        });
      };
    }

    const applyFsBtn = this.container.querySelector('#applyFormSkillsBtn');
    if (applyFsBtn) {
      applyFsBtn.onclick = () => {
        try {
          const parsed = JSON.parse(this.container.querySelector('#is_formSkills').value);
          if (!Array.isArray(parsed)) throw new Error('必须是 JSON 数组');
          s.formSkills = parsed;
          this.notify(`内嵌招式已应用（${parsed.length} 个），记得保存`);
        } catch (err) {
          alert('招式 JSON 解析失败: ' + err.message);
        }
      };
    }

    const affixHost = this.container.querySelector('#internalAffixHost');
    if (affixHost) {
      this.affixEditor.bind(affixHost, s.affixes, (r) => this._onAffixChange(affixHost, s, r));
    }

    const dupBtn = this.container.querySelector('#dupInternalSkillBtn');
    if (dupBtn) {
      dupBtn.onclick = () => {
        const cloned = JSON.parse(JSON.stringify(s));
        cloned.id = s.id + '_copy';
        cloned.name = (s.name || s.id) + ' (副本)';
        this.skills.unshift(cloned);
        this.selectedSkill = cloned;
        this._renderLayout();
        this.notify('内功克隆成功！');
      };
    }

    const delBtn = this.container.querySelector('#delInternalSkillBtn');
    if (delBtn) {
      delBtn.onclick = () => {
        if (!confirm(`确定删除内功《${s.name || s.id}》吗？`)) return;
        const idx = this.skills.findIndex(x => x.id === s.id);
        if (idx !== -1) this.skills.splice(idx, 1);
        this.selectedSkill = this.skills[0] || null;
        this._renderLayout();
        this.notify('内功已删除');
      };
    }

    const saveBtn = this.container.querySelector('#saveInternalSkillsBtn');
    if (saveBtn) {
      saveBtn.onclick = async () => {
        saveBtn.innerText = '⏳ 保存中...';
        s.name = this.container.querySelector('#is_name').value.trim();
        s.id = this.container.querySelector('#is_id').value.trim() || s.id;
        s.icon = this.container.querySelector('#is_icon').value.trim() || null;
        s.description = this.container.querySelector('#is_description').value;
        s.hard = parseFloat(this.container.querySelector('#is_hard').value) || 0;
        s.yin = parseFloat(this.container.querySelector('#is_yin').value) || 0;
        s.yang = parseFloat(this.container.querySelector('#is_yang').value) || 0;
        s.attackScale = parseFloat(this.container.querySelector('#is_attack').value) || 0;
        s.defenceScale = parseFloat(this.container.querySelector('#is_defence').value) || 0;
        s.criticalScale = parseFloat(this.container.querySelector('#is_critical').value) || 0;

        const res = await this.adapter.saveInternalSkills(self.skills);
        saveBtn.innerText = '💾 保存更改';
        if (res.success) {
          this.notify(`成功保存 ${self.skills.length} 门内功至 internal-skills.json！${describeSaveState(res)}`, saveToastType(res));
          this._renderLayout();
        } else {
          this.notify('保存失败: ' + (res.error || '未知错误'), 'error');
        }
      };
    }
  }

  _onAffixChange(affixHost, s, rebuild) {
    if (rebuild) {
      affixHost.innerHTML = this.affixEditor.render(s.affixes, { showRequiresEquipped: true });
      this.affixEditor.bind(affixHost, s.affixes, (r) => this._onAffixChange(affixHost, s, r));
    }
  }

  _bindListClickEvents() {
    this.container.querySelectorAll('.list-item-card').forEach(card => {
      card.onclick = () => {
        const id = card.dataset.id;
        this.selectedSkill = this.skills.find(s => s.id === id);
        this.container.querySelectorAll('.list-item-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        this.container.querySelector('#internalSkillDetail').innerHTML = this.selectedSkill ? this._renderDetailHtml(this.selectedSkill) : '';
        this._bindEvents();
      };
    });
  }
}

/**

class MartialArtsHubView {

    this.notify = onSaveNotification;
    this.activeMode = 'external';
  }

  _modes() {
    return [
      { key: 'external', label: '🗡️ 外功招式', create: () => new SkillView(this.adapter, this.refIndex, this.notify) },
      { key: 'internal', label: '🧘 内功心法', create: () => new InternalSkillView(this.adapter, this.refIndex, this.notify) },
      { key: 'special', label: '⚡ 绝技', create: () => new SpecialSkillView(this.adapter, this.refIndex, this.notify) },
      { key: 'legend', label: '🌟 传奇技', create: () => new LegendSkillView(this.adapter, this.refIndex, this.notify) }
    ];

    const modes = this._modes();
    if (!modes.some(m => m.key === this.activeMode)) this.activeMode = 'external';

      <div class="hub-subtabs">

/**
 * SimpleAffixDocView: 通用「名称+说明+简单字段+affix 词条」数据工坊视图
 * 天赋 (talents) / 状态 (buffs) 等同构数据共用，由 cfg 驱动差异字段。
 */
class SimpleAffixDocView {
  constructor(adapter, refIndex, onSaveNotification, cfg) {
    this.adapter = adapter;
    this.refIndex = refIndex;
    this.affixEditor = new AffixEditor(refIndex);
    this.notify = onSaveNotification;
    this.cfg = cfg;
    this.docs = [];
    this.selectedDoc = null;
    this.searchKeyword = '';
    this.container = null;
  }

  render(parentEl) {
    this.container = parentEl;
    this.docs = this.cfg.load();
    if (this.docs.length > 0 && !this.selectedDoc) {
      this.selectedDoc = this.docs[0];
    }
    this._renderLayout();
  }

  _getFiltered() {
    return this.docs.filter(d => {
      return !this.searchKeyword ||
        (d.name && d.name.includes(this.searchKeyword)) ||
        (d.id && d.id.includes(this.searchKeyword));
    });
  }

  _renderLayout() {
    this.container.innerHTML = `
      <div class="view-split-layout">
        <div class="sidebar-panel">
          <div class="sidebar-header">
            <input type="text" id="sadSearch" class="search-input" placeholder="🔍 搜索${this.cfg.itemNoun}..." value="${this.searchKeyword}">
            <button id="sadAddBtn" class="btn btn-primary" style="width: 100%; margin-top: 8px;">+ 新建${this.cfg.itemNoun}</button>
          </div>
          <div class="item-list-scroll" id="sadList">
            ${this._renderListHtml()}
          </div>
        </div>
        <div class="detail-panel" id="sadDetail">
          ${this.selectedDoc ? this._renderDetailHtml(this.selectedDoc) : `<div class="empty-hint" style="padding:40px; text-align:center; color:var(--text-muted);">请选择一个${this.cfg.itemNoun}</div>`}
        </div>
      </div>
    `;
    this._bindEvents();
  }

  _renderListHtml() {
    const list = this._getFiltered();
    if (list.length === 0) return `<div class="empty-list" style="padding:40px; text-align:center; color:var(--text-muted);">未找到匹配的${this.cfg.itemNoun}</div>`;
    return list.map(d => {
      const isSelected = this.selectedDoc && d.id === this.selectedDoc.id;
      const meta = this.cfg.listMeta ? this.cfg.listMeta(d) : '';
      return `
        <div class="list-item-card ${isSelected ? 'active' : ''}" data-id="${d.id}">
          <div class="item-card-content">
            <div class="item-title-row">
              <span class="item-name text-gold">${d.name || d.id}</span>
              <span class="item-badge badge-purple">${(d.affixes || []).length}词条</span>
            </div>
            <div class="item-meta-row">
              <span class="meta-id">ID: ${d.id}</span>
              ${meta}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  _renderDetailHtml(d) {
    const numberFields = (this.cfg.numbers || []).map(f => `
      <div class="form-group">
        <label>${f.label} (${f.key})</label>
        <input type="number" step="${f.step || 1}" class="input-field sad-num" data-key="${f.key}" value="${d[f.key] != null ? d[f.key] : (f.def != null ? f.def : 0)}">
      </div>
    `).join('');

    const selectFields = (this.cfg.selects || []).map(f => `
      <div class="form-group">
        <label>${f.label} (${f.key})</label>
        <select class="input-field sad-sel" data-key="${f.key}">
          ${f.options.map(o => `<option value="${String(o.value)}" ${String(d[f.key]) === String(o.value) ? 'selected' : ''}>${o.label}</option>`).join('')}
        </select>
      </div>
    `).join('');

    const idListEditors = (this.cfg.idLists || []).map(f => {
      const ids = Array.isArray(d[f.key]) ? d[f.key] : [];
      const source = f.source() || [];
      return `
        <div class="form-group" style="margin-top:8px;">
          <label>${f.label} (${f.key}) — ${ids.length} 个</label>
          <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;">
            ${ids.map((tid, i) => `<span class="req-chip">${tid} <button class="sad-idlist-del btn btn-danger btn-sm" data-key="${f.key}" data-idx="${i}" style="padding:0 6px;">✕</button></span>`).join('') || '<span style="font-size:12px; color:var(--text-muted);">无</span>'}
          </div>
          <div style="display:flex; gap:6px;">
            <select class="input-field sad-idlist-new" data-key="${f.key}" style="width:220px;">
              ${source.map(id => `<option value="${id}">${id}</option>`).join('')}
            </select>
            <button class="btn btn-secondary btn-sm sad-idlist-add" data-key="${f.key}" type="button">+ 添加</button>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="form-scroll-wrapper">
        <div class="detail-header">
          <h2>${d.name || d.id}</h2>
          <div class="detail-subtitle">ID: <code>${d.id}</code> · 词条 ${(d.affixes || []).length} 条</div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button id="sadSaveBtn" class="btn btn-primary">💾 保存更改</button>
            <button id="sadDupBtn" class="btn btn-secondary">⧉ 克隆</button>
            <button id="sadDelBtn" class="btn btn-danger">🗑️ 删除</button>
          </div>
        </div>

        <div class="form-card">
          <h3>🧾 基础信息</h3>
          <div class="form-row">
            <div class="form-group"><label>名称 (name)</label><input type="text" class="input-field" id="sad_name" value="${d.name || ''}"></div>
            <div class="form-group"><label>唯一ID (id)</label><input type="text" class="input-field" id="sad_id" value="${d.id || ''}"></div>
          </div>
          <div class="form-group">
            <label>说明 (description)</label>
            <textarea class="input-field" id="sad_description" rows="2">${d.description || ''}</textarea>
          </div>
        </div>

        ${(this.cfg.numbers || []).length || (this.cfg.selects || []).length ? `
        <div class="form-card">
          <h3>⚙️ 参数</h3>
          <div class="form-row">${numberFields}${selectFields}</div>
        </div>` : ''}

        ${idListEditors ? `<div class="form-card"><h3>🔗 关联</h3>${idListEditors}</div>` : ''}

        <div class="form-card">
          <h3>✨ 词条 (affixes)</h3>
          <div id="sadAffixHost">${this.affixEditor.render(d.affixes, { showRequiresEquipped: this.cfg.showRequiresEquipped !== false })}</div>
        </div>
      </div>
    `;
  }

  _bindEvents() {
    const searchInput = this.container.querySelector('#sadSearch');
    if (searchInput) {
      searchInput.oninput = (e) => {
        this.searchKeyword = e.target.value.trim();
        this.container.querySelector('#sadList').innerHTML = this._renderListHtml();
        this._bindListClickEvents();
      };
    }

    const addBtn = this.container.querySelector('#sadAddBtn');
    if (addBtn) {
      addBtn.onclick = () => {
        const d = this.cfg.defaults();
        this.docs.unshift(d);
        this.selectedDoc = d;
        this._renderLayout();
        this.notify(`已新建${this.cfg.itemNoun}，请调校后保存！`);
      };
    }

    this._bindListClickEvents();
    if (!this.selectedDoc) return;
    const d = this.selectedDoc;

    const affixHost = this.container.querySelector('#sadAffixHost');
    if (affixHost) {
      this.affixEditor.bind(affixHost, d.affixes, (r) => this._onAffixChange(affixHost, d, r));
    }

    this.container.querySelectorAll('.sad-idlist-add').forEach(btn => {
      btn.onclick = () => {
        const key = btn.dataset.key;
        const sel = this.container.querySelector(`.sad-idlist-new[data-key="${key}"]`);
        if (sel && sel.value) {
          if (!Array.isArray(d[key])) d[key] = [];
          if (!d[key].includes(sel.value)) {
            d[key].push(sel.value);
            this._renderLayout();
          }
        }
      };
    });

    this.container.querySelectorAll('.sad-idlist-del').forEach(btn => {
      btn.onclick = () => {
        const key = btn.dataset.key;
        d[key].splice(parseInt(btn.dataset.idx, 10), 1);
        this._renderLayout();
      };
    });

    const dupBtn = this.container.querySelector('#sadDupBtn');
    if (dupBtn) {
      dupBtn.onclick = () => {
        const cloned = JSON.parse(JSON.stringify(d));
        cloned.id = d.id + '_copy';
        cloned.name = (d.name || d.id) + ' (副本)';
        this.docs.unshift(cloned);
        this.selectedDoc = cloned;
        this._renderLayout();
        this.notify('克隆成功！');
      };
    }

    const delBtn = this.container.querySelector('#sadDelBtn');
    if (delBtn) {
      delBtn.onclick = () => {
        if (!confirm(`确定删除《${d.name || d.id}》吗？`)) return;
        const idx = this.docs.findIndex(x => x.id === d.id);
        if (idx !== -1) this.docs.splice(idx, 1);
        this.selectedDoc = this.docs[0] || null;
        this._renderLayout();
        this.notify('已删除');
      };
    }

    const saveBtn = this.container.querySelector('#sadSaveBtn');
    if (saveBtn) {
      saveBtn.onclick = async () => {
        saveBtn.innerText = '⏳ 保存中...';
        d.name = this.container.querySelector('#sad_name').value.trim();
        d.id = this.container.querySelector('#sad_id').value.trim() || d.id;
        d.description = this.container.querySelector('#sad_description').value;
        (this.cfg.numbers || []).forEach(f => {
          const el = this.container.querySelector(`.sad-num[data-key="${f.key}"]`);
          if (el) d[f.key] = f.integer ? (parseInt(el.value, 10) || 0) : (parseFloat(el.value) || 0);
        });
        (this.cfg.selects || []).forEach(f => {
          const el = this.container.querySelector(`.sad-sel[data-key="${f.key}"]`);
          if (el) d[f.key] = f.parseBoolean ? el.value === 'true' : el.value;
        });

        const res = await this.cfg.save(this.docs);
        saveBtn.innerText = '💾 保存更改';
        if (res.success) {
          this.notify(`成功保存 ${this.docs.length} 个${this.cfg.itemNoun}${describeSaveState(res)}`, saveToastType(res));
          this._renderLayout();
        } else {
          this.notify('保存失败: ' + (res.error || '未知错误'), 'error');
        }
      };
    }
  }

  _onAffixChange(affixHost, d, rebuild) {
    if (rebuild) {
      affixHost.innerHTML = this.affixEditor.render(d.affixes, { showRequiresEquipped: this.cfg.showRequiresEquipped !== false });
      this.affixEditor.bind(affixHost, d.affixes, (r) => this._onAffixChange(affixHost, d, r));
    }
  }

  _bindListClickEvents() {
    this.container.querySelectorAll('.list-item-card').forEach(card => {
      card.onclick = () => {
        const id = card.dataset.id;
        this.selectedDoc = this.docs.find(x => x.id === id);
        this.container.querySelectorAll('.list-item-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        this.container.querySelector('#sadDetail').innerHTML = this.selectedDoc ? this._renderDetailHtml(this.selectedDoc) : '';
        this._bindEvents();
      };
    });
  }
}

/**
 * BuffListEditor: 战斗状态 (buffs) 行编辑器
 * 元素结构: { id, level, duration, chance? } — 绝技/传奇技共用。
 */
class BuffListEditor {
  static html(arr, opts = {}) {
    const list = Array.isArray(arr) ? arr : [];
    return `
      <div class="buff-list-editor" data-buff-host="1">
        ${list.length === 0 ? '<div class="empty-hint" style="font-size:12.5px; padding:6px; color:var(--text-muted);">暂无状态条目</div>' : list.map((b, i) => `
          <div class="affix-row" data-idx="${i}">
            <div class="affix-row-body">
              <input type="text" class="input-field bl-id" data-idx="${i}" value="${b.id || ''}" placeholder="状态ID" style="width:150px;" list="affixBuffIdList">
              <label class="affix-eq">等级 <input type="number" class="input-field bl-level" data-idx="${i}" value="${b.level != null ? b.level : 1}" min="1" style="width:60px;"></label>
              <label class="affix-eq">持续 <input type="number" class="input-field bl-duration" data-idx="${i}" value="${b.duration != null ? b.duration : 2}" min="1" style="width:60px;"></label>
              <label class="affix-eq">几率% <input type="number" class="input-field bl-chance" data-idx="${i}" value="${b.chance != null ? b.chance : ''}" min="1" max="100" style="width:64px;"></label>
              <button class="btn btn-danger btn-sm bl-del" data-idx="${i}" type="button">✕</button>
            </div>
          </div>
        `).join('')}
        <button class="btn btn-secondary btn-sm bl-add" type="button">+ 添加状态</button>
      </div>
    `;
  }

  static bind(rootEl, arr, onChange) {
    const host = rootEl.querySelector('[data-buff-host]') || rootEl;
    if (!host || !Array.isArray(arr)) return;
    host.querySelectorAll('.bl-add').forEach(btn => {
      btn.onclick = () => { arr.push({ id: '', level: 1, duration: 2 }); onChange(true); };
    });
    host.querySelectorAll('.bl-del').forEach(btn => {
      btn.onclick = () => { arr.splice(parseInt(btn.dataset.idx, 10), 1); onChange(true); };
    });
    host.querySelectorAll('.bl-id').forEach(inp => {
      inp.onchange = () => { const b = arr[parseInt(inp.dataset.idx, 10)]; if (b) b.id = inp.value.trim(); onChange(false); };
    });
    host.querySelectorAll('.bl-level').forEach(inp => {
      inp.onchange = () => { const b = arr[parseInt(inp.dataset.idx, 10)]; if (b) b.level = parseInt(inp.value, 10) || 1; onChange(false); };
    });
    host.querySelectorAll('.bl-duration').forEach(inp => {
      inp.onchange = () => { const b = arr[parseInt(inp.dataset.idx, 10)]; if (b) b.duration = parseInt(inp.value, 10) || 1; onChange(false); };
    });
    host.querySelectorAll('.bl-chance').forEach(inp => {
      inp.onchange = () => {
        const b = arr[parseInt(inp.dataset.idx, 10)];
        if (!b) return;
        const v = parseInt(inp.value, 10);
        if (v > 0) b.chance = v; else delete b.chance;
        onChange(false);
      };
    });
  }
}
