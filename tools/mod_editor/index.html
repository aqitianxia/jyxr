          ${f.options.map(o => `<option value="${String(o.value)}" ${String(d[f.key]) === String(o.value) ? 'selected' : ''}>${o.label}</option>`).join('')}
        </select>
      </div>
    `).join('');

    const idListEditors = (this.cfg.idLists || []).map(f => {
      const ids = Array.isArray(d[f.key]) ? d[f.key] : [];
      const source = f.source() || [];
      return `
        <div class="form-group" style="margin-top:8px;">
          <label>${f.label} (${f.key}) — ${ids.length} 个</label>
          <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;">
            ${ids.map((tid, i) => `<span class="req-chip">${tid} <button class="sad-idlist-del btn btn-danger btn-sm" data-key="${f.key}" data-idx="${i}" style="padding:0 6px;">✕</button></span>`).join('') || '<span style="font-size:12px; color:var(--text-muted);">无</span>'}
          </div>
          <div style="display:flex; gap:6px;">
            <select class="input-field sad-idlist-new" data-key="${f.key}" style="width:220px;">
              ${source.map(id => `<option value="${id}">${id}</option>`).join('')}
            </select>
            <button class="btn btn-secondary btn-sm sad-idlist-add" data-key="${f.key}" type="button">+ 添加</button>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="form-scroll-wrapper">
        <div class="detail-header">
          <h2>${d.name || d.id}</h2>
          <div class="detail-subtitle">ID: <code>${d.id}</code> · 词条 ${(d.affixes || []).length} 条</div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button id="sadSaveBtn" class="btn btn-primary">💾 保存更改</button>
            <button id="sadDupBtn" class="btn btn-secondary">⧉ 克隆</button>
            <button id="sadDelBtn" class="btn btn-danger">🗑️ 删除</button>
          </div>
        </div>

        <div class="form-card">
          <h3>🧾 基础信息</h3>
          <div class="form-row">
            <div class="form-group"><label>名称 (name)</label><input type="text" class="input-field" id="sad_name" value="${d.name || ''}"></div>
            <div class="form-group"><label>唯一ID (id)</label><input type="text" class="input-field" id="sad_id" value="${d.id || ''}"></div>
          </div>
          <div class="form-group">
            <label>说明 (description)</label>
            <textarea class="input-field" id="sad_description" rows="2">${d.description || ''}</textarea>
          </div>
        </div>

        ${(this.cfg.numbers || []).length || (this.cfg.selects || []).length ? `
        <div class="form-card">
          <h3>⚙️ 参数</h3>
          <div class="form-row">${numberFields}${selectFields}</div>
        </div>` : ''}

        ${idListEditors ? `<div class="form-card"><h3>🔗 关联</h3>${idListEditors}</div>` : ''}

        <div class="form-card">
          <h3>✨ 词条 (affixes)</h3>
          <div id="sadAffixHost">${this.affixEditor.render(d.affixes, { showRequiresEquipped: this.cfg.showRequiresEquipped !== false })}</div>
        </div>
      </div>
    `;
  }

  _bindEvents() {
    const searchInput = this.container.querySelector('#sadSearch');
    if (searchInput) {
      searchInput.oninput = (e) => {
        this.searchKeyword = e.target.value.trim();
        this.container.querySelector('#sadList').innerHTML = this._renderListHtml();
        this._bindListClickEvents();
      };
    }

    const addBtn = this.container.querySelector('#sadAddBtn');
    if (addBtn) {
      addBtn.onclick = () => {
        const d = this.cfg.defaults();
        this.docs.unshift(d);
        this.selectedDoc = d;
        this._renderLayout();
        this.notify(`已新建${this.cfg.itemNoun}，请调校后保存！`);
      };
    }

    this._bindListClickEvents();
    if (!this.selectedDoc) return;
    const d = this.selectedDoc;

    const affixHost = this.container.querySelector('#sadAffixHost');
    if (affixHost) {
      this.affixEditor.bind(affixHost, d.affixes, (r) => this._onAffixChange(affixHost, d, r));
    }

    this.container.querySelectorAll('.sad-idlist-add').forEach(btn => {
      btn.onclick = () => {
        const key = btn.dataset.key;
        const sel = this.container.querySelector(`.sad-idlist-new[data-key="${key}"]`);
        if (sel && sel.value) {
          if (!Array.isArray(d[key])) d[key] = [];
          if (!d[key].includes(sel.value)) {
            d[key].push(sel.value);
            this._renderLayout();
          }
        }
      };
    });

    this.container.querySelectorAll('.sad-idlist-del').forEach(btn => {
      btn.onclick = () => {
        const key = btn.dataset.key;
        d[key].splice(parseInt(btn.dataset.idx, 10), 1);
        this._renderLayout();
      };
    });

    const dupBtn = this.container.querySelector('#sadDupBtn');
    if (dupBtn) {
      dupBtn.onclick = () => {
        const cloned = JSON.parse(JSON.stringify(d));
        cloned.id = d.id + '_copy';
        cloned.name = (d.name || d.id) + ' (副本)';
        this.docs.unshift(cloned);
        this.selectedDoc = cloned;
        this._renderLayout();
        this.notify('克隆成功！');
      };
    }

    const delBtn = this.container.querySelector('#sadDelBtn');
    if (delBtn) {
      delBtn.onclick = () => {
        if (!confirm(`确定删除《${d.name || d.id}》吗？`)) return;
        const idx = this.docs.findIndex(x => x.id === d.id);
        if (idx !== -1) this.docs.splice(idx, 1);
        this.selectedDoc = this.docs[0] || null;
        this._renderLayout();
        this.notify('已删除');
      };
    }

    const saveBtn = this.container.querySelector('#sadSaveBtn');
    if (saveBtn) {
      saveBtn.onclick = async () => {
        saveBtn.innerText = '⏳ 保存中...';
        d.name = this.container.querySelector('#sad_name').value.trim();
        d.id = this.container.querySelector('#sad_id').value.trim() || d.id;
        d.description = this.container.querySelector('#sad_description').value;
        (this.cfg.numbers || []).forEach(f => {
          const el = this.container.querySelector(`.sad-num[data-key="${f.key}"]`);
          if (el) d[f.key] = f.integer ? (parseInt(el.value, 10) || 0) : (parseFloat(el.value) || 0);
        });
        (this.cfg.selects || []).forEach(f => {
          const el = this.container.querySelector(`.sad-sel[data-key="${f.key}"]`);
          if (el) d[f.key] = f.parseBoolean ? el.value === 'true' : el.value;
        });

        const res = await this.cfg.save(this.docs);
        saveBtn.innerText = '💾 保存更改';
        if (res.success) {
          this.notify(`成功保存 ${this.docs.length} 个${this.cfg.itemNoun}${describeSaveState(res)}`, saveToastType(res));
          this._renderLayout();
        } else {
          this.notify('保存失败: ' + (res.error || '未知错误'), 'error');
        }
      };
    }
  }

  _onAffixChange(affixHost, d, rebuild) {
    if (rebuild) {
      affixHost.innerHTML = this.affixEditor.render(d.affixes, { showRequiresEquipped: this.cfg.showRequiresEquipped !== false });
      this.affixEditor.bind(affixHost, d.affixes, (r) => this._onAffixChange(affixHost, d, r));
    }
  }

  _bindListClickEvents() {
    this.container.querySelectorAll('.list-item-card').forEach(card => {
      card.onclick = () => {
        const id = card.dataset.id;
        this.selectedDoc = this.docs.find(x => x.id === id);
        this.container.querySelectorAll('.list-item-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        this.container.querySelector('#sadDetail').innerHTML = this.selectedDoc ? this._renderDetailHtml(this.selectedDoc) : '';
        this._bindEvents();
      };
    });
  }
}

/**
 * BuffListEditor: 战斗状态 (buffs) 行编辑器
 * 元素结构: { id, level, duration, chance? } — 绝技/传奇技共用。
 */
class BuffListEditor {
  static html(arr, opts = {}) {
    const list = Array.isArray(arr) ? arr : [];
    return `
      <div class="buff-list-editor" data-buff-host="1">
        ${list.length === 0 ? '<div class="empty-hint" style="font-size:12.5px; padding:6px; color:var(--text-muted);">暂无状态条目</div>' : list.map((b, i) => `
          <div class="affix-row" data-idx="${i}">
            <div class="affix-row-body">
              <input type="text" class="input-field bl-id" data-idx="${i}" value="${b.id || ''}" placeholder="状态ID" style="width:150px;" list="affixBuffIdList">
              <label class="affix-eq">等级 <input type="number" class="input-field bl-level" data-idx="${i}" value="${b.level != null ? b.level : 1}" min="1" style="width:60px;"></label>
              <label class="affix-eq">持续 <input type="number" class="input-field bl-duration" data-idx="${i}" value="${b.duration != null ? b.duration : 2}" min="1" style="width:60px;"></label>
              <label class="affix-eq">几率% <input type="number" class="input-field bl-chance" data-idx="${i}" value="${b.chance != null ? b.chance : ''}" min="1" max="100" style="width:64px;"></label>
              <button class="btn btn-danger btn-sm bl-del" data-idx="${i}" type="button">✕</button>
            </div>
          </div>
        `).join('')}
        <button class="btn btn-secondary btn-sm bl-add" type="button">+ 添加状态</button>
      </div>
    `;
  }

  static bind(rootEl, arr, onChange) {
    const host = rootEl.querySelector('[data-buff-host]') || rootEl;
    if (!host || !Array.isArray(arr)) return;
    host.querySelectorAll('.bl-add').forEach(btn => {
      btn.onclick = () => { arr.push({ id: '', level: 1, duration: 2 }); onChange(true); };
    });
    host.querySelectorAll('.bl-del').forEach(btn => {
      btn.onclick = () => { arr.splice(parseInt(btn.dataset.idx, 10), 1); onChange(true); };
    });
    host.querySelectorAll('.bl-id').forEach(inp => {
      inp.onchange = () => { const b = arr[parseInt(inp.dataset.idx, 10)]; if (b) b.id = inp.value.trim(); onChange(false); };
    });
    host.querySelectorAll('.bl-level').forEach(inp => {
      inp.onchange = () => { const b = arr[parseInt(inp.dataset.idx, 10)]; if (b) b.level = parseInt(inp.value, 10) || 1; onChange(false); };
    });
    host.querySelectorAll('.bl-duration').forEach(inp => {
      inp.onchange = () => { const b = arr[parseInt(inp.dataset.idx, 10)]; if (b) b.duration = parseInt(inp.value, 10) || 1; onChange(false); };
    });
    host.querySelectorAll('.bl-chance').forEach(inp => {
      inp.onchange = () => {
        const b = arr[parseInt(inp.dataset.idx, 10)];
        if (!b) return;
        const v = parseInt(inp.value, 10);
        if (v > 0) b.chance = v; else delete b.chance;
        onChange(false);
      };
    });
  }
}

/**
 * TalentBuffHubView: 天赋与状态工坊 — talents / buffs 子页签
 */
class TalentBuffHubView {
  constructor(adapter, refIndex, onSaveNotification) {
    this.adapter = adapter;
    this.refIndex = refIndex;
    this.notify = onSaveNotification;
    this.activeMode = 'talents';
  }

  _modes() {
    return [
      {
        key: 'talents', label: '🌟 天赋', create: () => new SimpleAffixDocView(this.adapter, this.refIndex, this.notify, {
          itemNoun: '天赋',
          load: () => this.adapter.loadTalents(),
          save: (docs) => this.adapter.saveTalents(docs),
          listMeta: (d) => `<span>点数 ${d.point != null ? d.point : 1}</span>`,
          numbers: [{ key: 'point', label: '解锁点数', step: 1, integer: true, def: 1 }],
          idLists: [{ key: 'replaceTalentIds', label: '被替换/互斥天赋', source: () => this.refIndex.talents.map(t => t.id).filter(id => id !== (this.selectedDoc && this.selectedDoc.id)) }],
          showRequiresEquipped: false,
          defaults: () => ({ id: 'new_talent_' + Date.now().toString().slice(-4), name: '新天赋', description: '', point: 1, replaceTalentIds: [], affixes: [] })
        })
      },
      {
        key: 'buffs', label: '🌀 战斗状态', create: () => new SimpleAffixDocView(this.adapter, this.refIndex, this.notify, {
          itemNoun: '战斗状态',
          load: () => this.adapter.loadBuffs(),
          save: (docs) => this.adapter.saveBuffs(docs),
          listMeta: (d) => `<span>${d.isDebuff ? '🔻 减益' : '🔺 增益'}</span>`,
          selects: [{
            key: 'isDebuff', label: '类型', parseBoolean: true, options: [
              { value: 'false', label: '🔺 增益 (isDebuff: false)' },
              { value: 'true', label: '🔻 减益 (isDebuff: true)' }
            ]
          }],
          showRequiresEquipped: false,
          defaults: () => ({ id: 'new_buff_' + Date.now().toString().slice(-4), name: '新状态', description: '', isDebuff: false, affixes: [] })
        })
      }
    ];
  }

  render(parentEl) {
    const modes = this._modes();
    if (!modes.some(m => m.key === this.activeMode)) this.activeMode = 'talents';
    parentEl.innerHTML = `
      <div class="hub-subtabs">
        ${modes.map(m => `<button class="hub-subtab-btn ${m.key === this.activeMode ? 'active' : ''}" data-mode="${m.key}">${m.label}</button>`).join('')}
      </div>
      <div id="talentBuffSubContainer"></div>
    `;
    parentEl.querySelectorAll('.hub-subtab-btn').forEach(btn => {
      btn.onclick = () => {
        this.activeMode = btn.dataset.mode;
        parentEl.querySelectorAll('.hub-subtab-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === this.activeMode));
        this._renderActive(parentEl);
      };
    });
    this._renderActive(parentEl);
  }

  _renderActive(parentEl) {
    const mode = this._modes().find(m => m.key === this.activeMode) || this._modes()[0];
    const sub = parentEl.querySelector('#talentBuffSubContainer');
    if (sub) {
      sub.innerHTML = '';
      mode.create().render(sub);
    }
  }
}

/**
 * SpecialSkillView: 绝技工坊 (special-skills.json)
 */
class SpecialSkillView {
  constructor(adapter, refIndex, onSaveNotification) {
    this.adapter = adapter;
    this.refIndex = refIndex;
    this.resolver = new ResourceResolver(refIndex);
    this.notify = onSaveNotification;
    this.skills = [];
    this.selectedSkill = null;
    this.searchKeyword = '';
    this.container = null;
  }

  render(parentEl) {
    this.container = parentEl;
    this.skills = this.adapter.loadSpecialSkills();
    if (this.skills.length > 0 && !this.selectedSkill) this.selectedSkill = this.skills[0];
    this._renderLayout();
  }

  _getFiltered() {
    return this.skills.filter(s => !this.searchKeyword ||
      (s.name && s.name.includes(this.searchKeyword)) || (s.id && s.id.includes(this.searchKeyword)));
  }

  _renderLayout() {
    this.container.innerHTML = `
      <div class="view-split-layout">
        <div class="sidebar-panel">
          <div class="sidebar-header">
            <input type="text" id="spSkillSearch" class="search-input" placeholder="🔍 搜索绝技名称或ID..." value="${this.searchKeyword}">
            <button id="addSpSkillBtn" class="btn btn-primary" style="width:100%; margin-top:8px;">+ 新创绝技</button>
          </div>
          <div class="item-list-scroll" id="spSkillList">${this._renderListHtml()}</div>
        </div>
        <div class="detail-panel" id="spSkillDetail">
          ${this.selectedSkill ? this._renderDetailHtml(this.selectedSkill) : '<div class="empty-hint" style="padding:40px; text-align:center; color:var(--text-muted);">请选择一门绝技</div>'}
        </div>
      </div>
    `;
    this._bindEvents();
  }

  _renderListHtml() {
    const list = this._getFiltered();
    if (list.length === 0) return '<div class="empty-list" style="padding:40px; text-align:center; color:var(--text-muted);">未找到匹配的绝技</div>';
    return list.map(s => {
      const isSelected = this.selectedSkill && s.id === this.selectedSkill.id;
      const t = s.targeting || {};
      return `
        <div class="list-item-card ${isSelected ? 'active' : ''}" data-id="${s.id}">
          <div class="item-card-content">
            <div class="item-title-row">
              <span class="item-name text-gold">${s.name || s.id}</span>
              <span class="item-badge ${s.intent === 'Support' ? 'badge-green' : 'badge-red'}">${s.intent === 'Support' ? '支援' : '攻击'}</span>
            </div>
            <div class="item-meta-row">
              <span class="meta-id">ID: ${s.id}</span>
              <span>射程${t.castSize ?? '-'} · CD${s.cooldown ?? '-'}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  _renderDetailHtml(s) {
    const cost = s.cost || {};
    const t = s.targeting || {};
    const impactTypes = ['single', 'line', 'plus', 'square', 'star', 'fan', 'all'];
    const itOptions = (impactTypes.includes(t.impactType) || !t.impactType ? impactTypes : impactTypes.concat([t.impactType]));
    return `
      <div class="form-scroll-wrapper">
        <div class="detail-header">
          <h2>${s.name || s.id}</h2>
          <div class="detail-subtitle">ID: <code>${s.id}</code> · 状态 ${(s.buffs || []).length} · 效果 ${(s.effects || []).length}</div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button id="saveSpSkillsBtn" class="btn btn-primary">💾 保存更改</button>
            <button id="dupSpSkillBtn" class="btn btn-secondary">⧉ 克隆</button>
            <button id="delSpSkillBtn" class="btn btn-danger">🗑️ 删除</button>
          </div>
        </div>

        <div class="form-card">
          <h3>🧾 基础信息</h3>
          <div class="form-row">
            <div class="form-group"><label>名称 (name)</label><input type="text" class="input-field" id="sp_name" value="${s.name || ''}"></div>
            <div class="form-group"><label>唯一ID (id)</label><input type="text" class="input-field" id="sp_id" value="${s.id || ''}"></div>
            <div class="form-group">
              <label>类型 (intent)</label>
              <select class="input-field" id="sp_intent">
                <option value="Offensive" ${s.intent !== 'Support' ? 'selected' : ''}>⚔️ 攻击 (Offensive)</option>
                <option value="Support" ${s.intent === 'Support' ? 'selected' : ''}>🛡️ 支援 (Support)</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>图标 (icon)</label>
              <div style="display:flex; gap:6px;">
                <input type="text" class="input-field" id="sp_icon" value="${s.icon || ''}" style="flex:1;">
                <button class="btn btn-secondary btn-sm" id="pickSpIconBtn">🖼️</button>
              </div>
            </div>
            <div class="form-group"><label>演出动画 (animation)</label><input type="text" class="input-field" id="sp_animation" value="${s.animation || ''}"></div>
            <div class="form-group"><label>音效 (audio)</label><input type="text" class="input-field" id="sp_audio" value="${s.audio || ''}"></div>
          </div>
          <div class="form-group">
            <label>说明 (description)</label>
            <textarea class="input-field" id="sp_description" rows="2">${s.description || ''}</textarea>
          </div>
          <div class="form-group">
            <label>登场台词 (speech，每行一句)</label>
            <textarea class="input-field" id="sp_speech" rows="2">${(s.speech && s.speech.lines || []).join('\n')}</textarea>
          </div>
        </div>

        <div class="form-card">
          <h3>🎯 目标与消耗</h3>
          <div class="form-row">
            <div class="form-group"><label>施法射程 (castSize)</label><input type="number" class="input-field" id="sp_castSize" value="${t.castSize != null ? t.castSize : 1}" min="1" max="10"></div>
            <div class="form-group">
              <label>影响范围 (impactType)</label>
              <select class="input-field" id="sp_impactType">
                ${itOptions.map(v => `<option value="${v}" ${t.impactType === v ? 'selected' : ''}>${v}</option>`).join('')}
              </select>
            </div>
            <div class="form-group"><label>范围尺寸 (impactSize)</label><input type="number" class="input-field" id="sp_impactSize" value="${t.impactSize != null ? t.impactSize : 1}" min="1"></div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>允许自身为目标</label>
              <select class="input-field" id="sp_canCastAtSelf">
                <option value="true" ${t.canCastAtSelf ? 'selected' : ''}>是</option>
                <option value="false" ${!t.canCastAtSelf ? 'selected' : ''}>否</option>
              </select>
            </div>
            <div class="form-group">
              <label>范围可包含自身</label>
              <select class="input-field" id="sp_canImpactSelf">
                <option value="true" ${t.canImpactSelf ? 'selected' : ''}>是</option>
                <option value="false" ${!t.canImpactSelf ? 'selected' : ''}>否</option>
              </select>
            </div>
            <div class="form-group"><label>冷却 (cooldown)</label><input type="number" class="input-field" id="sp_cooldown" value="${s.cooldown != null ? s.cooldown : 0}" min="0"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>耗蓝 (cost.mp)</label><input type="number" class="input-field" id="sp_mp" value="${cost.mp != null ? cost.mp : 0}" min="0"></div>
            <div class="form-group"><label>耗怒气 (cost.rage)</label><input type="number" class="input-field" id="sp_rage" value="${cost.rage != null ? cost.rage : 0}" min="0"></div>
          </div>
        </div>

        <div class="form-card">
          <h3>🌀 附加状态 (buffs)</h3>
          ${BuffListEditor.html(s.buffs)}
        </div>

        <div class="form-card">
          <h3>✨ 战斗效果 (effects) — JSON 编辑</h3>
          <textarea class="input-field" id="sp_effects" rows="8" style="font-family:monospace; font-size:12px;">${JSON.stringify(s.effects || [], null, 2)}</textarea>
          <button class="btn btn-secondary btn-sm" id="applySpEffectsBtn" style="margin-top:6px;">✔️ 应用效果 JSON</button>
        </div>
      </div>
    `;
  }

  _bindEvents() {
    const searchInput = this.container.querySelector('#spSkillSearch');
    if (searchInput) {
      searchInput.oninput = (e) => {
        this.searchKeyword = e.target.value.trim();
        this.container.querySelector('#spSkillList').innerHTML = this._renderListHtml();
        this._bindListClickEvents();
      };
    }

    const addBtn = this.container.querySelector('#addSpSkillBtn');
    if (addBtn) {
      addBtn.onclick = () => {
        const ns = {
          id: 'new_jueji_' + Date.now().toString().slice(-4),
          name: '新绝技', description: '', intent: 'Offensive', icon: null,
          cooldown: 1, cost: { mp: 0, rage: 0 },
          targeting: { castSize: 1, impactType: 'single', impactSize: 1 },
          animation: null, audio: null, speech: null, buffs: [], effects: []
        };
        this.skills.unshift(ns);
        this.selectedSkill = ns;
        this._renderLayout();
        this.notify('已新建绝技，请调校后保存！');
      };
    }

    this._bindListClickEvents();
    if (!this.selectedSkill) return;
    const s = this.selectedSkill;

    const pickIconBtn = this.container.querySelector('#pickSpIconBtn');
    if (pickIconBtn) {
      pickIconBtn.onclick = () => {
        MediaPickerModal.open({
          type: 'icon', title: '挑选绝技图标', current: s.icon,
          refIndex: this.refIndex, resourceResolver: this.resolver,
          onSelect: (ref) => { s.icon = ref; this._renderLayout(); }
        });
      };
    }

    const applyEffectsBtn = this.container.querySelector('#applySpEffectsBtn');
    if (applyEffectsBtn) {
      applyEffectsBtn.onclick = () => {
        try {
          const parsed = JSON.parse(this.container.querySelector('#sp_effects').value);
          if (!Array.isArray(parsed)) throw new Error('必须是 JSON 数组');
          s.effects = parsed;
          this.notify(`战斗效果已应用（${parsed.length} 条），记得保存`);
        } catch (err) {
          alert('效果 JSON 解析失败: ' + err.message);
        }
      };
    }

    BuffListEditor.bind(this.container, s.buffs, (r) => this._onBuffChange(s, r));

    const dupBtn = this.container.querySelector('#dupSpSkillBtn');
    if (dupBtn) {
      dupBtn.onclick = () => {
        const cloned = JSON.parse(JSON.stringify(s));
        cloned.id = s.id + '_copy';
        cloned.name = (s.name || s.id) + ' (副本)';
        this.skills.unshift(cloned);
        this.selectedSkill = cloned;
        this._renderLayout();
        this.notify('绝技克隆成功！');
      };
    }

    const delBtn = this.container.querySelector('#delSpSkillBtn');
    if (delBtn) {
      delBtn.onclick = () => {
        if (!confirm(`确定删除绝技《${s.name || s.id}》吗？`)) return;
        const idx = this.skills.findIndex(x => x.id === s.id);
        if (idx !== -1) this.skills.splice(idx, 1);
        this.selectedSkill = this.skills[0] || null;
        this._renderLayout();
        this.notify('绝技已删除');
      };
    }

    const saveBtn = this.container.querySelector('#saveSpSkillsBtn');
    if (saveBtn) {
      saveBtn.onclick = async () => {
        saveBtn.innerText = '⏳ 保存中...';
        s.name = this.container.querySelector('#sp_name').value.trim();
        s.id = this.container.querySelector('#sp_id').value.trim() || s.id;
        s.intent = this.container.querySelector('#sp_intent').value;
        s.icon = this.container.querySelector('#sp_icon').value.trim() || null;
        s.animation = this.container.querySelector('#sp_animation').value.trim() || null;
        s.audio = this.container.querySelector('#sp_audio').value.trim() || null;
        s.description = this.container.querySelector('#sp_description').value;
        const speechLines = this.container.querySelector('#sp_speech').value.split('\n').map(x => x.trim()).filter(Boolean);
        s.speech = speechLines.length ? { lines: speechLines } : null;
        if (!s.targeting) s.targeting = {};
        s.targeting.castSize = parseInt(this.container.querySelector('#sp_castSize').value, 10) || 1;
        s.targeting.impactType = this.container.querySelector('#sp_impactType').value;
        s.targeting.impactSize = parseInt(this.container.querySelector('#sp_impactSize').value, 10) || 1;
        if (this.container.querySelector('#sp_canCastAtSelf').value === 'true') s.targeting.canCastAtSelf = true;
        else delete s.targeting.canCastAtSelf;
        if (this.container.querySelector('#sp_canImpactSelf').value === 'true') s.targeting.canImpactSelf = true;
        else delete s.targeting.canImpactSelf;
        s.cooldown = parseInt(this.container.querySelector('#sp_cooldown').value, 10) || 0;
        if (!s.cost) s.cost = {};
        s.cost.mp = parseInt(this.container.querySelector('#sp_mp').value, 10) || 0;
        s.cost.rage = parseInt(this.container.querySelector('#sp_rage').value, 10) || 0;

        const res = await this.adapter.saveSpecialSkills(this.skills);
        saveBtn.innerText = '💾 保存更改';
        if (res.success) {
          this.notify(`成功保存 ${this.skills.length} 门绝技${describeSaveState(res)}`, saveToastType(res));
          this._renderLayout();
        } else {
          this.notify('保存失败: ' + (res.error || '未知错误'), 'error');
        }
      };
    }
  }

  _onBuffChange(s, rebuild) {
    if (!rebuild) return;
    const card = Array.from(this.container.querySelectorAll('.form-card h3')).find(h => h.innerText.includes('附加状态'));
    if (card) {
      const old = card.parentElement.querySelector('.buff-list-editor');
      if (old) old.outerHTML = BuffListEditor.html(s.buffs);
      BuffListEditor.bind(this.container, s.buffs, (r) => this._onBuffChange(s, r));
    }
  }

  _bindListClickEvents() {
    this.container.querySelectorAll('.list-item-card').forEach(card => {
      card.onclick = () => {
        const id = card.dataset.id;
        this.selectedSkill = this.skills.find(s => s.id === id);
        this.container.querySelectorAll('.list-item-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        this.container.querySelector('#spSkillDetail').innerHTML = this.selectedSkill ? this._renderDetailHtml(this.selectedSkill) : '';
        this._bindEvents();
      };
    });
  }
}

/**
 * LegendSkillView: 传奇技工坊 (legend-skills.json)
 * 触发条件 (conditions)、概率、威力加成与附加状态编辑。
 */
class LegendSkillView {
  constructor(adapter, refIndex, onSaveNotification) {
    this.adapter = adapter;
    this.refIndex = refIndex;
    this.notify = onSaveNotification;
    this.skills = [];
    this.selectedSkill = null;
    this.searchKeyword = '';
    this.container = null;
  }

  render(parentEl) {
    this.container = parentEl;
    this.skills = this.adapter.loadLegendSkills();
    if (this.skills.length > 0 && !this.selectedSkill) this.selectedSkill = this.skills[0];
    this._renderLayout();
  }

  _getFiltered() {
    return this.skills.filter(s => !this.searchKeyword ||
      (s.name && s.name.includes(this.searchKeyword)) || (s.id && s.id.includes(this.searchKeyword)));
  }

  _renderLayout() {
    this.container.innerHTML = `
      <div class="view-split-layout">
        <div class="sidebar-panel">
          <div class="sidebar-header">
            <input type="text" id="lgSkillSearch" class="search-input" placeholder="🔍 搜索传奇技..." value="${this.searchKeyword}">
            <button id="addLgSkillBtn" class="btn btn-primary" style="width:100%; margin-top:8px;">+ 新创传奇技</button>
          </div>
          <div class="item-list-scroll" id="lgSkillList">${this._renderListHtml()}</div>
        </div>
        <div class="detail-panel" id="lgSkillDetail">
          ${this.selectedSkill ? this._renderDetailHtml(this.selectedSkill) : '<div class="empty-hint" style="padding:40px; text-align:center; color:var(--text-muted);">请选择一个传奇技</div>'}
        </div>
      </div>
    `;
    this._bindEvents();
  }

  _renderListHtml() {
    const list = this._getFiltered();
    if (list.length === 0) return '<div class="empty-list" style="padding:40px; text-align:center; color:var(--text-muted);">未找到匹配的传奇技</div>';
    return list.map(s => {
      const isSelected = this.selectedSkill && s.id === this.selectedSkill.id;
      return `
        <div class="list-item-card ${isSelected ? 'active' : ''}" data-id="${s.id}">
          <div class="item-card-content">
            <div class="item-title-row">
              <span class="item-name text-gold">${s.name || s.id}</span>
              <span class="item-badge badge-gold">${Math.round((s.probability || 0) * 100)}%</span>
            </div>
            <div class="item-meta-row">
              <span class="meta-id">${s.startSkill || '未绑定外功'}</span>
              <span>Lv${s.requiredLevel != null ? s.requiredLevel : '-'}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  _renderDetailHtml(s) {
    return `
      <div class="form-scroll-wrapper">
        <div class="detail-header">
          <h2>${s.name || s.id}</h2>
          <div class="detail-subtitle">ID: <code>${s.id}</code> · 触发外功: <code>${s.startSkill || '未绑定'}</code> · 条件 ${(s.conditions || []).length}</div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button id="saveLgSkillsBtn" class="btn btn-primary">💾 保存更改</button>
            <button id="dupLgSkillBtn" class="btn btn-secondary">⧉ 克隆</button>
            <button id="delLgSkillBtn" class="btn btn-danger">🗑️ 删除</button>
          </div>
        </div>

        <div class="form-card">
          <h3>🧾 基础与触发</h3>
          <div class="form-row">
            <div class="form-group"><label>名称 (name)</label><input type="text" class="input-field" id="lg_name" value="${s.name || ''}"></div>
            <div class="form-group"><label>唯一ID (id)</label><input type="text" class="input-field" id="lg_id" value="${s.id || ''}"></div>
            <div class="form-group">
              <label>绑定外功 (startSkill)</label>
              <input type="text" class="input-field" id="lg_startSkill" value="${s.startSkill || ''}" list="affixExtSkillIdList">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>触发几率 (probability 0~1)</label><input type="number" step="0.05" min="0" max="1" class="input-field" id="lg_probability" value="${s.probability != null ? s.probability : 0.3}"></div>
            <div class="form-group"><label>需求等级 (requiredLevel)</label><input type="number" class="input-field" id="lg_requiredLevel" value="${s.requiredLevel != null ? s.requiredLevel : 10}"></div>
            <div class="form-group"><label>威力加成 (powerExtra)</label><input type="number" step="0.1" class="input-field" id="lg_powerExtra" value="${s.powerExtra != null ? s.powerExtra : 0}"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>演出动画 (animation)</label><input type="text" class="input-field" id="lg_animation" value="${s.animation || ''}"></div>
          </div>
        </div>

        <div class="form-card">
          <h3>📜 触发条件 (conditions) — 满足全部条件才可触发</h3>
          <div id="lgCondHost">${this._condHtml(s.conditions)}</div>
        </div>

        <div class="form-card">
          <h3>🌀 附加状态 (buffs)</h3>
          ${BuffListEditor.html(s.buffs)}
        </div>
      </div>
    `;
  }

  _condHtml(conds) {
    const list = Array.isArray(conds) ? conds : [];
    const typeOptions = ['skill', 'internal_skill', 'talent', 'special_skill'];
    return `
      <div class="cond-list-editor" data-cond-host="1">
        ${list.length === 0 ? '<div class="empty-hint" style="font-size:12.5px; padding:6px; color:var(--text-muted);">无前置条件</div>' : list.map((c, i) => `
          <div class="affix-row" data-idx="${i}">
            <div class="affix-row-body">
              <select class="input-field cd-type" data-idx="${i}" style="width:150px;">
                ${typeOptions.map(t => `<option value="${t}" ${c.type === t ? 'selected' : ''}>${{ skill: '外功', internal_skill: '内功', talent: '天赋', special_skill: '绝技' }[t] || t}</option>`).join('')}
              </select>
              <input type="text" class="input-field cd-target" data-idx="${i}" value="${c.targetId || ''}" placeholder="目标ID" style="width:170px;">
              <label class="affix-eq">等级≥ <input type="number" class="input-field cd-level" data-idx="${i}" value="${c.level != null ? c.level : ''}" style="width:64px;"></label>
              <button class="btn btn-danger btn-sm cd-del" data-idx="${i}" type="button">✕</button>
            </div>
          </div>
        `).join('')}
        <button class="btn btn-secondary btn-sm cd-add" type="button">+ 添加条件</button>
      </div>
    `;
  }

  _bindCondEvents(s) {
    const host = this.container.querySelector('[data-cond-host]');
    if (!host || !Array.isArray(s.conditions)) return;
    host.querySelector('.cd-add').onclick = () => { s.conditions.push({ type: 'skill', targetId: '', level: 10 }); this._refreshConds(s); };
    host.querySelectorAll('.cd-del').forEach(btn => {
      btn.onclick = () => { s.conditions.splice(parseInt(btn.dataset.idx, 10), 1); this._refreshConds(s); };
    });
    host.querySelectorAll('.cd-type').forEach(sel => {
      sel.onchange = () => { const c = s.conditions[parseInt(sel.dataset.idx, 10)]; if (c) { c.type = sel.value; this._refreshConds(s); } };
    });
    host.querySelectorAll('.cd-target').forEach(inp => {
      inp.onchange = () => { const c = s.conditions[parseInt(inp.dataset.idx, 10)]; if (c) c.targetId = inp.value.trim(); };
    });
    host.querySelectorAll('.cd-level').forEach(inp => {
      inp.onchange = () => {
        const c = s.conditions[parseInt(inp.dataset.idx, 10)];
        if (!c) return;
        const v = parseInt(inp.value, 10);
        if (v > 0) c.level = v; else delete c.level;
      };
    });
  }

  _refreshConds(s) {
    const hostEl = this.container.querySelector('#lgCondHost');
    if (hostEl) {
      hostEl.innerHTML = this._condHtml(s.conditions);
      this._bindCondEvents(s);
    }
  }

  _bindEvents() {
    const searchInput = this.container.querySelector('#lgSkillSearch');
    if (searchInput) {
      searchInput.oninput = (e) => {
        this.searchKeyword = e.target.value.trim();
        this.container.querySelector('#lgSkillList').innerHTML = this._renderListHtml();
        this._bindListClickEvents();
      };
    }

    const addBtn = this.container.querySelector('#addLgSkillBtn');
    if (addBtn) {
      addBtn.onclick = () => {
        const ns = {
          id: 'new_legend_' + Date.now().toString().slice(-4),
          name: '新传奇技', startSkill: '', probability: 0.3, requiredLevel: 10,
          powerExtra: 0, animation: null, buffs: [], conditions: []
        };
        this.skills.unshift(ns);
        this.selectedSkill = ns;
        this._renderLayout();
        this.notify('已新建传奇技，请绑定外功并配置条件！');
      };
    }

    this._bindListClickEvents();
    if (!this.selectedSkill) return;
    const s = this.selectedSkill;

    this._bindCondEvents(s);
    BuffListEditor.bind(this.container, s.buffs, (r) => { if (r) this._refreshLegendBuffs(s); });

    const dupBtn = this.container.querySelector('#dupLgSkillBtn');
    if (dupBtn) {
      dupBtn.onclick = () => {
        const cloned = JSON.parse(JSON.stringify(s));
        cloned.id = s.id + '_copy';
        cloned.name = (s.name || s.id) + ' (副本)';
        this.skills.unshift(cloned);
        this.selectedSkill = cloned;
        this._renderLayout();
        this.notify('传奇技克隆成功！');
      };
    }

    const delBtn = this.container.querySelector('#delLgSkillBtn');
    if (delBtn) {
      delBtn.onclick = () => {
        if (!confirm(`确定删除传奇技《${s.name || s.id}》吗？`)) return;
        const idx = this.skills.findIndex(x => x.id === s.id);
        if (idx !== -1) this.skills.splice(idx, 1);
        this.selectedSkill = this.skills[0] || null;
        this._renderLayout();
        this.notify('传奇技已删除');
      };
    }

    const saveBtn = this.container.querySelector('#saveLgSkillsBtn');
    if (saveBtn) {
      saveBtn.onclick = async () => {
        saveBtn.innerText = '⏳ 保存中...';
        s.name = this.container.querySelector('#lg_name').value.trim();
        s.id = this.container.querySelector('#lg_id').value.trim() || s.id;
        s.startSkill = this.container.querySelector('#lg_startSkill').value.trim() || null;
        s.probability = parseFloat(this.container.querySelector('#lg_probability').value) || 0;
        s.requiredLevel = parseInt(this.container.querySelector('#lg_requiredLevel').value, 10) || 0;
        s.powerExtra = parseFloat(this.container.querySelector('#lg_powerExtra').value) || 0;
        s.animation = this.container.querySelector('#lg_animation').value.trim() || null;

        const res = await this.adapter.saveLegendSkills(this.skills);
        saveBtn.innerText = '💾 保存更改';
        if (res.success) {
          this.notify(`成功保存 ${this.skills.length} 个传奇技${describeSaveState(res)}`, saveToastType(res));
          this._renderLayout();
        } else {
          this.notify('保存失败: ' + (res.error || '未知错误'), 'error');
        }
      };
    }
  }

  _refreshLegendBuffs(s) {
    const card = Array.from(this.container.querySelectorAll('.form-card h3')).find(h => h.innerText.includes('附加状态'));
    if (card) {
      const old = card.parentElement.querySelector('.buff-list-editor');
      if (old) old.outerHTML = BuffListEditor.html(s.buffs);
      BuffListEditor.bind(this.container, s.buffs, (r) => { if (r) this._refreshLegendBuffs(s); });
    }
  }

  _bindListClickEvents() {
    this.container.querySelectorAll('.list-item-card').forEach(card => {
      card.onclick = () => {
        const id = card.dataset.id;
        this.selectedSkill = this.skills.find(s => s.id === id);
        this.container.querySelectorAll('.list-item-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        this.container.querySelector('#lgSkillDetail').innerHTML = this.selectedSkill ? this._renderDetailHtml(this.selectedSkill) : '';
        this._bindEvents();
      };
    });
  }
}

  _productsHtml(products) {

                <option value="yuanbao" ${kind === 'yuanbao' ? 'selected' : ''}>💰 元宝 (yuanbao)</option>
              </select>
              <label class="affix-eq">银两 <input type="number" class="input-field pd-price" data-idx="${i}" value="${p.price != null ? p.price : ''}" min="0" style="width:90px;"></label>
              <label class="affix-eq">元宝 <input type="number" class="input-field pd-premium" data-idx="${i}" value="${p.premiumPrice != null ? p.premiumPrice : ''}" min="0" style="width:64px;"></label>
              <label class="affix-eq">限购 <input type="number" class="input-field pd-maxclaims" data-idx="${i}" value="${p.maxClaims != null ? p.maxClaims : ''}" min="0" style="width:64px;"></label>
              <button class="btn btn-danger btn-sm pd-del" data-idx="${i}" type="button">✕</button>
            </div>
            <div class="affix-row-body">
              <input type="text" class="input-field pd-productid" data-idx="${i}" value="${p.id || ''}" placeholder="商品显示ID" style="width:170px;">
              ${kind === 'item' ? `
                <input type="text" class="input-field pd-itemid" data-idx="${i}" value="${r.itemId || ''}" placeholder="物品ID" style="width:200px;" list="affixItemIdList">
              ` : kind === 'skill_max_level' ? `
                <select class="input-field pd-skillkind" data-idx="${i}" style="width:110px;">
                  <option value="external" ${r.skillKind === 'external' ? 'selected' : ''}>外功</option>
                  <option value="internal" ${r.skillKind === 'internal' ? 'selected' : ''}>内功</option>
                </select>
                <input type="text" class="input-field pd-skillid" data-idx="${i}" value="${r.skillId || ''}" placeholder="武学ID" style="width:180px;" list="affixExtSkillIdList">
              ` : ''}
            </div>
          </div>
        `; }).join('')}
        <button class="btn btn-secondary btn-sm pd-add" type="button">+ 添加商品</button>
      </div>
    `;
  }

  _bindProductEvents(s) {
    const host = this.container.querySelector('[data-product-host]');
    if (!host || !Array.isArray(s.products)) return;

    host.querySelector('.pd-add').onclick = () => {
      s.products.push({ id: '', reward: { kind: 'item', itemId: '' }, price: 100 });
      this._refreshProducts(s);
    };
    host.querySelectorAll('.pd-del').forEach(btn => {
      btn.onclick = () => { s.products.splice(parseInt(btn.dataset.idx, 10), 1); this._refreshProducts(s); };
    });
    host.querySelectorAll('.pd-kind').forEach(sel => {
      sel.onchange = () => {
        const p = s.products[parseInt(sel.dataset.idx, 10)];
        if (!p) return;
        if (sel.value === 'item') p.reward = { kind: 'item', itemId: '' };
        else if (sel.value === 'skill_max_level') p.reward = { kind: 'skill_max_level', skillKind: 'external', skillId: '' };
        else p.reward = { kind: 'yuanbao' };
        this._refreshProducts(s);
      };
    });
    host.querySelectorAll('.pd-productid').forEach(inp => {
      inp.onchange = () => { const p = s.products[parseInt(inp.dataset.idx, 10)]; if (p) p.id = inp.value.trim(); };
    });
    host.querySelectorAll('.pd-itemid').forEach(inp => {
      inp.onchange = () => {
        const p = s.products[parseInt(inp.dataset.idx, 10)];
        if (p) { p.reward.itemId = inp.value.trim(); if (!p.id) { p.id = inp.value.trim(); this._refreshProducts(s); } }
      };
    });
    host.querySelectorAll('.pd-skillkind').forEach(sel => {
      sel.onchange = () => { const p = s.products[parseInt(sel.dataset.idx, 10)]; if (p) p.reward.skillKind = sel.value; };
    });
    host.querySelectorAll('.pd-skillid').forEach(inp => {
      inp.onchange = () => {
        const p = s.products[parseInt(inp.dataset.idx, 10)];
        if (p) { p.reward.skillId = inp.value.trim(); if (!p.id) { p.id = inp.value.trim(); this._refreshProducts(s); } }
      };
    });
    host.querySelectorAll('.pd-price').forEach(inp => {
      inp.onchange = () => {
        const p = s.products[parseInt(inp.dataset.idx, 10)];
        if (!p) return;
        const v = parseInt(inp.value, 10);
        if (v > 0) p.price = v; else delete p.price;
      };
    });
    host.querySelectorAll('.pd-premium').forEach(inp => {
      inp.onchange = () => {
        const p = s.products[parseInt(inp.dataset.idx, 10)];
        if (!p) return;
        const v = parseInt(inp.value, 10);
        if (v > 0) p.premiumPrice = v; else delete p.premiumPrice;
      };
    });
    host.querySelectorAll('.pd-maxclaims').forEach(inp => {
      inp.onchange = () => {
        const p = s.products[parseInt(inp.dataset.idx, 10)];
        if (!p) return;
        const v = parseInt(inp.value, 10);
        if (v > 0) p.maxClaims = v; else delete p.maxClaims;
      };
    });
  }

  _refreshProducts(s) {
    const hostEl = this.container.querySelector('#shopProductHost');
    if (hostEl) {
      hostEl.innerHTML = this._productsHtml(s.products);
      this._bindProductEvents(s);
    }
  }

  _bindEvents() {
    const searchInput = this.container.querySelector('#shopSearch');
    if (searchInput) {
      searchInput.oninput = (e) => {
        this.searchKeyword = e.target.value.trim();
        this.container.querySelector('#shopList').innerHTML = this._renderListHtml();
        this._bindListClickEvents();
      };
    }

    const addBtn = this.container.querySelector('#addShopBtn');
    if (addBtn) {
      addBtn.onclick = () => {
        const ns = { id: 'new_shop_' + Date.now().toString().slice(-4), name: '新商店', music: null, background: null, products: [] };
        this.shops.unshift(ns);
        this.selectedShop = ns;
        this._renderLayout();
        this.notify('已新建商店，请上架商品后保存！');
      };
    }

    this._bindListClickEvents();
    if (!this.selectedShop) return;
    const s = this.selectedShop;

    this._bindProductEvents(s);

    const dupBtn = this.container.querySelector('#dupShopBtn');
    if (dupBtn) {
      dupBtn.onclick = () => {
        const cloned = JSON.parse(JSON.stringify(s));
        cloned.id = s.id + '_copy';
        cloned.name = (s.name || s.id) + ' (副本)';
        this.shops.unshift(cloned);
        this.selectedShop = cloned;
        this._renderLayout();
        this.notify('商店克隆成功！');
      };
    }

    const delBtn = this.container.querySelector('#delShopBtn');
    if (delBtn) {
      delBtn.onclick = () => {
        if (!confirm(`确定删除商店《${s.name || s.id}》吗？`)) return;
        const idx = this.shops.findIndex(x => x.id === s.id);
        if (idx !== -1) this.shops.splice(idx, 1);
        this.selectedShop = this.shops[0] || null;
        this._renderLayout();
        this.notify('商店已删除');
      };
    }

    const saveBtn = this.container.querySelector('#saveShopsBtn');
    if (saveBtn) {
      saveBtn.onclick = async () => {
        saveBtn.innerText = '⏳ 保存中...';
        s.name = this.container.querySelector('#sh_name').value.trim();
        s.id = this.container.querySelector('#sh_id').value.trim() || s.id;
        s.music = this.container.querySelector('#sh_music').value.trim() || null;
        s.background = this.container.querySelector('#sh_background').value.trim() || null;

        const res = await this.adapter.saveShops(this.shops);
        saveBtn.innerText = '💾 保存更改';
        if (res.success) {
          this.notify(`成功保存 ${this.shops.length} 家商店${describeSaveState(res)}`, saveToastType(res));
          this._renderLayout();
        } else {
          this.notify('保存失败: ' + (res.error || '未知错误'), 'error');
        }
      };
    }
  }

  _bindListClickEvents() {
    this.container.querySelectorAll('.list-item-card').forEach(card => {
      card.onclick = () => {
        const id = card.dataset.id;
        this.selectedShop = this.shops.find(s => s.id === id);
        this.container.querySelectorAll('.list-item-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        this.container.querySelector('#shopDetail').innerHTML = this.selectedShop ? this._renderDetailHtml(this.selectedShop) : '';
        this._bindEvents();
      };
    });
  }
}

/**
 * CharacterView: 侠客与宗师工坊
 */
class CharacterView {
  constructor(adapter, refIndex, onSaveNotification) {
    this.adapter = adapter;
    this.refIndex = refIndex;
    this.resolver = new ResourceResolver(refIndex);
    this.notify = onSaveNotification;
    this.characters = [];
    this.selectedChar = null;
    this.searchKeyword = '';
    this.container = null;
  }

  render(parentEl) {
    this.container = parentEl;
    this.characters = this.adapter.loadCharacters();
    if (this.characters.length > 0 && !this.selectedChar) {
      this.selectedChar = this.characters[0];
    }
    this._renderLayout();
  }

  _getFilteredChars() {
    return this.characters.filter(c => {
      return !this.searchKeyword || 
        (c.name && c.name.includes(this.searchKeyword)) ||
        (c.id && c.id.includes(this.searchKeyword));
    });
  }

  _renderLayout() {
    this.container.innerHTML = `
      <div class="view-split-layout">
        <!-- 左侧人物列表 -->
        <div class="sidebar-panel">
          <div class="sidebar-header">
            <input type="text" id="charSearch" class="search-input" placeholder="🔍 搜索少侠/宗师名或ID..." value="${this.searchKeyword}">

          </div>
          <div class="item-list-scroll" id="charList">
            ${this._renderCharListHtml()}
          </div>
        </div>

        <!-- 右侧人物表单 -->
        <div class="detail-panel" id="charDetail">
          ${this.selectedChar ? this._renderDetailHtml(this.selectedChar) : '<div class="empty-hint" style="padding:40px; text-align:center; color:var(--text-muted);">请选择一位侠客进行调校</div>'}

    `;

    this._bindEvents();

  _renderCharListHtml() {

    if (list.length === 0) return '<div class="empty-list" style="padding:40px; text-align:center; color:var(--text-muted);">未找到匹配的侠客</div>';
    return list.map(c => {
      const isSelected = this.selectedChar && this.selectedChar.id === c.id;
      return `
        <div class="list-item-card ${isSelected ? 'active' : ''}" data-id="${c.id}">
          ${this.resolver.renderImg(c.portrait, c.name, 'char-list-avatar')}
          <div class="item-card-content">
            <div class="item-title-row">
              <span class="item-name text-green">${c.name || c.id}</span>

              <span class="meta-id">ID: ${c.id}</span>
              <span class="meta-grow">${c.growTemplate || '无模板'}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  }

  _bindEvents() {
    const searchInput = this.container.querySelector('#charSearch');

      searchInput.oninput = (e) => {
        this.searchKeyword = e.target.value.trim();

        this._bindListClickEvents();
      };
    }

    const addBtn = this.container.querySelector('#addCharBtn');
    if (addBtn) {
      addBtn.onclick = () => {
        const newChar = CharacterSchema.defaultCharacter();
        newChar.id = 'hero_' + Date.now().toString().slice(-4);
        newChar.name = '自创新少侠';
        this.characters.unshift(newChar);
        this.selectedChar = newChar;
        this._renderLayout();
        this.notify('已新建侠客模版，请调校参数！');
      };
    }

    this._bindListClickEvents();
    this._bindFormEvents();
  }

  _bindListClickEvents() {
    this.container.querySelectorAll('.list-item-card').forEach(card => {
      card.onclick = () => {
        const id = card.dataset.id;
        this.selectedChar = this.characters.find(c => c.id === id);
        this.container.querySelectorAll('.list-item-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        this.container.querySelector('#charDetail').innerHTML = this._renderDetailHtml(this.selectedChar);
        this._bindFormEvents();
      };
    });
  }

  _bindFormEvents() {
    if (!this.selectedChar) return;
    const c = this.selectedChar;

    const pickPortraitBtn = this.container.querySelector('#pickCharPortraitBtn');
    if (pickPortraitBtn) {
      pickPortraitBtn.onclick = () => {
        MediaPickerModal.open({
          type: 'portrait',
          title: '挑选侠客高清立绘头像',
          current: c.portrait,
          refIndex: this.refIndex,
          resourceResolver: this.resolver,
          onSelect: (ref) => {
            c.portrait = ref;
            this._renderLayout();
          }
        });
      };
    }

    // 内功事件
    const addInBtn = this.container.querySelector('#addInternalBtn');
    if (addInBtn) {
      addInBtn.onclick = () => {
        const sel = this.container.querySelector('#newInternalSelect');
        if (sel && sel.value) {
          if (!Array.isArray(c.internalSkills)) c.internalSkills = [];
          c.internalSkills.push({ id: sel.value, level: 1, maxLevel: 10, equipped: c.internalSkills.length === 0 });
          this._renderLayout();
        }
      };
    }

    this.container.querySelectorAll('.remove-in-btn').forEach(btn => {
      btn.onclick = () => {
        const idx = parseInt(btn.dataset.idx, 10);
        c.internalSkills.splice(idx, 1);
        this._renderLayout();
      };
    });

    this.container.querySelectorAll('.in-lvl-input').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        if (c.internalSkills[idx]) c.internalSkills[idx].level = parseInt(inp.value, 10) || 1;
      };
    });

    this.container.querySelectorAll('.in-max-input').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        if (c.internalSkills[idx]) c.internalSkills[idx].maxLevel = parseInt(inp.value, 10) || 10;
      };
    });

    this.container.querySelectorAll('.in-eq-checkbox').forEach(chk => {
      chk.onchange = () => {
        const idx = parseInt(chk.dataset.idx, 10);
        if (chk.checked) {
          // 单一装备内功
          c.internalSkills.forEach((is, i) => is.equipped = (i === idx));
        } else {
          if (c.internalSkills[idx]) c.internalSkills[idx].equipped = false;
        }
        this._renderLayout();
      };
    });

    // 外功事件
    const addExBtn = this.container.querySelector('#addExternalBtn');
    if (addExBtn) {
      addExBtn.onclick = () => {
        const sel = this.container.querySelector('#newExternalSelect');
        if (sel && sel.value) {
          if (!Array.isArray(c.externalSkills)) c.externalSkills = [];
          c.externalSkills.push({ id: sel.value, level: 1, maxLevel: 10 });
          this._renderLayout();
        }
      };
    }

    this.container.querySelectorAll('.remove-ex-btn').forEach(btn => {
      btn.onclick = () => {
        const idx = parseInt(btn.dataset.idx, 10);
        c.externalSkills.splice(idx, 1);
        this._renderLayout();
      };
    });

    this.container.querySelectorAll('.ex-lvl-input').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        if (c.externalSkills[idx]) c.externalSkills[idx].level = parseInt(inp.value, 10) || 1;
      };
    });

    this.container.querySelectorAll('.ex-max-input').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        if (c.externalSkills[idx]) c.externalSkills[idx].maxLevel = parseInt(inp.value, 10) || 10;
      };
    });

    // 绝技事件
    const addSpBtn = this.container.querySelector('#addSpBtn');
    if (addSpBtn) {
      addSpBtn.onclick = () => {
        const sel = this.container.querySelector('#newSpSelect');
        if (sel && sel.value) {
          if (!Array.isArray(c.specialSkillIds)) c.specialSkillIds = [];
          if (!c.specialSkillIds.includes(sel.value)) {
            c.specialSkillIds.push(sel.value);
            this._renderLayout();
          }
        }
      };
    }

    this.container.querySelectorAll('.remove-sp-chip').forEach(btn => {
      btn.onclick = () => {
        const idx = parseInt(btn.dataset.idx, 10);
        c.specialSkillIds.splice(idx, 1);
        this._renderLayout();
      };
    });

    // 天赋事件
    const addTalentBtn = this.container.querySelector('#addTalentBtn');
    if (addTalentBtn) {
      addTalentBtn.onclick = () => {
        const sel = this.container.querySelector('#newTalentSelect');
        if (sel && sel.value) {
          if (!Array.isArray(c.talentIds)) c.talentIds = [];
          if (!c.talentIds.includes(sel.value)) {
            c.talentIds.push(sel.value);
            this._renderLayout();
          }
        }
      };
    }

    this.container.querySelectorAll('.remove-talent-chip').forEach(btn => {
      btn.onclick = () => {
        const idx = parseInt(btn.dataset.idx, 10);
        c.talentIds.splice(idx, 1);
        this._renderLayout();
      };
    });

    // 装备事件
    const addEqBtn = this.container.querySelector('#addEquipmentBtn');
    if (addEqBtn) {
      addEqBtn.onclick = () => {
        const sel = this.container.querySelector('#newEquipmentSelect');
        if (sel && sel.value) {
          if (!Array.isArray(c.equipmentIds)) c.equipmentIds = [];
          if (!c.equipmentIds.includes(sel.value)) {
            c.equipmentIds.push(sel.value);
            this._renderLayout();
          }
        }
      };
    }

    this.container.querySelectorAll('.remove-eq-chip').forEach(btn => {
      btn.onclick = () => {
        const idx = parseInt(btn.dataset.idx, 10);
        c.equipmentIds.splice(idx, 1);
        this._renderLayout();
      };
    });

    // 克隆/删除/保存
    const dupBtn = this.container.querySelector('#duplicateCharBtn');
    if (dupBtn) {
      dupBtn.onclick = () => {
        const cloned = JSON.parse(JSON.stringify(c));
        cloned.id = c.id + '_copy';
        cloned.name = (c.name || c.id) + ' (分身)';
        this.characters.unshift(cloned);
        this.selectedChar = cloned;
        this._renderLayout();
        this.notify('侠客克隆成功！');
      };
    }

    const delBtn = this.container.querySelector('#deleteCharBtn');
    if (delBtn) {
      delBtn.onclick = () => {
        if (confirm(`确定要删除侠客《${c.name || c.id}》吗？`)) {
          const idx = this.characters.findIndex(i => i.id === c.id);
          if (idx !== -1) {
            this.characters.splice(idx, 1);
            this.selectedChar = this.characters[0] || null;
            this._renderLayout();
            this.notify('侠客已成功删除');
          }
        }
      };
    }

    const saveBtn = this.container.querySelector('#saveCharsBtn');
    if (saveBtn) {
      saveBtn.onclick = async () => {
        saveBtn.innerText = '⏳ 保存中...';
        c.name = this.container.querySelector('#ch_name').value.trim();
        c.id = this.container.querySelector('#ch_id').value.trim();
        c.level = parseInt(this.container.querySelector('#ch_level').value, 10) || 1;
        c.gender = this.container.querySelector('#ch_gender').value;
        c.growTemplate = this.container.querySelector('#ch_growTemplate').value.trim() || null;
        c.model = this.container.querySelector('#ch_model').value.trim() || 'xiake';

        if (!c.stats) c.stats = {};
        this.container.querySelectorAll('.stat-input').forEach(inp => {
          const statKey = inp.dataset.stat;
          c.stats[statKey] = parseInt(inp.value, 10) || 0;
        });

        const res = await this.adapter.saveCharacters(this.characters);
        saveBtn.innerText = '💾 保存更改';
        if (res.success) {
          this.notify(`成功保存 ${this.characters.length} 位侠客至 characters.json！${describeSaveState(res)}`, saveToastType(res));
          this._renderLayout();
        } else {
          this.notify('保存失败: ' + (res.error || '未知错误'), 'error');
        }
      };
    }
  }
}

/**
 * BattleView: 11×4 战棋交互布阵与战场工坊
 */
class BattleView {
  constructor(adapter, refIndex, onSaveNotification) {
    this.adapter = adapter;
    this.refIndex = refIndex;
    this.resolver = new ResourceResolver(refIndex);
    this.notify = onSaveNotification;
    this.battles = [];
    this.selectedBattle = null;
    this.searchKeyword = '';
    this.selectedCell = null; // { x, y }
    this.previewImpactType = 'single';
    this.previewImpactSize = 2;
    this.enableHoverRange = true;
    this.container = null;
  }

  render(parentEl) {
    this.container = parentEl;
    this.battles = this.adapter.loadBattles();
    if (this.battles.length === 0) {
      const defaultB = BattleSchema.defaultBattle();
      this.battles.push(defaultB);
    }
    if (!this.selectedBattle) {
      this.selectedBattle = this.battles[0];
    }
    if (!this.selectedCell) {
      this.selectedCell = { x: 2, y: 2 };
    }
    this._renderLayout();
  }

  _getFilteredBattles() {
    return this.battles.filter(b => {
      return !this.searchKeyword ||
        (b.name && b.name.includes(this.searchKeyword)) ||
        (b.id && b.id.includes(this.searchKeyword));
    });
  }

  _renderLayout() {
    this.container.innerHTML = `
      <div class="view-split-layout">
        <!-- 左侧战场列表 -->
        <div class="sidebar-panel">
          <div class="sidebar-header">
            <input type="text" id="battleSearch" class="search-input" placeholder="🔍 搜索战役名称或ID..." value="${this.searchKeyword}">
            <button id="addBattleBtn" class="btn btn-primary" style="width: 100%; margin-top: 8px;">+ 新建战役场景</button>
          </div>
          <div class="item-list-scroll" id="battleList">
            ${this._renderBattleListHtml()}
          </div>
        </div>

        <!-- 右侧战棋棋盘与参数面板 -->
        <div class="detail-panel" id="battleDetail">
          ${this.selectedBattle ? this._renderDetailHtml(this.selectedBattle) : '<div class="empty-hint" style="padding:40px; text-align:center; color:var(--text-muted);">请选择一场战役进行战棋布阵</div>'}
        </div>
      </div>
    `;

    this._bindEvents();
  }

  _renderBattleListHtml() {
    const list = this._getFilteredBattles();
    if (list.length === 0) return '<div class="empty-list" style="padding:40px; text-align:center; color:var(--text-muted);">未找到匹配的战役</div>';
    return list.map(b => {
      const isSelected = this.selectedBattle && this.selectedBattle.id === b.id;
      const count = (b.participants || []).length;
      return `
        <div class="list-item-card ${isSelected ? 'active' : ''}" data-id="${b.id}">
          <div class="item-card-content">
            <div class="item-title-row">
              <span class="item-name text-gold">${b.name || b.id}</span>
              <span class="item-badge badge-gold">${count}人参战${(b.randomParticipants || []).length ? ` · 🎲${(b.randomParticipants || []).length}随机` : ''}</span>
            </div>
            <div class="item-meta-row">
              <span class="meta-id">ID: ${b.id}</span>
              <span class="meta-bg">${(b.background || '').replace('battle_bg/', '')}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  _renderDetailHtml(b) {
    const participants = b.participants || [];
    const reqChars = b.requiredCharacterIds || [];

    return `
      <div class="form-scroll-wrapper">
        <div class="detail-header-bar">
          <div>
            <h2 class="detail-title text-gold">${b.name || b.id}</h2>
            <div class="detail-subtitle">ID: <code>${b.id}</code> · 经验倍率: ${b.experienceMultiplier || 1.0}x · 参战单位: ${participants.length} 人 · 🎲 随机怪组: ${(b.randomParticipants || []).length} 组</div>
          </div>
          <div class="btn-group">
            <button id="duplicateBattleBtn" class="btn btn-secondary">克隆战役</button>
            <button id="deleteBattleBtn" class="btn btn-danger">删除</button>
            <button id="saveBattlesBtn" class="btn btn-primary">💾 保存战场配置</button>
          </div>
        </div>

        <!-- 战场全局设置 -->
        <div class="form-card">
          <h3>战役环境与出战限制</h3>
          <div class="media-preview-header">
            ${this.resolver.renderImg(b.background, '战场背景', 'bg-large-preview')}
            <div>
              <div style="font-weight:bold; font-size:15px; margin-bottom:4px;">当前战斗背景: <code>${b.background || '无'}</code></div>
              <button id="pickBattleBgBtn" class="btn btn-secondary btn-sm">🖼️ 挑选战场背景图鉴</button>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>战役名称 (name)</label>
              <input type="text" class="input-field" id="bt_name" value="${b.name || ''}">
            </div>
            <div class="form-group">
              <label>战役唯一ID (id)</label>
              <input type="text" class="input-field" id="bt_id" value="${b.id || ''}">
            </div>
            <div class="form-group">
              <label>经验结算倍率 (experienceMultiplier)</label>
              <input type="number" step="0.1" class="input-field" id="bt_exp" value="${b.experienceMultiplier || 1.0}" min="0.1">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>背景音乐 (music)</label>
              <select class="input-field" id="bt_music">
                <option value="">-- 使用默认战场音乐 --</option>
                ${this.refIndex.battleMusic.map(m => `<option value="${m.id}" ${b.music === m.id ? 'selected' : ''}>${m.name || m.id} (${m.path})</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>必出战主角/侠客 (requiredCharacterIds)</label>
              <div class="tag-picker-wrap" id="reqCharsWrap" style="min-height:36px; max-height:80px;">
                ${reqChars.map((rc, idx) => `
                  <span class="tag-chip">${rc} <span class="tag-chip-remove remove-req-chip" data-idx="${idx}">✕</span></span>
                `).join('')}
              </div>
              <div style="display:flex; gap:6px; margin-top:4px;">
                <select class="input-field" id="newReqSelect" style="flex:1;">
                  <option value="主角">主角</option>
                  ${this.refIndex.characters.filter(c => c.id !== '主角').map(c => `<option value="${c.id}">${c.name || c.id}</option>`).join('')}
                </select>
                <button class="btn btn-secondary btn-sm" id="addReqBtn">+ 添加必出战</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 11×4 战棋布阵棋盘 -->
        <div class="form-card">
          <div class="battle-board-header">
            <div>
              <strong style="color:var(--accent-gold); font-size:15px;">⚔️ 11×4 半即时战棋布阵交互棋盘</strong>
              <div style="font-size:12px; color:var(--text-dim); margin-top:2px;">点击棋盘格子放置或调校单位；悬停可模拟测试招式杀伤范围</div>
            </div>
            <div class="battle-legend">
              <div class="legend-item"><span class="legend-dot dot-ally"></span> 我方阵营 (Team 1, 靠左 0~4列)</div>
              <div class="legend-item"><span class="legend-dot dot-enemy"></span> 敌方阵营 (Team 2, 靠右 6~10列)</div>
              <div class="legend-item"><span style="color:var(--accent-gold); font-weight:bold;">▶</span> 朝右 / <span style="color:var(--accent-blue); font-weight:bold;">◀</span> 朝左</div>
              <button class="btn btn-secondary btn-sm" id="resetBasicBattleBtn">↺ 重置为基础单挑</button>
              <button class="btn btn-danger btn-sm" id="clearAllUnitsBtn">清空棋盘</button>
            </div>
          </div>

          <!-- 招式范围模拟栏 -->
          <div style="display:flex; align-items:center; gap:12px; background:var(--bg-dark); padding:8px 12px; border-radius:6px; margin-bottom:12px; font-size:12px;">
            <span style="color:var(--accent-purple); font-weight:bold;">🎯 招式范围演练：</span>
            <span>范围模式:</span>
            <select class="input-field" id="rangeModeSelect" style="padding:2px 8px; font-size:12px; width:130px;">
              <option value="single" ${this.previewImpactType === 'single' ? 'selected' : ''}>单体打击 (single)</option>
              <option value="line" ${this.previewImpactType === 'line' ? 'selected' : ''}>直线贯穿 (line)</option>
              <option value="plus" ${this.previewImpactType === 'plus' ? 'selected' : ''}>十字波及 (plus)</option>
              <option value="star" ${this.previewImpactType === 'star' ? 'selected' : ''}>周身星芒 (star)</option>
              <option value="all" ${this.previewImpactType === 'all' ? 'selected' : ''}>全战场覆盖 (all)</option>
            </select>
            <span>覆盖半径:</span>
            <input type="number" id="rangeSizeInput" class="input-field" value="${this.previewImpactSize}" min="1" max="5" style="padding:2px 8px; width:60px; font-size:12px;">
            <label style="display:flex; align-items:center; gap:4px; margin-left:auto; cursor:pointer;">
              <input type="checkbox" id="toggleHoverRange" ${this.enableHoverRange ? 'checked' : ''}>
              <span>开启鼠标悬停高亮演示</span>
            </label>
          </div>

          <!-- 11×4 网格棋盘 -->
          <div class="battle-grid-container">
            <div class="battle-grid-board" id="battleGridBoard">
              ${this._renderBoardHtml(b)}
            </div>
          </div>

          <!-- 选中格子单位调校台 -->
          <div id="unitInspectorContainer">
            ${this._renderInspectorHtml(b)}
          </div>
        </div>
      </div>
    `;
  }

  _renderBoardHtml(b) {
    const participants = b.participants || [];
    const randoms = b.randomParticipants || [];
    let html = '';

    // 第一行：列坐标 (X = 0..10)
    html += '<div class="grid-axis-label">Y \\ X</div>';
    for (let x = 0; x < 11; x++) {
      let zoneCls = '';
      if (x <= 4) zoneCls = 'zone-ally';
      else if (x >= 6) zoneCls = 'zone-enemy';
      html += `<div class="grid-axis-label axis-col-label ${zoneCls}">${x}</div>`;
    }

    // 4 行格子 (Y = 0..3)
    for (let y = 0; y < 4; y++) {
      html += `<div class="grid-axis-label axis-row-label">${y}</div>`;

      for (let x = 0; x < 11; x++) {
        const isSelected = this.selectedCell && this.selectedCell.x === x && this.selectedCell.y === y;
        let zoneCls = '';
        if (x <= 4) zoneCls = 'zone-ally';
        else if (x >= 6) zoneCls = 'zone-enemy';

        const unit = participants.find(p => p.position && p.position.x === x && p.position.y === y);
        const rnd = randoms.find(r => r.position && r.position.x === x && r.position.y === y);

        html += `
          <div class="battle-cell ${zoneCls} ${isSelected ? 'selected-cell' : ''}" data-x="${x}" data-y="${y}">
            <span class="cell-coord-tag">${x},${y}</span>
            ${unit ? this._renderUnitTokenHtml(unit) : (rnd ? this._renderRandomTokenHtml(rnd) : '<span class="empty-cell-add">+</span>')}
          </div>
        `;
      }
    }

    return html;
  }

  _renderUnitTokenHtml(u) {
    let portrait = 'head/zhujue2';
    let name = '未知单位';

    if (u.partyIndex === 0) {
      name = '⭐ 主角';
      portrait = '头像.主角';
    } else if (u.partyIndex !== null && u.partyIndex !== undefined) {
      name = `👥 队友 [P${u.partyIndex}]`;
      portrait = '头像.主角';
    } else if (u.characterId) {
      name = u.characterId;
      const charObj = this.refIndex.characters.find(c => c.id === u.characterId);
      if (charObj && charObj.portrait) {
        portrait = charObj.portrait;
      } else {
        portrait = `头像.${u.characterId}`;
      }
    }

    const teamCls = u.team === 1 ? 'team-1' : 'team-2';
    const facingArrow = u.facing === 1 ? '▶' : '◀';
    const facingCls = u.facing === 1 ? 'facing-right' : 'facing-left';

    return `
      <div class="unit-token ${teamCls}">
        <div class="unit-avatar-wrap">
          <img src="${this.resolver.resolveArtUrl(portrait)}" alt="${name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" loading="lazy">
          <div class="img-placeholder" style="display:none; width:100%; height:100%;"><span>${name.charAt(0)}</span></div>
          <span class="facing-badge ${facingCls}">${facingArrow}</span>
        </div>
        <div class="unit-name-label" title="${name}">${name}</div>
      </div>
    `;
  }

  // 随机怪组棋子：程序化生成的杂兵/头目，用 🎲 徽标与固定角色区分
  _renderRandomTokenHtml(rp) {
    const teamCls = rp.team === 1 ? 'team-1' : 'team-2';
    const facingArrow = rp.facing === 1 ? '▶' : '◀';
    const facingCls = rp.facing === 1 ? 'facing-right' : 'facing-left';
    const name = (rp.name || '随机怪');
    const title = `${name} · 强度T${rp.tier || 0}${rp.boss ? ' · 👑Boss' : ''}${rp.model ? ` · 模型:${rp.model}` : ''}`;

    return `
      <div class="unit-token ${teamCls}" style="outline: 2px dashed ${rp.team === 1 ? 'var(--accent-blue)' : 'var(--accent-red)'}; outline-offset: -3px;">
        <div class="unit-avatar-wrap">
          <div class="img-placeholder" style="width:100%; height:100%;"><span>🎲</span></div>
          <span class="facing-badge ${facingCls}">${facingArrow}</span>
        </div>
        <div class="unit-name-label" title="${title}">${rp.boss ? '👑' : ''}${name} T${rp.tier || 0}</div>
      </div>
    `;
  }

  _renderInspectorHtml(b) {
    if (!this.selectedCell) return '<div class="empty-hint" style="text-align:center; padding:12px; color:var(--text-dim);">点击上方棋盘任意格子以放置或调校单位</div>';
    const { x, y } = this.selectedCell;
    const participants = b.participants || [];
    const unitIndex = participants.findIndex(p => p.position && p.position.x === x && p.position.y === y);
    const u = unitIndex !== -1 ? participants[unitIndex] : null;

    if (u) {
      let identityType = 'character';
      if (u.partyIndex === 0) identityType = 'protagonist';
      else if (u.partyIndex !== null && u.partyIndex !== undefined) identityType = 'follower';

      return `
        <div class="form-card" style="background:var(--bg-dark); border-color:var(--accent-gold); margin-top:12px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h4 style="color:var(--accent-gold); font-size:15px;">
              <span>参战单位调校 · 坐标 <code>(${x}, ${y})</code></span>
            </h4>
            <button class="btn btn-danger btn-sm" id="removeUnitFromBoardBtn">🗑️ 从棋盘撤下</button>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>所属阵营 (team)</label>
              <select class="input-field" id="ins_team">
                <option value="1" ${u.team === 1 ? 'selected' : ''}>🔵 我方编队 (Team 1)</option>

            <div class="form-group">
              <label>布阵朝向 (facing)</label>

                <option value="1" ${u.facing === 1 ? 'selected' : ''}>▶ 朝右 (Facing: 1)</option>

            </div>
            <div class="form-group">
              <label>参战身份定位</label>
              <select class="input-field" id="ins_identity">
                <option value="protagonist" ${identityType === 'protagonist' ? 'selected' : ''}>⭐ 玩家主角 (PartyIndex: 0)</option>
                <option value="follower" ${identityType === 'follower' ? 'selected' : ''}>👥 随行队友 (PartyIndex: 1~5)</option>

              </select>

            <div class="form-group" id="insPartyIndexGroup" style="${identityType === 'follower' ? '' : 'display:none;'}">
              <label>队友出战槽位索引 (partyIndex)</label>
              <input type="number" class="input-field" id="ins_partyIndex" value="${u.partyIndex !== null && u.partyIndex !== undefined ? u.partyIndex : 1}" min="1" max="5">
            </div>
            <div class="form-group">
              <label>快速移动坐标</label>
              <div style="display:flex; gap:6px;">
                <input type="number" class="input-field" id="ins_x" value="${x}" min="0" max="10" style="width:70px;">

                <button class="btn btn-secondary btn-sm" id="insMoveBtn">移动至此坐标</button>
              </div>
            </div>
          </div>
        </div>
      `;
    } else {
      const randoms = b.randomParticipants || [];
      const rndIndex = randoms.findIndex(r => r.position && r.position.x === x && r.position.y === y);
      const rp = rndIndex !== -1 ? randoms[rndIndex] : null;
      if (rp) {
        // 随机怪组：程序化杂兵/头目调校面板
        return `
          <div class="form-card" style="background:var(--bg-dark); border-color:var(--accent-red); margin-top:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <h4 style="color:var(--accent-red); font-size:15px;">
                <span>🎲 随机怪组调校 · 坐标 <code>(${x}, ${y})</code></span>

              <div class="form-group">
                <label>头目标记 (boss)</label>
                <select class="input-field" id="rp_boss">

                <label>所属阵营 (team)</label>

                  <option value="1" ${rp.team === 1 ? 'selected' : ''}>🔵 我方编队 (Team 1)</option>

                <select class="input-field" id="rp_facing">

                  <option value="0" ${rp.facing === 0 ? 'selected' : ''}>◀ 朝左 (Facing: 0)</option>

              <div class="form-group">
                <label>战斗动画模型 (model，可空)</label>

            </div>
          </div>
        `;
      }
      // 空白格子：放置菜单
      const defaultTeam = x <= 4 ? 1 : 2;
      const defaultFacing = x <= 4 ? 1 : 0;
      return `
        <div class="form-card" style="background:var(--bg-dark); border-color:var(--border-color); margin-top:12px;">
          <h4 style="color:var(--text-main); font-size:14px; margin-bottom:10px;">
            <span>在坐标 <code>(${x}, ${y})</code> 放置新参战单位</span>
          </h4>
          <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
            <button class="btn btn-primary btn-sm" id="placeProtagonistBtn">⭐ 放置主角 (P0, 朝右, 我方)</button>
            <button class="btn btn-secondary btn-sm" id="placeFollowerBtn">👥 放置队友 (P1, 朝右, 我方)</button>
            <div style="display:flex; gap:6px; align-items:center;">
              <select class="input-field" id="quickEnemySelect" style="width:180px; font-size:12px;">
                ${this.refIndex.characters.map(c => `<option value="${c.id}" ${c.id === '木头人' ? 'selected' : ''}>${c.name || c.id}</option>`).join('')}
              </select>
              <button class="btn btn-secondary btn-sm" id="placeEnemyBtn">🔴 放置为敌方 (朝左)</button>

          </div>
