    const dupBtn = this.container.querySelector('#duplicateBattleBtn');
    if (dupBtn) {
      dupBtn.onclick = () => {
        const cloned = JSON.parse(JSON.stringify(b));
        cloned.id = b.id + '_copy';
        cloned.name = (b.name || b.id) + ' (副本)';
        this.battles.unshift(cloned);
        this.selectedBattle = cloned;
        this._renderLayout();
        this.notify('战役场景克隆成功！');
      };
    }

    const delBtn = this.container.querySelector('#deleteBattleBtn');
    if (delBtn) {
      delBtn.onclick = () => {
        if (confirm(`确定要删除战役《${b.name || b.id}》吗？`)) {
          const idx = this.battles.findIndex(i => i.id === b.id);
          if (idx !== -1) {
            this.battles.splice(idx, 1);
            this.selectedBattle = this.battles[0] || null;
            this._renderLayout();
            this.notify('战役场景已删除');
          }
        }
      };
    }

    const saveBtn = this.container.querySelector('#saveBattlesBtn');
    if (saveBtn) {
      saveBtn.onclick = async () => {
        saveBtn.innerText = '⏳ 保存中...';
        b.name = this.container.querySelector('#bt_name').value.trim();
        b.id = this.container.querySelector('#bt_id').value.trim();
        b.experienceMultiplier = parseFloat(this.container.querySelector('#bt_exp').value) || 1.0;
        b.music = this.container.querySelector('#bt_music').value || null;

        const res = await this.adapter.saveBattles(this.battles);
        saveBtn.innerText = '💾 保存战场配置';
        if (res.success) {
          this.notify(`成功保存 ${this.battles.length} 场战役至 battles.json！${describeSaveState(res)}`, saveToastType(res));
          this._renderLayout();
        } else {
          this.notify('保存失败: ' + (res.error || '未知错误'), 'error');
        }
      };
    }
  }

  _bindBoardEvents() {
    if (!this.selectedBattle) return;
    const b = this.selectedBattle;

    // 点击棋盘格子
    this.container.querySelectorAll('.battle-cell').forEach(cell => {
      const x = parseInt(cell.dataset.x, 10);
      const y = parseInt(cell.dataset.y, 10);

      cell.onclick = () => {
        this.selectedCell = { x, y };
        this.container.querySelectorAll('.battle-cell').forEach(c => c.classList.remove('selected-cell'));
        cell.classList.add('selected-cell');
        this.container.querySelector('#unitInspectorContainer').innerHTML = this._renderInspectorHtml(b);
        this._bindInspectorEvents();
      };

      // 悬停招式范围演练
      cell.onmouseenter = () => {
        if (!this.enableHoverRange) return;
        this._highlightSkillRange(x, y);
      };

      cell.onmouseleave = () => {
        this._clearRangeHighlight();
      };
    });

    this._bindInspectorEvents();
  }

  _highlightSkillRange(cx, cy) {
    this._clearRangeHighlight();
    const type = this.previewImpactType;
    const size = this.previewImpactSize;

    const hitCells = [];

    if (type === 'single') {
      hitCells.push({ x: cx, y: cy });
    } else if (type === 'line') {
      const dir = cx <= 5 ? 1 : -1;
      for (let s = 0; s <= size; s++) {
        const nx = cx + s * dir;
        if (nx >= 0 && nx < 11) hitCells.push({ x: nx, y: cy });
      }
    } else if (type === 'plus') {
      hitCells.push({ x: cx, y: cy });
      for (let s = 1; s <= size; s++) {
        if (cx + s < 11) hitCells.push({ x: cx + s, y: cy });
        if (cx - s >= 0) hitCells.push({ x: cx - s, y: cy });
        if (cy + s < 4) hitCells.push({ x: cx, y: cy + s });
        if (cy - s >= 0) hitCells.push({ x: cx, y: cy - s });
      }
    } else if (type === 'star') {
      for (let x = 0; x < 11; x++) {
        for (let y = 0; y < 4; y++) {
          if (Math.abs(x - cx) + Math.abs(y - cy) <= size) {
            hitCells.push({ x, y });
          }
        }
      }
    } else if (type === 'all') {
      for (let x = 0; x < 11; x++) {
        for (let y = 0; y < 4; y++) {
          hitCells.push({ x, y });
        }
      }
    }

    hitCells.forEach(p => {
      const el = this.container.querySelector(`.battle-cell[data-x="${p.x}"][data-y="${p.y}"]`);
      if (el) {
        if (p.x === cx && p.y === cy) el.classList.add('cell-range-origin');
        else el.classList.add('cell-range-hit');
      }
    });
  }

  _clearRangeHighlight() {
    this.container.querySelectorAll('.battle-cell').forEach(c => {
      c.classList.remove('cell-range-hit', 'cell-range-origin');
    });
  }

  _bindInspectorEvents() {
    if (!this.selectedBattle || !this.selectedCell) return;
    const b = this.selectedBattle;
    const { x, y } = this.selectedCell;
    const participants = b.participants || [];
    const unitIndex = participants.findIndex(p => p.position && p.position.x === x && p.position.y === y);
    const u = unitIndex !== -1 ? participants[unitIndex] : null;

    if (u) {
      const insTeam = this.container.querySelector('#ins_team');
      if (insTeam) insTeam.onchange = (e) => { u.team = parseInt(e.target.value, 10); this._updateBoardAndInspector(b); };

      const insFacing = this.container.querySelector('#ins_facing');
      if (insFacing) insFacing.onchange = (e) => { u.facing = parseInt(e.target.value, 10); this._updateBoardAndInspector(b); };

      const insIdentity = this.container.querySelector('#ins_identity');
      if (insIdentity) {
        insIdentity.onchange = (e) => {
          const val = e.target.value;
          if (val === 'protagonist') {
            u.partyIndex = 0;
            u.characterId = null;
            u.team = 1;
            u.facing = 1;
          } else if (val === 'follower') {
            u.partyIndex = 1;
            u.characterId = null;
            u.team = 1;
            u.facing = 1;
          } else {
            u.partyIndex = null;
            u.characterId = this.refIndex.characters.length > 0 ? this.refIndex.characters[0].id : '木头人';
          }
          this._updateBoardAndInspector(b);
        };
      }

      const insCharId = this.container.querySelector('#ins_characterId');
      if (insCharId) insCharId.onchange = (e) => { u.characterId = e.target.value; this._updateBoardAndInspector(b); };

      const insPartyIndex = this.container.querySelector('#ins_partyIndex');
      if (insPartyIndex) insPartyIndex.onchange = (e) => { u.partyIndex = parseInt(e.target.value, 10) || 1; this._updateBoardAndInspector(b); };

      const insMoveBtn = this.container.querySelector('#insMoveBtn');
      if (insMoveBtn) {
        insMoveBtn.onclick = () => {
          const nx = parseInt(this.container.querySelector('#ins_x').value, 10) || 0;
          const ny = parseInt(this.container.querySelector('#ins_y').value, 10) || 0;
          if (nx < 0 || nx > 10 || ny < 0 || ny > 3) {
            alert('坐标超出 11×4 网格范围！');
            return;
          }
          // 检查目标格是否有单位（固定单位与随机怪组共用 11×4 占用空间）
          const occupier = participants.find(p => p !== u && p.position.x === nx && p.position.y === ny)
            || (b.randomParticipants || []).find(r => r.position.x === nx && r.position.y === ny);
          if (occupier) {
            // 交换位置
            occupier.position = { x, y };
          }
          u.position = { x: nx, y: ny };
          this.selectedCell = { x: nx, y: ny };
          this._updateBoardAndInspector(b);
        };
      }

      const removeBtn = this.container.querySelector('#removeUnitFromBoardBtn');
      if (removeBtn) {
        removeBtn.onclick = () => {
          participants.splice(unitIndex, 1);
          this._updateBoardAndInspector(b);
          this.notify('已将该单位从战场撤下');
        };
      }
    } else {
      const randoms = b.randomParticipants || [];
      const rndIndex = randoms.findIndex(r => r.position && r.position.x === x && r.position.y === y);
      const rp = rndIndex !== -1 ? randoms[rndIndex] : null;

      if (rp) {
        // 随机怪组调校事件
        const clampTier = () => {
          if (!rp.boss && rp.tier > 3) {
            rp.tier = 3;
            this.notify('非头目怪组 tier 上限为 3；如需更强请勾选 👑 头目', 'warning');
          }
        };

        const rpName = this.container.querySelector('#rp_name');
        if (rpName) rpName.onchange = (e) => { rp.name = e.target.value.trim() || null; };

        const rpTier = this.container.querySelector('#rp_tier');
        if (rpTier) rpTier.onchange = (e) => { rp.tier = parseInt(e.target.value, 10) || 0; clampTier(); this._updateBoardAndInspector(b); };

        const rpBoss = this.container.querySelector('#rp_boss');
        if (rpBoss) rpBoss.onchange = (e) => { rp.boss = e.target.value === 'true'; clampTier(); this._updateBoardAndInspector(b); };

        const rpTeam = this.container.querySelector('#rp_team');
        if (rpTeam) rpTeam.onchange = (e) => { rp.team = parseInt(e.target.value, 10); this._updateBoardAndInspector(b); };

        const rpFacing = this.container.querySelector('#rp_facing');
        if (rpFacing) rpFacing.onchange = (e) => { rp.facing = parseInt(e.target.value, 10); this._updateBoardAndInspector(b); };

        const rpModel = this.container.querySelector('#rp_model');
        if (rpModel) rpModel.onchange = (e) => { rp.model = e.target.value.trim() || null; };

        const removeRndBtn = this.container.querySelector('#removeRandomFromBoardBtn');
        if (removeRndBtn) {
          removeRndBtn.onclick = () => {
            randoms.splice(rndIndex, 1);
            this._updateBoardAndInspector(b);
            this.notify('已将该随机怪组从战场撤下');
          };
        }
        return;
      }

      // 快捷放置事件
      const placeProtoBtn = this.container.querySelector('#placeProtagonistBtn');
      if (placeProtoBtn) {
        placeProtoBtn.onclick = () => {
          participants.push({
            position: { x, y },
            team: 1,
            facing: 1,
            characterId: null,
            partyIndex: 0
          });
          this._updateBoardAndInspector(b);
        };
      }

      const placeFollowerBtn = this.container.querySelector('#placeFollowerBtn');
      if (placeFollowerBtn) {
        placeFollowerBtn.onclick = () => {
          participants.push({
            position: { x, y },
            team: 1,
            facing: 1,
            characterId: null,
            partyIndex: 1
          });
          this._updateBoardAndInspector(b);
        };
      }

      const placeEnemyBtn = this.container.querySelector('#placeEnemyBtn');
      if (placeEnemyBtn) {
        placeEnemyBtn.onclick = () => {
          const sel = this.container.querySelector('#quickEnemySelect');
          const cid = sel ? sel.value : '木头人';
          participants.push({
            position: { x, y },
            team: 2,
            facing: 0,
            characterId: cid,
            partyIndex: null
          });
          this._updateBoardAndInspector(b);
        };
      }

      const placeRandomBtn = this.container.querySelector('#placeRandomBtn');
      if (placeRandomBtn) {
        placeRandomBtn.onclick = () => {
          const nameInput = this.container.querySelector('#quickRandomName');
          const tierSel = this.container.querySelector('#quickRandomTier');
          const tier = parseInt(tierSel ? tierSel.value : '1', 10) || 0;
          if (!Array.isArray(b.randomParticipants)) b.randomParticipants = [];
          b.randomParticipants.push({
            position: { x, y },
            team: 2,
            facing: 0,
            name: (nameInput && nameInput.value.trim()) || '江湖杂兵',
            tier,
            model: null,
            boss: tier >= 4
          });
          this._updateBoardAndInspector(b);
        };
      }
    }
  }

  _updateBoardAndInspector(b) {
    const board = this.container.querySelector('#battleGridBoard');
    if (board) board.innerHTML = this._renderBoardHtml(b);
    const insp = this.container.querySelector('#unitInspectorContainer');
    if (insp) insp.innerHTML = this._renderInspectorHtml(b);
    this._bindBoardEvents();
  }
}

/**
 * StoryView: 剧情对白流编排器
 */
class StoryView {
  constructor(adapter, refIndex, onSaveNotification) {
    this.adapter = adapter;
    this.refIndex = refIndex;
    this.notify = onSaveNotification;
    this.storyDoc = null;
    this.selectedSegment = null;
    this.searchKeyword = '';
    this.container = null;
  }

  render(parentEl) {
    this.container = parentEl;
    this.storyDoc = this.adapter.loadMainStory();
    if (this.storyDoc && Array.isArray(this.storyDoc.segments) && this.storyDoc.segments.length > 0) {
      if (!this.selectedSegment) {
        this.selectedSegment = this.storyDoc.segments[0];
      }
    }
    this._renderLayout();
  }

  _getFilteredSegments() {
    if (!this.storyDoc || !Array.isArray(this.storyDoc.segments)) return [];
    return this.storyDoc.segments.filter(s => {
      return !this.searchKeyword || (s.name && s.name.includes(this.searchKeyword));
    });
  }

  _renderLayout() {
    this.container.innerHTML = `
      <div class="view-split-layout">
        <!-- 左侧段落列表 -->
        <div class="sidebar-panel">
          <div class="sidebar-header">
            <input type="text" id="segSearch" class="search-input" placeholder="🔍 搜索剧情段落名称..." value="${this.searchKeyword}">
            <button id="addSegBtn" class="btn btn-primary" style="width: 100%; margin-top: 8px;">+ 新建故事段落</button>
          </div>
          <div class="item-list-scroll" id="segList">
            ${this._renderSegmentListHtml()}
          </div>
        </div>

        <!-- 右侧对白时间线画布 -->
        <div class="detail-panel" id="storyTimeline">
          ${this.selectedSegment ? this._renderTimelineHtml(this.selectedSegment) : '<div class="empty-hint" style="padding:40px; text-align:center; color:var(--text-muted);">请选择一个剧情段落展开对话流</div>'}
        </div>
      </div>
    `;

    this._bindEvents();
  }

  _renderSegmentListHtml() {
    const list = this._getFilteredSegments();
    if (list.length === 0) return '<div class="empty-list" style="padding:40px; text-align:center; color:var(--text-muted);">未找到匹配的剧情段落</div>';
    return list.map(s => {
      const isSelected = this.selectedSegment && this.selectedSegment.name === s.name;
      return `
        <div class="list-item-card ${isSelected ? 'active' : ''}" data-name="${s.name}">
          <div class="item-title-row">
            <span class="item-name text-purple">${s.name}</span>
            <span class="item-badge badge-purple">${(s.steps || []).length} 幕</span>
          </div>
        </div>
      `;
    }).join('');
  }

  _renderTimelineHtml(seg) {
    const steps = seg.steps || [];
    return `
      <div class="form-scroll-wrapper">
        <div class="detail-header-bar">
          <div>
            <h2 class="detail-title text-purple">${seg.name}</h2>
            <div class="detail-subtitle">剧情节点 · 共 ${steps.length} 个执行步骤</div>
          </div>
          <div class="btn-group">
            <button id="addDialogueStepBtn" class="btn btn-secondary">+ 插入对白 (Dialogue)</button>
            <button id="addChoiceStepBtn" class="btn btn-secondary">+ 插入抉择 (Choice)</button>
            <button id="addCommandStepBtn" class="btn btn-secondary">+ 插入指令 (Command)</button>
            <button id="saveStoryBtn" class="btn btn-primary">💾 保存剧本</button>
          </div>
        </div>

        <div class="timeline-step-list" id="stepListContainer">
          ${steps.length === 0 ? '<div style="color:var(--text-muted); font-size:14px; text-align:center; padding:60px 0;">当前段落暂无对话或步骤，请点击上方按钮插入对白</div>' : steps.map((step, idx) => `
            <div class="story-step-card" data-idx="${idx}">
              <div class="step-header">
                <div>
                  <span class="step-tag ${step.kind === 'dialogue' ? 'badge-purple' : (step.kind === 'choice' ? 'badge-gold' : 'badge-blue')}">
                    #${idx + 1} · ${step.kind.toUpperCase()}
                  </span>
                </div>
                <div class="btn-group">
                  <button class="btn btn-danger btn-sm remove-step-btn" data-idx="${idx}">删除此幕</button>
                </div>
              </div>

              ${step.kind === 'dialogue' ? `
                <div class="form-row">
                  <div class="form-group" style="flex:1;">
                    <label>说话者姓名/ID (speaker)</label>
                    <input type="text" class="input-field step-speaker-input" data-idx="${idx}" value="${step.speaker || ''}" placeholder="例如: 小虾米、南贤、mysterious">
                  </div>
                </div>
                <div class="form-group">
                  <label>台词文本 (text)</label>
                  <textarea class="input-field step-text-input" data-idx="${idx}" style="min-height:60px;">${step.text || ''}</textarea>
                </div>
              ` : ''}

              ${step.kind === 'choice' ? `
                <div class="form-group">
                  <label>题干引言 (prompt)</label>
                  <input type="text" class="input-field step-prompt-input" data-idx="${idx}" value="${step.prompt || ''}">
                </div>
                <div style="margin-top:8px;">
                  <label style="font-size:12px; color:var(--text-muted);">选择题分支选项 (Options)</label>
                  ${((step.groups && step.groups[0] && step.groups[0].options) || []).map((opt, oIdx) => `
                    <div style="display:flex; gap:6px; margin-top:6px;">
                      <input type="text" class="input-field opt-text-input" data-idx="${idx}" data-oidx="${oIdx}" value="${opt.text || ''}" style="flex:1;" placeholder="选项描述">
                      <input type="text" class="input-field opt-target-input" data-idx="${idx}" data-oidx="${oIdx}" value="${opt.target || ''}" style="width:180px;" placeholder="跳转段落 (target)">
                    </div>
                  `).join('')}
                </div>
              ` : ''}

              ${step.kind === 'command' ? `
                <div class="form-row">
                  <div class="form-group" style="flex:1;">
                    <label>指令名称 (command)</label>
                    <input type="text" class="input-field step-cmd-name" data-idx="${idx}" value="${step.command || 'item'}">
                  </div>
                  <div class="form-group" style="flex:2;">
                    <label>指令参数 (args: 以空格或逗号分隔)</label>
                    <input type="text" class="input-field step-cmd-args" data-idx="${idx}" value="${Array.isArray(step.args) ? step.args.join(' ') : (step.args || '')}">
                  </div>
                </div>
              ` : ''}
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  _bindEvents() {
    const searchInput = this.container.querySelector('#segSearch');
    if (searchInput) {
      searchInput.oninput = (e) => {
        this.searchKeyword = e.target.value.trim();
        this.container.querySelector('#segList').innerHTML = this._renderSegmentListHtml();
        this._bindListClickEvents();
      };
    }

    const addSegBtn = this.container.querySelector('#addSegBtn');
    if (addSegBtn) {
      addSegBtn.onclick = () => {
        const segName = prompt('请输入新故事段落名称 (例如 "新手村_客栈对饮"):');
        if (segName && segName.trim()) {
          const newSeg = {
            name: segName.trim(),
            steps: [
              { kind: 'dialogue', speaker: '主角', text: '初入江湖，不知天高地厚……' }
            ]
          };
          if (!this.storyDoc.segments) this.storyDoc.segments = [];
          this.storyDoc.segments.push(newSeg);
          this.selectedSegment = newSeg;
          this._renderLayout();
          this.notify(`已创建新段落《${newSeg.name}》`);
        }
      };
    }

    this._bindListClickEvents();
    this._bindTimelineEvents();
  }

  _bindListClickEvents() {
    this.container.querySelectorAll('.list-item-card').forEach(card => {
      card.onclick = () => {
        const name = card.dataset.name;
        this.selectedSegment = this.storyDoc.segments.find(s => s.name === name);
        this.container.querySelectorAll('.list-item-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        this.container.querySelector('#storyTimeline').innerHTML = this._renderTimelineHtml(this.selectedSegment);
        this._bindTimelineEvents();
      };
    });
  }

  _bindTimelineEvents() {
    if (!this.selectedSegment) return;
    const seg = this.selectedSegment;

    const addDiaBtn = this.container.querySelector('#addDialogueStepBtn');
    if (addDiaBtn) {
      addDiaBtn.onclick = () => {
        if (!seg.steps) seg.steps = [];
        seg.steps.push({ kind: 'dialogue', speaker: '小虾米', text: '请问阁下高姓大名？' });
        this._renderLayout();
      };
    }

    const addChoiceBtn = this.container.querySelector('#addChoiceStepBtn');
    if (addChoiceBtn) {
      addChoiceBtn.onclick = () => {
        if (!seg.steps) seg.steps = [];
        seg.steps.push({
          kind: 'choice',
          prompt: '你决定如何应对当下的局势？',
          groups: [
            {
              options: [
                { index: 0, text: '拔刀相助，绝不退缩！', target: '新手村_行侠仗义' },
                { index: 1, text: '暂且隐忍，徐图后计。', target: '新手村_避其锋芒' }
              ]
            }
          ]
        });
        this._renderLayout();
      };
    }

    const addCmdBtn = this.container.querySelector('#addCommandStepBtn');
    if (addCmdBtn) {
      addCmdBtn.onclick = () => {
        if (!seg.steps) seg.steps = [];
        seg.steps.push({ kind: 'command', command: 'item', args: ['木刀', '1'] });
        this._renderLayout();
      };
    }

    this.container.querySelectorAll('.remove-step-btn').forEach(btn => {
      btn.onclick = () => {
        const idx = parseInt(btn.dataset.idx, 10);
        seg.steps.splice(idx, 1);
        this._renderLayout();
      };
    });

    this.container.querySelectorAll('.step-speaker-input').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        if (seg.steps[idx]) seg.steps[idx].speaker = inp.value.trim();
      };
    });

    this.container.querySelectorAll('.step-text-input').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        if (seg.steps[idx]) seg.steps[idx].text = inp.value.trim();
      };
    });

    this.container.querySelectorAll('.step-prompt-input').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        if (seg.steps[idx]) seg.steps[idx].prompt = inp.value.trim();
      };
    });

    this.container.querySelectorAll('.opt-text-input').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        const oidx = parseInt(inp.dataset.oidx, 10);
        if (seg.steps[idx] && seg.steps[idx].groups && seg.steps[idx].groups[0].options[oidx]) {
          seg.steps[idx].groups[0].options[oidx].text = inp.value.trim();
        }
      };
    });

    this.container.querySelectorAll('.opt-target-input').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        const oidx = parseInt(inp.dataset.oidx, 10);
        if (seg.steps[idx] && seg.steps[idx].groups && seg.steps[idx].groups[0].options[oidx]) {
          seg.steps[idx].groups[0].options[oidx].target = inp.value.trim();
        }
      };
    });

    this.container.querySelectorAll('.step-cmd-name').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        if (seg.steps[idx]) seg.steps[idx].command = inp.value.trim();
      };
    });

    this.container.querySelectorAll('.step-cmd-args').forEach(inp => {
      inp.onchange = () => {
        const idx = parseInt(inp.dataset.idx, 10);
        if (seg.steps[idx]) {
          const parts = inp.value.trim().split(/[\s,]+/).filter(Boolean);
          seg.steps[idx].args = parts;
        }
      };
    });

    const saveBtn = this.container.querySelector('#saveStoryBtn');
    if (saveBtn) {
      saveBtn.onclick = async () => {
        saveBtn.innerText = '⏳ 保存中...';
        const res = await this.adapter.saveMainStory(this.storyDoc);
        saveBtn.innerText = '💾 保存剧本';
        if (res.success) {
          this.notify(`成功保存剧情段落至 stories/main.story.json！${describeSaveState(res)}`, saveToastType(res));
          this._renderLayout();
        } else {
          this.notify('剧本保存失败: ' + (res.error || '未知错误'), 'error');
        }
      };
    }
  }
}

/**
 * HealthView: 全局数据健康检查
 */
class HealthView {
  constructor(validator, onNavigate) {
    this.validator = validator;
    this.navigate = onNavigate;
    this.issues = [];
    this.container = null;
    this.hasAudited = false;
  }

  render(parentEl) {
    this.container = parentEl;
    if (!this.hasAudited) {
      this.issues = this.validator.runFullAudit();
      this.hasAudited = true;
    }
    this._renderLayout();
  }

  _renderLayout() {
    const errors = this.issues.filter(i => i.level === 'error');
    const warns = this.issues.filter(i => i.level === 'warn');

    this.container.innerHTML = `
      <div class="health-check-layout">
        <div class="health-header-card">
          <div class="health-title-group">
            <h2>🔍 全局数据健康检查与悬空引用排查</h2>
            <p>自动扫描角色、武学、神兵、战棋、剧情对白与资源别名之间的引用链，杜绝因拼写错误导致的游戏崩溃。</p>
          </div>
          <button id="recheckBtn" class="btn btn-primary">重新全面体检</button>
        </div>

        <div class="health-stats-row">
          <div class="health-stat-card ${errors.length > 0 ? 'card-error' : 'card-ok'}">
            <div class="stat-num">${errors.length}</div>
            <div class="stat-desc">致命引用断裂 (Error)</div>
          </div>
          <div class="health-stat-card ${warns.length > 0 ? 'card-warn' : 'card-ok'}">
            <div class="stat-num">${warns.length}</div>
            <div class="stat-desc">悬空或缺失警告 (Warning)</div>
          </div>
          <div class="health-stat-card card-ok">
            <div class="stat-num">100%</div>
            <div class="stat-desc">JSON 语法合规率</div>
          </div>
        </div>

        <div class="health-issues-list">
          ${this.issues.length === 0 ? `
            <div class="health-clean-box">
              <div class="clean-icon">🎉</div>
              <h3>完美！当前 MOD 未发现任何断裂引用或致命问题</h3>
              <p>所有角色头像、技能、物品、战棋布阵和剧情跳转段落均能严密对应。</p>
            </div>
          ` : this.issues.map(iss => `
            <div class="issue-card ${iss.level === 'error' ? 'issue-error' : 'issue-warn'}">
              <div class="issue-badge">${iss.module} · ${iss.level.toUpperCase()}</div>
              <div class="issue-content">
                <h4>${iss.title}</h4>
                <p>${iss.message}</p>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;

    const recheckBtn = this.container.querySelector('#recheckBtn');
    if (recheckBtn) {
      recheckBtn.onclick = () => {
        recheckBtn.innerText = '正在排查...';
        this.issues = this.validator.runFullAudit();
        this._renderLayout();
      };
    }
  }
}

/**
 * ModStudioApp: MOD 创作者工坊应用中枢
 */
class ModStudioApp {
  constructor() {
    this.fs = new FileSystemDriver();
    this.refIndex = new ReferenceIndex();
    this.adapter = new JsonDataAdapter(this.fs);
    this.validator = new ModValidator(this.fs, this.refIndex);

    this.currentTab = 'items';
    this.views = {};
    this.isLoaded = false;
  }

  init() {
    this._bindGlobalEvents();
    this._showWelcome();
  }

  showToast(message, type = 'info') {
    const toast = document.getElementById('toastNotification');
    if (!toast) return;
    toast.innerText = message;
    toast.className = `show toast-${type}`;
    setTimeout(() => {
      toast.className = '';
    }, 3000);
    this.refreshDirtyBar();
  }

  // 顶部状态条：展示未落盘更改数量与草稿恢复入口
  refreshDirtyBar() {
    const bar = document.getElementById('dirtyStateBar');
    if (!bar) return;
    const fs = this.fs;
    const dirtyCount = fs.dirtyFiles ? fs.dirtyFiles.size : 0;
    // 只提示不属于当前内存工作区的历史草稿；已在内存 dirty 集合中的草稿以内存为准
    const pendingRestore = this.isLoaded
      ? fs.listDrafts().filter(d => !fs.dirtyFiles.has(d.path))
      : [];

    if (pendingRestore.length > 0) {
      const names = pendingRestore.map(d => d.path).join('、');
      bar.className = 'dsb-visible';
      bar.innerHTML = `
        <span>📜 检测到上次未落盘的 ${pendingRestore.length} 个草稿：${names}</span>
        <button class="dsb-btn primary" id="dsbRestoreBtn">♻️ 恢复草稿继续编辑</button>
        <button class="dsb-btn" id="dsbDiscardBtn">🗑️ 丢弃草稿</button>
      `;
      const restoreBtn = bar.querySelector('#dsbRestoreBtn');
      const discardBtn = bar.querySelector('#dsbDiscardBtn');
      if (restoreBtn) restoreBtn.onclick = () => this.handleRestoreDrafts(pendingRestore);
      if (discardBtn) discardBtn.onclick = () => this.handleDiscardDrafts(pendingRestore);
      return;
    }

    if (dirtyCount > 0) {
      const modeLabel = fs.mode === 'http' ? 'HTTP 预设模式' : '内存模式';
      bar.className = 'dsb-visible';
      bar.innerHTML = `
        <span>⚠️ ${dirtyCount} 个文件的更改仅保存在浏览器内存中（${modeLabel}），刷新页面将丢失</span>
        <button class="dsb-btn primary" id="dsbExportBtn">⬇️ 导出更改文件</button>
        <button class="dsb-btn" id="dsbFlushBtn">📂 挂载 MOD 目录并落盘</button>
      `;
      const exportBtn = bar.querySelector('#dsbExportBtn');
      const flushBtn = bar.querySelector('#dsbFlushBtn');
      if (exportBtn) exportBtn.onclick = () => this.handleExportChanged();
      if (flushBtn) flushBtn.onclick = () => this.handleMountFlush();
      return;
    }

    if (this.isLoaded && fs.mode === 'native') {
      bar.className = 'dsb-clean';
      bar.innerHTML = '<span>✅ 所有更改已同步写入本地 MOD 目录</span>';
      return;
    }

    bar.className = '';
    bar.innerHTML = '';
  }

  async handleExportChanged() {
    const res = await this.fs.exportChangedFiles();
    if (res.success && res.count > 0) {
      this.showToast(`已导出 ${res.count} 个更改文件到浏览器下载目录，请手动放回 MOD 目录对应位置`, 'success');
      this.refreshDirtyBar();
    } else if (res.success) {
      this.showToast('当前没有需要导出的更改', 'info');
    } else {
      this.showToast('导出中断：部分文件未成功下载，请重试', 'error');
    }
  }

  async handleMountFlush() {
    if (this.fs.dirtyFiles.size === 0) {
      this.showToast('当前没有未落盘的更改', 'info');
      return;
    }
    const goOn = confirm(`将把 ${this.fs.dirtyFiles.size} 个更改文件写入你选择的 MOD 根目录。\n请务必选中包含 data/ 子目录的 MOD 根目录，继续吗？`);
    if (!goOn) return;
    const res = await this.fs.mountAndFlush();
    if (res.success) {
      this.showToast(`✅ 已把 ${res.count} 个文件写入本地 MOD 目录`, 'success');
      document.getElementById('currentModLabel').innerText = `当前项目: ${this.fs.currentModName} (原生直写)`;
    } else if (!res.cancelled) {
      this.showToast('落盘失败: ' + (res.error || '未知错误'), 'error');
    }
    this.refreshDirtyBar();
  }

  handleRestoreDrafts(drafts) {
    this.fs.restoreDrafts(drafts);
    this.refIndex.rebuildIndex(this.fs);
    this.views = this._createViews();
    this.switchTab(this.currentTab);
    this.showToast(`已恢复 ${drafts.length} 个草稿文件，确认内容无误后请导出或挂载落盘`, 'success');
    this.refreshDirtyBar();
  }

  handleDiscardDrafts(drafts) {
    const goOn = confirm(`确定丢弃 ${drafts.length} 个未落盘草稿吗？此操作不可撤销。`);
    if (!goOn) return;
    this.fs.discardDrafts(drafts);
    this.showToast('草稿已丢弃', 'info');
    this.refreshDirtyBar();
  }

  async handleLoadPreset(modId = 'wuxia-legend') {
    const label = document.getElementById('currentModLabel');
    if (label) label.innerText = '⏳ 正在加载预设...';
    try {
      const res = await this.fs.loadPresetMod(modId);
      if (res.success) {
        if (label) label.innerText = `当前项目: ${res.name} (HTTP极速模式)`;
        this._onModLoaded(res);
        const openBtn = document.getElementById('openModDirBtn');
        if (openBtn) openBtn.innerText = '📂 切换 MOD 目录';
        this.showToast(`成功载入 MOD《${res.name}》，已读取 ${res.count} 个数据文件并构建图鉴索引！`, 'success');
      } else {
        if (label) label.innerText = this.isLoaded ? `当前项目: ${this.fs.currentModName}` : '未打开 MOD 目录';
        this.showToast(res.error || '未能加载预设，请选择本地目录', 'error');
      }
    } catch (e) {
      console.error(e);
      if (label) label.innerText = this.isLoaded ? `当前项目: ${this.fs.currentModName}` : '未打开 MOD 目录';
      this.showToast('加载预设异常: ' + e.message, 'error');
    }
  }

  async handleOpenDirectory() {
    const openBtn = document.getElementById('openModDirBtn');
    if (openBtn) openBtn.innerText = '⏳ 正在加载...';
    try {
      const res = await this.fs.selectDirectory();
      if (res.success) {
        if (openBtn) openBtn.innerText = '📂 切换 MOD 目录';
        const modeLabel = res.mode === 'native' ? '原生直写' : '内存模式';
        document.getElementById('currentModLabel').innerText = `当前项目: ${res.name} (${modeLabel})`;
        this._onModLoaded(res);
        this.showToast(`成功载入 MOD《${res.name}》，已构建全局引用与原画图鉴网络！`, 'success');
      } else {
        if (openBtn) openBtn.innerText = this.isLoaded ? '📂 切换 MOD 目录' : '📂 打开 MOD 目录';
        if (!res.cancelled) {
          this.showToast('未能读取所选目录，请确认目录内包含 JSON 数据', 'warning');
        }
      }
    } catch (e) {
      console.error(e);
      if (openBtn) openBtn.innerText = this.isLoaded ? '📂 切换 MOD 目录' : '📂 打开 MOD 目录';
      this.showToast('选择目录异常: ' + e.message, 'error');
    }
  }

  _createViews() {
    return {
      items: new ItemView(this.adapter, this.refIndex, (msg, type) => this.showToast(msg, type)),
      skills: new MartialArtsHubView(this.adapter, this.refIndex, (msg, type) => this.showToast(msg, type)),
      characters: new CharacterView(this.adapter, this.refIndex, (msg, type) => this.showToast(msg, type)),
      talents_buffs: new TalentBuffHubView(this.adapter, this.refIndex, (msg, type) => this.showToast(msg, type)),
      shops: new ShopView(this.adapter, this.refIndex, (msg, type) => this.showToast(msg, type)),
      battles: new BattleView(this.adapter, this.refIndex, (msg, type) => this.showToast(msg, type)),
      stories: new StoryView(this.adapter, this.refIndex, (msg, type) => this.showToast(msg, type)),
      health: new HealthView(this.validator, (tab) => this.switchTab(tab))
    };
  }

  // 页面级 datalist：为各工坊的 ID 输入框提供联想数据源
  _populateDatalists() {
    const fill = (id, values) => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = values.map(v => `<option value="${v}"></option>`).join('');
    };
    fill('affixSkillIdList', this.refIndex.skills.map(s => s.id));
    fill('affixExtSkillIdList', this.refIndex.skills.filter(s => s.category === 'external').map(s => s.id));
    fill('affixBuffIdList', (this.refIndex.buffs || []).map(b => b.id));
    fill('affixItemIdList', this.refIndex.items.map(i => i.id));
  }

  _onModLoaded(res) {
    this.refIndex.rebuildIndex(this.fs);
    this.isLoaded = true;

    // 初始化各个工坊子视图
    this.views = this._createViews();

    this.switchTab(this.currentTab);
    // 页面级 ID 联想数据源 + 草稿检查
    this._populateDatalists();
    this.refreshDirtyBar();
  }

  _bindGlobalEvents() {
    const openBtn = document.getElementById('openModDirBtn');
    if (openBtn) {
      openBtn.onclick = () => this.handleOpenDirectory();
    }

    const quickBtn = document.getElementById('quickLoadWuxiaBtn');
    if (quickBtn) {
      quickBtn.onclick = () => this.handleLoadPreset('wuxia-legend');
    }

    document.querySelectorAll('.nav-tab-btn').forEach(btn => {
      btn.onclick = () => {
        if (!this.isLoaded) {
          this.showToast('请先选择 MOD：可点击上方【⚡ 载入《武侠传奇》】或【📂 打开 MOD 目录】！');
          return;
        }
        const tab = btn.dataset.tab;
        this.switchTab(tab);
      };
    });
  }

  switchTab(tabName) {
    this.currentTab = tabName;
    document.querySelectorAll('.nav-tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tabName);
    });

    const mainContainer = document.getElementById('mainAppContainer');
    if (!this.views[tabName]) return;

    mainContainer.innerHTML = '';
    this.views[tabName].render(mainContainer);
  }

  _showWelcome() {
    const isFileProtocol = location.protocol === 'file:';
    const mainContainer = document.getElementById('mainAppContainer');
    mainContainer.innerHTML = `
      <div class="welcome-hero-box">
        <div class="welcome-card">
          <div class="welcome-badge">纯前端 · 零服务依赖 · 本地安全直写 · 原画图鉴直显</div>
          <h1>《金庸群侠传XR》MOD 创作者工坊</h1>
          <p class="welcome-subtitle">专为神兵塑造、武学创新、侠客资质配置与 11×4 战棋布阵量身打造的可视化创作中心</p>

          <div class="feature-card-grid">
            <div class="f-card">
              <div class="f-icon">🗡️</div>
              <h4>神兵与道具工坊</h4>
              <p>自由挑选神兵插画、调整属性词条、暴击率与专属天赋。</p>
            </div>
            <div class="f-card">
              <div class="f-icon">🥋</div>
              <h4>武学与招式工坊</h4>
              <p>直观选择直线、星芒群攻范围，设置怒气消耗与招式解锁。</p>
            </div>
            <div class="f-card">
              <div class="f-icon">👤</div>
              <h4>侠客与宗师工坊</h4>
              <p>高清立绘可视化选定，四维专精与内功外功一键装配。</p>
            </div>
            <div class="f-card">
              <div class="f-icon">⚔️</div>
              <h4>11×4 战棋工坊</h4>
              <p>微型棋盘直观布阵、调整阵营与面向，招式范围即时演练。</p>
            </div>
            <div class="f-card">
              <div class="f-icon">📜</div>
              <h4>剧情对白流编排</h4>
              <p>气泡化撰写剧情对话、选择题分支与银两道具奖励。</p>
            </div>
          </div>

          <div class="welcome-action-box" style="display:flex; flex-direction:column; align-items:center; gap:12px; max-width:560px; margin:0 auto;">
            <button id="welcomeLoadWuxiaBtn" class="btn btn-primary btn-lg" style="width:100%; font-size:1.05rem; background:linear-gradient(135deg, #059669, #10b981); border:none; box-shadow:0 4px 14px rgba(16,185,129,0.3);">
              ⚡ 一键极速载入《武侠传奇》MOD (推荐)
            </button>
            <div style="display:flex; gap:12px; width:100%;">
              <button id="welcomeLoadBaseBtn" class="btn btn-secondary" style="flex:1; padding:10px;">
                📦 载入《基础数据包》(jyxr-base)
              </button>
              <button id="welcomeOpenModBtn" class="btn btn-secondary" style="flex:1; padding:10px;">
                📂 手动选择本地 MOD 目录...
              </button>
            </div>
            <div class="welcome-hint" style="margin-top:6px; color:var(--text-muted); font-size:0.85rem;">
              全面适配 Chrome / Safari / Edge / Firefox 现代浏览器，支持零等待一键载入与本地磁盘直写
            </div>
            ${isFileProtocol ? `
              <div class="protocol-tip" style="margin-top: 16px; text-align:left; font-size:0.85rem; padding:12px; background:rgba(59,130,246,0.1); border:1px solid rgba(59,130,246,0.25); border-radius:8px;">
                💡 <strong>直写磁盘体验提示</strong>：您当前是通过 <code>file://</code> 打开。<br>
                在 Mac 上只需在 Finder 双击运行 <code>tools/mod_editor/启动MOD编辑器.command</code>，即可通过 <code>localhost</code> 获得一键极速载入与原生磁盘直写体验！
              </div>
            ` : ''}
          </div>
        </div>
      </div>
    `;

    const welcomeLoadWuxiaBtn = mainContainer.querySelector('#welcomeLoadWuxiaBtn');
    if (welcomeLoadWuxiaBtn) {
      welcomeLoadWuxiaBtn.onclick = () => this.handleLoadPreset('wuxia-legend');
    }

    const welcomeLoadBaseBtn = mainContainer.querySelector('#welcomeLoadBaseBtn');
    if (welcomeLoadBaseBtn) {
      welcomeLoadBaseBtn.onclick = () => this.handleLoadPreset('jyxr-base');
    }

    const welcomeBtn = mainContainer.querySelector('#welcomeOpenModBtn');
    if (welcomeBtn) {
      welcomeBtn.onclick = () => this.handleOpenDirectory();
    }
  }
}

  const app = new ModStudioApp();
  app.init();
});
