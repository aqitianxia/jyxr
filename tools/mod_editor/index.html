            <span style="font-size:12.5px; color:var(--text-muted);">程序化刷怪组：</span>
            <input type="text" class="input-field" id="quickRandomName" value="江湖杂兵" style="width:120px; font-size:12px;" placeholder="显示名称">
            <select class="input-field" id="quickRandomTier" style="width:110px; font-size:12px;">
              <option value="0">T0 弱杂兵</option>
              <option value="1" selected>T1 杂兵</option>
              <option value="2">T2 精锐</option>
              <option value="3">T3 精英</option>
              <option value="4">T4 头目</option>
              <option value="5">T5 大头目</option>
            </select>
            <button class="btn btn-secondary btn-sm" id="placeRandomBtn">🎲 放置随机怪组</button>
          </div>
        </div>
      `;
    }
  }

  _bindEvents() {
    const searchInput = this.container.querySelector('#battleSearch');
    if (searchInput) {
      searchInput.oninput = (e) => {
        this.searchKeyword = e.target.value.trim();
        this.container.querySelector('#battleList').innerHTML = this._renderBattleListHtml();
        this._bindListClickEvents();
      };
    }

    const addBtn = this.container.querySelector('#addBattleBtn');
    if (addBtn) {
      addBtn.onclick = () => {
        const newBattle = BattleSchema.defaultBattle();
        newBattle.id = 'battle_' + Date.now().toString().slice(-4);
        newBattle.name = '自创新战役';
        this.battles.unshift(newBattle);
        this.selectedBattle = newBattle;
        this.selectedCell = { x: 2, y: 2 };
        this._renderLayout();
        this.notify('已新建战役，请进行战棋布阵！');
      };
    }

    this._bindListClickEvents();
    this._bindFormEvents();
    this._bindBoardEvents();
  }

  _bindListClickEvents() {
    this.container.querySelectorAll('.list-item-card').forEach(card => {
      card.onclick = () => {
        const id = card.dataset.id;
        this.selectedBattle = this.battles.find(b => b.id === id);
        this.container.querySelectorAll('.list-item-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        this.container.querySelector('#battleDetail').innerHTML = this._renderDetailHtml(this.selectedBattle);
        this._bindFormEvents();
        this._bindBoardEvents();
      };
    });
  }

  _bindFormEvents() {
    if (!this.selectedBattle) return;
    const b = this.selectedBattle;

    const pickBgBtn = this.container.querySelector('#pickBattleBgBtn');
    if (pickBgBtn) {
      pickBgBtn.onclick = () => {
        MediaPickerModal.open({
          type: 'battle_bg',
          title: '挑选战棋战场高清背景',
          current: b.background,
          refIndex: this.refIndex,
          resourceResolver: this.resolver,
          onSelect: (ref) => {
            b.background = ref;
            this._renderLayout();
          }
        });
      };
    }

    const addReqBtn = this.container.querySelector('#addReqBtn');
    if (addReqBtn) {
      addReqBtn.onclick = () => {
        const sel = this.container.querySelector('#newReqSelect');
        if (sel && sel.value) {
          if (!Array.isArray(b.requiredCharacterIds)) b.requiredCharacterIds = [];
          if (!b.requiredCharacterIds.includes(sel.value)) {
            b.requiredCharacterIds.push(sel.value);
            this._renderLayout();
          }
        }
      };
    }

    this.container.querySelectorAll('.remove-req-chip').forEach(btn => {
      btn.onclick = () => {
        const idx = parseInt(btn.dataset.idx, 10);
        b.requiredCharacterIds.splice(idx, 1);
        this._renderLayout();
      };
    });

    const resetBasicBtn = this.container.querySelector('#resetBasicBattleBtn');
    if (resetBasicBtn) {
      resetBasicBtn.onclick = () => {
        b.participants = [
          { position: { x: 2, y: 2 }, team: 1, facing: 1, characterId: null, partyIndex: 0 },
          { position: { x: 8, y: 2 }, team: 2, facing: 0, characterId: '木头人', partyIndex: null }
        ];
        b.randomParticipants = [];
        this._renderLayout();
        this.notify('已重置为标准单挑站位 (主角 vs 木人)');
      };
    }

    const clearAllBtn = this.container.querySelector('#clearAllUnitsBtn');
    if (clearAllBtn) {
      clearAllBtn.onclick = () => {
        if (confirm('确定要清空当前棋盘上的所有参战站位吗？')) {
          b.participants = [];
          b.randomParticipants = [];
          this._renderLayout();
          this.notify('已清空棋盘所有站位');
        }
      };
    }

    const rangeModeSelect = this.container.querySelector('#rangeModeSelect');
    if (rangeModeSelect) {
      rangeModeSelect.onchange = (e) => {
        this.previewImpactType = e.target.value;
      };
    }

    const rangeSizeInput = this.container.querySelector('#rangeSizeInput');
    if (rangeSizeInput) {
      rangeSizeInput.onchange = (e) => {
        this.previewImpactSize = parseInt(e.target.value, 10) || 1;
      };
    }

    const toggleHoverRange = this.container.querySelector('#toggleHoverRange');
    if (toggleHoverRange) {
      toggleHoverRange.onchange = (e) => {
        this.enableHoverRange = e.target.checked;
      };
    }

    const dupBtn = this.container.querySelector('#duplicateBattleBtn');
    if (dupBtn) {
      dupBtn.onclick = () => {
        const cloned = JSON.parse(JSON.stringify(b));
        cloned.id = b.id + '_copy';
        cloned.name = (b.name || b.id) + ' (副本)';
        this.battles.unshift(cloned);
        this.selectedBattle = cloned;
        this._renderLayout();
        this.notify('战役场景克隆成功！');
      };
    }

    const delBtn = this.container.querySelector('#deleteBattleBtn');
    if (delBtn) {
      delBtn.onclick = () => {
        if (confirm(`确定要删除战役《${b.name || b.id}》吗？`)) {
          const idx = this.battles.findIndex(i => i.id === b.id);
          if (idx !== -1) {
            this.battles.splice(idx, 1);
            this.selectedBattle = this.battles[0] || null;
            this._renderLayout();
            this.notify('战役场景已删除');
          }
        }
      };
    }

    const saveBtn = this.container.querySelector('#saveBattlesBtn');
    if (saveBtn) {
      saveBtn.onclick = async () => {
        saveBtn.innerText = '⏳ 保存中...';
        b.name = this.container.querySelector('#bt_name').value.trim();
        b.id = this.container.querySelector('#bt_id').value.trim();
        b.experienceMultiplier = parseFloat(this.container.querySelector('#bt_exp').value) || 1.0;
        b.music = this.container.querySelector('#bt_music').value || null;

        const res = await this.adapter.saveBattles(this.battles);
        saveBtn.innerText = '💾 保存战场配置';
        if (res.success) {
          this.notify(`成功保存 ${this.battles.length} 场战役至 battles.json！${describeSaveState(res)}`, saveToastType(res));
          this._renderLayout();
        } else {
          this.notify('保存失败: ' + (res.error || '未知错误'), 'error');
        }
      };
    }
  }

  _bindBoardEvents() {
    if (!this.selectedBattle) return;
    const b = this.selectedBattle;

    // 点击棋盘格子
    this.container.querySelectorAll('.battle-cell').forEach(cell => {
      const x = parseInt(cell.dataset.x, 10);
      const y = parseInt(cell.dataset.y, 10);

      cell.onclick = () => {
        this.selectedCell = { x, y };
        this.container.querySelectorAll('.battle-cell').forEach(c => c.classList.remove('selected-cell'));
        cell.classList.add('selected-cell');
        this.container.querySelector('#unitInspectorContainer').innerHTML = this._renderInspectorHtml(b);
        this._bindInspectorEvents();
      };

      // 悬停招式范围演练
      cell.onmouseenter = () => {
        if (!this.enableHoverRange) return;
        this._highlightSkillRange(x, y);
      };

      cell.onmouseleave = () => {
        this._clearRangeHighlight();
      };
    });

    this._bindInspectorEvents();
  }

  _highlightSkillRange(cx, cy) {
    this._clearRangeHighlight();
    const type = this.previewImpactType;
    const size = this.previewImpactSize;

    const hitCells = [];

    if (type === 'single') {
      hitCells.push({ x: cx, y: cy });
    } else if (type === 'line') {
      const dir = cx <= 5 ? 1 : -1;
      for (let s = 0; s <= size; s++) {
        const nx = cx + s * dir;
        if (nx >= 0 && nx < 11) hitCells.push({ x: nx, y: cy });
      }
    } else if (type === 'plus') {
      hitCells.push({ x: cx, y: cy });
      for (let s = 1; s <= size; s++) {
        if (cx + s < 11) hitCells.push({ x: cx + s, y: cy });
        if (cx - s >= 0) hitCells.push({ x: cx - s, y: cy });
        if (cy + s < 4) hitCells.push({ x: cx, y: cy + s });
        if (cy - s >= 0) hitCells.push({ x: cx, y: cy - s });
      }
    } else if (type === 'star') {
      for (let x = 0; x < 11; x++) {
        for (let y = 0; y < 4; y++) {
          if (Math.abs(x - cx) + Math.abs(y - cy) <= size) {
            hitCells.push({ x, y });
          }
        }
      }
    } else if (type === 'all') {
      for (let x = 0; x < 11; x++) {
        for (let y = 0; y < 4; y++) {
          hitCells.push({ x, y });
        }
      }
    }

    hitCells.forEach(p => {
      const el = this.container.querySelector(`.battle-cell[data-x="${p.x}"][data-y="${p.y}"]`);
      if (el) {
        if (p.x === cx && p.y === cy) el.classList.add('cell-range-origin');
        else el.classList.add('cell-range-hit');
      }
    });
  }

  _clearRangeHighlight() {
    this.container.querySelectorAll('.battle-cell').forEach(c => {
      c.classList.remove('cell-range-hit', 'cell-range-origin');
    });
  }

  _bindInspectorEvents() {
    if (!this.selectedBattle || !this.selectedCell) return;
    const b = this.selectedBattle;
    const { x, y } = this.selectedCell;
    const participants = b.participants || [];
    const unitIndex = participants.findIndex(p => p.position && p.position.x === x && p.position.y === y);
    const u = unitIndex !== -1 ? participants[unitIndex] : null;

    if (u) {
      const insTeam = this.container.querySelector('#ins_team');
      if (insTeam) insTeam.onchange = (e) => { u.team = parseInt(e.target.value, 10); this._updateBoardAndInspector(b); };

      const insFacing = this.container.querySelector('#ins_facing');
      if (insFacing) insFacing.onchange = (e) => { u.facing = parseInt(e.target.value, 10); this._updateBoardAndInspector(b); };

      const insIdentity = this.container.querySelector('#ins_identity');
      if (insIdentity) {
        insIdentity.onchange = (e) => {
          const val = e.target.value;
          if (val === 'protagonist') {
            u.partyIndex = 0;
            u.characterId = null;
            u.team = 1;
            u.facing = 1;
          } else if (val === 'follower') {
            u.partyIndex = 1;
            u.characterId = null;
            u.team = 1;
            u.facing = 1;
          } else {
            u.partyIndex = null;
            u.characterId = this.refIndex.characters.length > 0 ? this.refIndex.characters[0].id : '木头人';
          }
          this._updateBoardAndInspector(b);
        };
      }

      const insCharId = this.container.querySelector('#ins_characterId');
      if (insCharId) insCharId.onchange = (e) => { u.characterId = e.target.value; this._updateBoardAndInspector(b); };

      const insPartyIndex = this.container.querySelector('#ins_partyIndex');
      if (insPartyIndex) insPartyIndex.onchange = (e) => { u.partyIndex = parseInt(e.target.value, 10) || 1; this._updateBoardAndInspector(b); };

      const insMoveBtn = this.container.querySelector('#insMoveBtn');
      if (insMoveBtn) {
        insMoveBtn.onclick = () => {
          const nx = parseInt(this.container.querySelector('#ins_x').value, 10) || 0;
          const ny = parseInt(this.container.querySelector('#ins_y').value, 10) || 0;
          if (nx < 0 || nx > 10 || ny < 0 || ny > 3) {
            alert('坐标超出 11×4 网格范围！');
            return;
          }
          // 检查目标格是否有单位（固定单位与随机怪组共用 11×4 占用空间）
          const occupier = participants.find(p => p !== u && p.position.x === nx && p.position.y === ny)
            || (b.randomParticipants || []).find(r => r.position.x === nx && r.position.y === ny);
          if (occupier) {
            // 交换位置
            occupier.position = { x, y };
          }
          u.position = { x: nx, y: ny };
          this.selectedCell = { x: nx, y: ny };
          this._updateBoardAndInspector(b);
        };
      }

      const removeBtn = this.container.querySelector('#removeUnitFromBoardBtn');
      if (removeBtn) {
        removeBtn.onclick = () => {
          participants.splice(unitIndex, 1);
          this._updateBoardAndInspector(b);
          this.notify('已将该单位从战场撤下');
        };
      }
    } else {
      const randoms = b.randomParticipants || [];
      const rndIndex = randoms.findIndex(r => r.position && r.position.x === x && r.position.y === y);
      const rp = rndIndex !== -1 ? randoms[rndIndex] : null;

      if (rp) {
        // 随机怪组调校事件
        const clampTier = () => {
          if (!rp.boss && rp.tier > 3) {
            rp.tier = 3;
            this.notify('非头目怪组 tier 上限为 3；如需更强请勾选 👑 头目', 'warning');
          }
        };

        const rpName = this.container.querySelector('#rp_name');
        if (rpName) rpName.onchange = (e) => { rp.name = e.target.value.trim() || null; };

        const rpTier = this.container.querySelector('#rp_tier');
        if (rpTier) rpTier.onchange = (e) => { rp.tier = parseInt(e.target.value, 10) || 0; clampTier(); this._updateBoardAndInspector(b); };

        const rpBoss = this.container.querySelector('#rp_boss');
        if (rpBoss) rpBoss.onchange = (e) => { rp.boss = e.target.value === 'true'; clampTier(); this._updateBoardAndInspector(b); };

        const rpTeam = this.container.querySelector('#rp_team');
        if (rpTeam) rpTeam.onchange = (e) => { rp.team = parseInt(e.target.value, 10); this._updateBoardAndInspector(b); };

        const rpFacing = this.container.querySelector('#rp_facing');
        if (rpFacing) rpFacing.onchange = (e) => { rp.facing = parseInt(e.target.value, 10); this._updateBoardAndInspector(b); };

        const rpModel = this.container.querySelector('#rp_model');
        if (rpModel) rpModel.onchange = (e) => { rp.model = e.target.value.trim() || null; };

        const removeRndBtn = this.container.querySelector('#removeRandomFromBoardBtn');
        if (removeRndBtn) {
          removeRndBtn.onclick = () => {
            randoms.splice(rndIndex, 1);
            this._updateBoardAndInspector(b);
            this.notify('已将该随机怪组从战场撤下');
          };
        }
        return;
      }

      // 快捷放置事件
      const placeProtoBtn = this.container.querySelector('#placeProtagonistBtn');
      if (placeProtoBtn) {
        placeProtoBtn.onclick = () => {
          participants.push({
            position: { x, y },
            team: 1,
            facing: 1,
            characterId: null,
            partyIndex: 0
          });
          this._updateBoardAndInspector(b);
        };
      }

      const placeFollowerBtn = this.container.querySelector('#placeFollowerBtn');
      if (placeFollowerBtn) {
        placeFollowerBtn.onclick = () => {
          participants.push({
            position: { x, y },
            team: 1,
            facing: 1,
            characterId: null,
            partyIndex: 1
          });
          this._updateBoardAndInspector(b);
        };
      }

      const placeEnemyBtn = this.container.querySelector('#placeEnemyBtn');
      if (placeEnemyBtn) {
        placeEnemyBtn.onclick = () => {
          const sel = this.container.querySelector('#quickEnemySelect');
          const cid = sel ? sel.value : '木头人';
          participants.push({
            position: { x, y },
            team: 2,
            facing: 0,
            characterId: cid,
            partyIndex: null
          });
          this._updateBoardAndInspector(b);
        };
      }

      const placeRandomBtn = this.container.querySelector('#placeRandomBtn');
      if (placeRandomBtn) {
        placeRandomBtn.onclick = () => {
          const nameInput = this.container.querySelector('#quickRandomName');
          const tierSel = this.container.querySelector('#quickRandomTier');
          const tier = parseInt(tierSel ? tierSel.value : '1', 10) || 0;
          if (!Array.isArray(b.randomParticipants)) b.randomParticipants = [];
          b.randomParticipants.push({
            position: { x, y },
            team: 2,
            facing: 0,
            name: (nameInput && nameInput.value.trim()) || '江湖杂兵',
            tier,
            model: null,
            boss: tier >= 4
          });
          this._updateBoardAndInspector(b);
        };
      }
    }
  }

  _updateBoardAndInspector(b) {
    const board = this.container.querySelector('#battleGridBoard');
    if (board) board.innerHTML = this._renderBoardHtml(b);
    const insp = this.container.querySelector('#unitInspectorContainer');
    if (insp) insp.innerHTML = this._renderInspectorHtml(b);
    this._bindBoardEvents();
  }
}

/**
 * StoryDslTools: DSL 源码与 IR 的双向桥接
 * DSL 引擎来自原作者工具链 github.com/jyx-remake/story-dsl (MIT)，编译目标与本游戏 JSON IR v3 完全同构。
 * irToStoryText 负责把存量 IR 反编译为 DSL 草稿；compile 负责把 DSL 编译回 IR。
 */
const StoryDslTools = {
  irToStoryText(doc) {
    const lines = [];
    const warnings = [];
    for (const seg of doc.segments || []) {
      lines.push(`# ${seg.name}`);
      this._steps(seg.steps || [], 0, lines, warnings, `段落《${seg.name}》`);
      lines.push('');
    }
    return { text: lines.join('\n').replace(/\n{3,}/g, '\n\n').trimEnd() + '\n', warnings };
  },

  _steps(steps, depth, lines, warnings, where) {
    const pad = '  '.repeat(depth);
    for (const st of steps) {
      switch (st.kind) {
        case 'dialogue': {
          const stylePrefix = st.style ? `[#style=${st.style}]` : '';
          lines.push(`${pad}${st.speaker || ''}：${stylePrefix}${st.text || ''}`);
          break;
        }
        case 'command':
          lines.push(`${pad}${st.call}`);
          break;
        case 'jump':
          lines.push(`${pad}jump ${st.target}`);
          break;
        case 'call':
          lines.push(`${pad}call ${st.target}`);
          break;
        case 'return':
          lines.push(`${pad}return`);
          break;
        case 'set':
          lines.push(`${pad}${st.target} = ${st.value}`);
          break;
        case 'delete':
          lines.push(`${pad}del ${st.target}`);
          break;
        case 'battle': {
          lines.push(`${pad}battle ${st.battleId || ''}`);
          const oc = st.outcomes || {};
          for (const key of ['win', 'lose', 'timeout']) {
            if (Array.isArray(oc[key])) {
              lines.push(`${pad}- ${key}`);
              this._steps(oc[key], depth + 1, lines, warnings, where);
            }
          }
          break;
        }
        case 'branch': {
          (st.cases || []).forEach((c, i) => {
            lines.push(`${pad}${i === 0 ? 'if' : 'elif'} ${c.when}`);
            this._steps(c.steps, depth + 1, lines, warnings, where);
          });
          if (Array.isArray(st.fallback) && st.fallback.length > 0) {
            lines.push(`${pad}else`);
            this._steps(st.fallback, depth + 1, lines, warnings, where);
          }
          break;
        }
        case 'choice': {
          const p = st.prompt;
          const choiceStylePrefix = st.style ? `[#style=${st.style}]` : '';
          if (p) {
            lines.push(`${pad}${p.speaker || ''}：${choiceStylePrefix}${p.text || ''}`);
          } else {
            warnings.push(`${where}：存在无题干的抉择，DSL 要求抉择必须紧跟对白，已生成空对白占位`);
            lines.push(`${pad}：${choiceStylePrefix}`);
          }
          for (const b of st.blocks || []) {
            if (b.kind === 'options') {
              this._choiceOptions(b.options, depth, lines, warnings, where);
            } else if (b.kind === 'branch') {
              (b.cases || []).forEach((c, i) => {
                lines.push(`${pad}${i === 0 ? 'if' : 'elif'} ${c.when}`);
                this._choiceOptions(c.options, depth + 1, lines, warnings, where);
              });
              if (Array.isArray(b.fallback)) {
                lines.push(`${pad}else`);
                this._choiceOptions(b.fallback, depth + 1, lines, warnings, where);
              }
            }
          }
          break;
        }
        default:
          warnings.push(`${where}：未知步骤类型 "${st.kind}" 已跳过，保存前请回可视化模式处理`);
      }
    }
  },

  _choiceOptions(options, depth, lines, warnings, where) {
    const pad = '  '.repeat(depth);
    for (const o of options || []) {
      lines.push(`${pad}- ${o.text}${o.when ? ` if ${o.when}` : ''}`);
      this._steps(o.steps, depth + 1, lines, warnings, where);
    }
  },

  // DSL -> IR；存在 error 级诊断时 ir 为 null
  compile(text) {
    const parseResult = StoryDSL.parseStory(text);
    const compileResult = StoryDSL.compileScript(parseResult.ast);
    const diagnostics = [...parseResult.diagnostics, ...compileResult.diagnostics].map(d => ({
      severity: d.severity,
      code: d.code,
      message: d.message,
      line: d.span && d.span.start && d.span.start.line != null ? d.span.start.line : null
    }));
    const hasError = diagnostics.some(d => d.severity === 'error');
    return { ir: hasError ? null : compileResult.ir, diagnostics };
  }
};

/**
 * StoryView: 剧情对白流编排器 (适配真实 IR v3 结构)
 * 步骤类型: dialogue {speaker,text} / command {call} / jump {target} /
 *           battle {battleId, outcomes{win,lose?}} / branch {cases, fallback} /
 *           choice {prompt{speaker,text}, blocks[{kind:'options', options[{text, when?, steps}]}]}
 * 选项/胜负/分支内均为可继续嵌套的 steps 数组，编辑器递归渲染。
 */
class StoryView {
  static FILES = ['main', 'py', 'cg', 'jyxr', 'debug', 'starting-quiz'];
  static CALL_HINTS = [
    'item', 'change_item', 'change_silver', 'change_yuanbao', 'change_stat', 'change_morality',
    'change_favorability', 'grant_points', 'learn_external', 'learn_internal', 'learn_talent',
    'upgrade_external', 'maxlevel', 'journal', 'advance_days', 'unlock_achievement', 'join',
    'leave', 'map', 'music', 'background', 'intertitle', 'set_flag', 'clear_flag', 'set_time_key'
  ];

  constructor(adapter, refIndex, onSaveNotification) {
    this.adapter = adapter;
    this.refIndex = refIndex;
    this.notify = onSaveNotification;
    this.docs = {};            // fileId -> {version, segments}
    this.activeFile = 'main';
    this.selectedSegment = null;
    this.searchKeyword = '';
    this.container = null;
    // DSL 源码模式状态（按文件独立）
    this.viewModes = {};       // fileId -> 'visual' | 'dsl'
    this.dslTexts = {};        // fileId -> DSL 源码草稿
    this.dslResults = {};      // fileId -> { ir, diagnostics }
    this.dslDirty = {};        // fileId -> 是否有未编译保存的编辑
    this.dslTimer = null;
  }

  render(parentEl) {
    this.container = parentEl;
    for (const f of StoryView.FILES) {
      this.docs[f] = this.adapter.loadStoryFile(f);
    }
    if (!this.docs[this.activeFile]) this.activeFile = StoryView.FILES[0];
    this._restoreSelection();
    this._populateStoryDatalists();
    this._renderLayout();
  }

  // 剧情编辑下拉数据源：全库段落名 / 战役ID / 指令名（内建 + 数据中实际出现过的前缀）
  _populateStoryDatalists() {
    const fill = (id, values) => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = [...new Set(values)].map(v => `<option value="${v}"></option>`).join('');
    };
    fill('storyTargetList', this._allSegmentNames());
    fill('storyBattleList', (this.refIndex.battles || []).map(b => b.id));
    const observed = [];
    for (const f of StoryView.FILES) {
      const segs = this.docs[f].segments || [];
      const walk = (steps) => {
        for (const st of steps || []) {
          if (st.kind === 'command' && typeof st.call === 'string') observed.push(st.call.split('(')[0]);
          if (st.kind === 'battle') {
            const oc = st.outcomes || {};
            walk(oc.win); walk(oc.lose);
          }
          if (st.kind === 'branch') {
            for (const c of st.cases || []) walk(c.steps);
            walk(st.fallback);
          }
          if (st.kind === 'choice') {
            for (const b of st.blocks || []) for (const o of b.options || []) walk(o.steps);
          }
        }
      };
      for (const s of segs) walk(s.steps);
    }
    fill('storyCallList', StoryView.CALL_HINTS.concat(observed));
  }

  _restoreSelection() {
    const doc = this.docs[this.activeFile];
    const segs = doc && Array.isArray(doc.segments) ? doc.segments : [];
    if (this.selectedSegment && segs.includes(this.selectedSegment)) return;
    this.selectedSegment = segs[0] || null;
  }

  _allSegmentNames() {
    const names = [];
    for (const f of StoryView.FILES) {
      const segs = this.docs[f] && this.docs[f].segments;
      if (Array.isArray(segs)) for (const s of segs) if (s && s.name) names.push(s.name);
    }
    return names;
  }

  _renderLayout() {
    if (this.viewModes[this.activeFile] === 'dsl') {
      this._renderDslLayout();
      return;
    }
    this.container.innerHTML = `
      ${this._renderFileTabsHtml()}
      <div class="view-split-layout">
        <div class="sidebar-panel">
          <div class="sidebar-header">
            <input type="text" id="segSearch" class="search-input" placeholder="🔍 搜索剧情段落名称..." value="${this.searchKeyword}">
            <button id="addSegBtn" class="btn btn-primary" style="width: 100%; margin-top: 8px;">+ 新建故事段落</button>
          </div>
          <div class="item-list-scroll" id="segList">
            ${this._renderSegmentListHtml()}
          </div>
        </div>
        <div class="detail-panel" id="storyTimeline">
          ${this.selectedSegment ? this._renderTimelineHtml(this.selectedSegment) : '<div class="empty-hint" style="padding:40px; text-align:center; color:var(--text-muted);">请选择一个剧情段落展开对话流</div>'}
        </div>
      </div>
    `;
    this._bindEvents();
  }

  _renderFileTabsHtml() {
    const isDsl = this.viewModes[this.activeFile] === 'dsl';
    return `
      <div class="story-file-tabs">
        <span style="font-size:12px; color:var(--text-muted); margin-right:4px;">剧本文件:</span>
        ${StoryView.FILES.map(f => `
          <button class="story-file-btn ${f === this.activeFile ? 'active' : ''}" data-file="${f}">
            📜 ${f}.story.json (${(this.docs[f].segments || []).length}段)
          </button>
        `).join('')}
        <span style="flex:1;"></span>
        <div class="story-mode-toggle">
          <button class="story-mode-btn ${!isDsl ? 'active' : ''}" data-mode="visual" title="卡片式步骤编排">📋 可视化编排</button>
          <button class="story-mode-btn ${isDsl ? 'active' : ''}" data-mode="dsl" title="原作者 Story DSL 源码模式，像写剧本一样创作">⌨️ DSL 源码</button>
        </div>
      </div>
    `;
  }

  _bindCommonStoryTabs() {
    this.container.querySelectorAll('.story-file-btn').forEach(btn => {
      btn.onclick = () => {
        this.activeFile = btn.dataset.file;
        this._restoreSelection();
        this._renderLayout();
      };
    });
    this.container.querySelectorAll('.story-mode-btn').forEach(btn => {
      btn.onclick = () => this._switchMode(btn.dataset.mode);
    });
  }

  _switchMode(mode) {
    const file = this.activeFile;
    if (this.viewModes[file] === mode) return;
    if (mode === 'visual' && this.viewModes[file] === 'dsl' && this.dslDirty[file]) {
      if (!confirm('DSL 源码有未编译保存的修改，切回可视化模式将丢弃这些修改，继续吗？')) return;
      this.dslTexts[file] = null;
      this.dslResults[file] = null;
      this.dslDirty[file] = false;
    }
    if (mode === 'dsl') {
      // 以当前 IR 数据为准反编译一份新草稿
      const de = StoryDslTools.irToStoryText(this.docs[file]);
      this.dslTexts[file] = de.text;
      this.dslResults[file] = null;
      this.dslDirty[file] = false;
      if (de.warnings.length > 0) {
        this.notify(`反编译完成，${de.warnings.length} 条提示：${de.warnings[0]}`, 'warning');
      }
    }
    this.viewModes[file] = mode;
    this._renderLayout();
  }

  _renderDslLayout() {
    const file = this.activeFile;
    if (this.dslTexts[file] == null) {
      const de = StoryDslTools.irToStoryText(this.docs[file]);
      this.dslTexts[file] = de.text;
      this.dslResults[file] = null;
      this.dslDirty[file] = false;
      if (de.warnings.length > 0) {
        this.notify(`反编译完成，${de.warnings.length} 条提示：${de.warnings[0]}`, 'warning');
      }
    }
    if (!this.dslResults[file]) this._compileDsl(file);
    const res = this.dslResults[file] || { diagnostics: [] };
    const errCount = res.diagnostics.filter(d => d.severity === 'error').length;
    const warnCount = res.diagnostics.length - errCount;

    this.container.innerHTML = `
      ${this._renderFileTabsHtml()}
      <div class="story-dsl-wrap">
        <div class="story-dsl-toolbar">
          <span class="story-dsl-badge ${errCount > 0 ? 'bad' : 'ok'}" id="dslStatusBadge">
            ${errCount > 0 ? `❌ ${errCount} 个错误，修正后才能编译` : (warnCount > 0 ? `⚠️ ${warnCount} 个警告，可编译` : `✅ 语法检查通过，可编译${res.ir ? ` (${res.ir.segments.length} 段)` : ''}`)}
          </span>
          <button id="dslSaveBtn" class="btn btn-primary" ${errCount > 0 ? 'disabled' : ''}>💾 编译并保存</button>
          <button id="dslBackBtn" class="btn btn-secondary">↩️ 返回可视化</button>
          <details class="story-dsl-help">
            <summary>📖 DSL 语法速查</summary>
            <pre># 段落名（顶格，全文件唯一）
角色名：对白文本          # 对白（冒号全半角均可，可空）
指令名('参数', 1)        # 命令，如 change_item('木剑', 1)
jump 目标段落名           # 强跳转
call 公共片段            # 调用子程序，配合 return
变量名 = 1 / += 1 / del  # 剧情变量

角色名：题干对白
- 选项文本                # 抉择选项（紧跟对白）
  缩进写选项内步骤
- 隐藏选项 if 表达式      # 单项条件

if 表达式                 # 条件分支
  步骤...
elif 表达式
  步骤...
else
  步骤...

battle 战役ID            # 战斗分支
- win
  胜利步骤...
- lose</pre>
          </details>
        </div>
        <textarea id="storyDslEditor" class="story-dsl-editor" spellcheck="false" placeholder="# 在这里像写剧本一样创作剧情..."></textarea>
        <div class="story-dsl-diags" id="storyDslDiags">${this._diagsHtml(res.diagnostics)}</div>
      </div>
    `;
    this._bindCommonStoryTabs();
    this._bindDslEvents();
  }

  _diagsHtml(diagnostics) {
    if (!diagnostics || diagnostics.length === 0) {
      return '<div class="dsl-diag ok">暂无诊断信息</div>';
    }
    return diagnostics.map(d => `
      <div class="dsl-diag ${d.severity}">
        ${d.line != null ? `<strong>第 ${d.line} 行</strong> · ` : ''}[${d.code}] ${d.message}
      </div>
    `).join('');
  }

  _compileDsl(file) {
    this.dslResults[file] = StoryDslTools.compile(this.dslTexts[file] || '');
  }

  _refreshDslStatus() {
    const badge = this.container.querySelector('#dslStatusBadge');
    const diags = this.container.querySelector('#storyDslDiags');
    const res = this.dslResults[this.activeFile] || { diagnostics: [] };
    const errCount = res.diagnostics.filter(d => d.severity === 'error').length;
    const warnCount = res.diagnostics.length - errCount;
    if (badge) {
      badge.className = `story-dsl-badge ${errCount > 0 ? 'bad' : 'ok'}`;
      badge.innerText = errCount > 0
        ? `❌ ${errCount} 个错误，修正后才能编译`
        : (warnCount > 0 ? `⚠️ ${warnCount} 个警告，可编译` : `✅ 语法检查通过，可编译${res.ir ? ` (${res.ir.segments.length} 段)` : ''}`);
    }
    if (diags) diags.innerHTML = this._diagsHtml(res.diagnostics);
    const saveBtn = this.container.querySelector('#dslSaveBtn');
    if (saveBtn) saveBtn.disabled = errCount > 0;
  }

  _bindDslEvents() {
    const file = this.activeFile;
    const ta = this.container.querySelector('#storyDslEditor');
    if (ta) {
      ta.value = this.dslTexts[file] || '';
      ta.oninput = () => {
        this.dslTexts[file] = ta.value;
        this.dslDirty[file] = true;
        clearTimeout(this.dslTimer);
        this.dslTimer = setTimeout(() => {
          this._compileDsl(file);
          this._refreshDslStatus();
        }, 350);
      };
    }

    const saveBtn = this.container.querySelector('#dslSaveBtn');
    if (saveBtn) {
      saveBtn.onclick = async () => {
        this._compileDsl(file);
        const res = this.dslResults[file];
        if (!res || !res.ir) {
          this.notify('DSL 存在语法错误，无法编译。请查看下方诊断信息。', 'error');
          this._refreshDslStatus();
          return;
        }
        saveBtn.innerText = '⏳ 编译保存中...';
        this.docs[file] = res.ir;
        const r = await this.adapter.saveStoryFile(file, res.ir);
        saveBtn.innerText = '💾 编译并保存';
        if (r.success) {
          this.notify(`DSL 编译成功，已保存 ${res.ir.segments.length} 段至 stories/${file}.story.json！${describeSaveState(r)}`, saveToastType(r));
          this.dslTexts[file] = null;
          this.dslResults[file] = null;
          this.dslDirty[file] = false;
          this.viewModes[file] = 'visual';
          this._restoreSelection();
          this._renderLayout();
        } else {
          this.notify('保存失败: ' + (r.error || '未知错误'), 'error');
        }
      };
    }

    const backBtn = this.container.querySelector('#dslBackBtn');
    if (backBtn) {
      backBtn.onclick = () => this._switchMode('visual');
    }
  }

  _renderSegmentListHtml() {
    const doc = this.docs[this.activeFile];
    const segs = doc && Array.isArray(doc.segments) ? doc.segments : [];
    const list = segs.filter(s => !this.searchKeyword || (s.name && s.name.includes(this.searchKeyword)));
    if (list.length === 0) return '<div class="empty-list" style="padding:40px; text-align:center; color:var(--text-muted);">未找到匹配的剧情段落</div>';
    return list.map(s => {
      const isSelected = this.selectedSegment && this.selectedSegment.name === s.name;
      return `
        <div class="list-item-card ${isSelected ? 'active' : ''}" data-name="${s.name}">
          <div class="item-title-row">
            <span class="item-name text-purple">${s.name}</span>
            <span class="item-badge badge-purple">${(s.steps || []).length} 幕</span>
          </div>
        </div>
      `;
    }).join('');
  }

  // ===== 递归步骤渲染 =====

  _renderStepsHtml(steps, pathStr, depth) {
    const list = Array.isArray(steps) ? steps : [];
    if (list.length === 0) {
      return `<div style="font-size:12px; color:var(--text-muted); padding:4px 0;">（空步骤流）</div>`;
    }
    return list.map((step, idx) => this._renderStepHtml(step, `${pathStr}.${idx}`, depth)).join('');
  }

  _renderStepHtml(step, pathStr, depth) {
    const kind = step.kind || 'dialogue';
    const kindLabel = { dialogue: '对白', command: '指令', jump: '跳转', battle: '战斗', branch: '条件分支', choice: '抉择' }[kind] || kind;
    const kindBadge = { dialogue: 'badge-purple', command: 'badge-blue', jump: 'badge-green', battle: 'badge-red', branch: 'badge-gold', choice: 'badge-gold' }[kind] || 'badge-blue';

    let body = '';
    if (kind === 'dialogue') {
      body = `
        <div class="form-row">
          <div class="form-group" style="max-width:260px;">
            <label>说话者 (speaker)</label>
            <input type="text" class="input-field st-field" data-target="${pathStr}.speaker" value="${step.speaker || ''}" placeholder="小虾米 / 南贤 / ...">
          </div>
        </div>
        <div class="form-group">
          <label>台词 (text)</label>
          <textarea class="input-field st-field" data-target="${pathStr}.text" style="min-height:52px;">${step.text || ''}</textarea>
        </div>
      `;
    } else if (kind === 'command') {
      body = `
        <div class="form-group">
          <label>指令调用 (call) — 形如 item('物品ID', 数量)、change_silver(500)</label>
          <input type="text" class="input-field st-field" data-target="${pathStr}.call" value="${step.call || ''}" list="storyCallList" placeholder="change_item('木剑', 1)">
        </div>
      `;
    } else if (kind === 'jump') {
      body = `
        <div class="form-group">
          <label>跳转目标段落 (target)</label>
          <input type="text" class="input-field st-field" data-target="${pathStr}.target" value="${step.target || ''}" list="storyTargetList" placeholder="目标段落名">
        </div>
      `;
    } else if (kind === 'battle') {
      const oc = step.outcomes || {};
      body = `
        <div class="form-group">
          <label>战斗ID (battleId)</label>
          <input type="text" class="input-field st-field" data-target="${pathStr}.battleId" value="${step.battleId || ''}" list="storyBattleList">
        </div>
        <div class="nested-steps">
          <div class="nested-title">🏆 胜利后步骤 (outcomes.win)</div>
          ${this._renderStepsHtml(oc.win, `${pathStr}.outcomes.win`, depth + 1)}
        </div>
        <div class="nested-steps">
          <div class="nested-title">💀 失败后步骤 (outcomes.lose)
            ${Array.isArray(oc.lose) ? '' : `<button class="btn btn-secondary btn-sm st-add-lose" data-path="${pathStr}" type="button">+ 添加失败分支</button>`}
          </div>
          ${Array.isArray(oc.lose) ? this._renderStepsHtml(oc.lose, `${pathStr}.outcomes.lose`, depth + 1) : '<div style="font-size:12px; color:var(--text-muted);">失败将直接进入全局失败流程</div>'}
        </div>
      `;
    } else if (kind === 'branch') {
      const cases = Array.isArray(step.cases) ? step.cases : [];
      body = `
        ${cases.map((c, ci) => `
          <div class="nested-steps">
            <div class="nested-title">
              条件分支 #${ci + 1} (when)
              <input type="text" class="input-field st-field" style="flex:1; min-width:220px;" data-target="${pathStr}.cases.${ci}.when" value="${c.when || ''}" placeholder="character_level('主角') >= 5">
              <button class="btn btn-danger btn-sm st-del-case" data-path="${pathStr}" data-idx="${ci}" type="button">✕ 删除分支</button>
            </div>
            ${this._renderStepsHtml(c.steps, `${pathStr}.cases.${ci}.steps`, depth + 1)}
          </div>
        `).join('')}
        <div style="display:flex; gap:6px; margin:6px 0;">
          <button class="btn btn-secondary btn-sm st-add-case" data-path="${pathStr}" type="button">+ 添加条件分支</button>
        </div>
        <div class="nested-steps">
          <div class="nested-title">🪂 兜底步骤 (fallback，无条件执行)</div>
          ${this._renderStepsHtml(step.fallback, `${pathStr}.fallback`, depth + 1)}
        </div>
      `;
    } else if (kind === 'choice') {
      const prompt = step.prompt || {};
      const blocks = Array.isArray(step.blocks) ? step.blocks : [];
      body = `
        <div class="form-row">
          <div class="form-group" style="max-width:220px;">
            <label>提问者 (prompt.speaker)</label>
            <input type="text" class="input-field st-field" data-target="${pathStr}.prompt.speaker" value="${prompt.speaker || ''}">
          </div>
          <div class="form-group" style="flex:1;">
            <label>题干 (prompt.text)</label>
            <input type="text" class="input-field st-field" data-target="${pathStr}.prompt.text" value="${prompt.text || ''}">
          </div>
        </div>
        ${blocks.map((b, bi) => `
          <div class="nested-steps">
            <div class="nested-title">
              选项块 #${bi + 1} (kind: ${b.kind || 'options'})
              <button class="btn btn-danger btn-sm st-del-block" data-path="${pathStr}" data-idx="${bi}" type="button">✕ 删除选项块</button>
            </div>
            ${(b.options || []).map((o, oi) => `
              <div class="affix-row">
                <div class="affix-row-head">
                  <input type="text" class="input-field st-field" style="flex:1; min-width:200px;" data-target="${pathStr}.blocks.${bi}.options.${oi}.text" value="${o.text || ''}" placeholder="选项描述">
                  <input type="text" class="input-field st-field" style="width:200px;" data-target="${pathStr}.blocks.${bi}.options.${oi}.when" value="${o.when || ''}" placeholder="显示条件 when (可空)">
                  <button class="btn btn-danger btn-sm st-del-option" data-path="${pathStr}" data-bidx="${bi}" data-oidx="${oi}" type="button">✕</button>
                </div>
                <div class="nested-steps">
                  <div class="nested-title">该选项被选中后的步骤</div>
                  ${this._renderStepsHtml(o.steps, `${pathStr}.blocks.${bi}.options.${oi}.steps`, depth + 1)}
                </div>
              </div>
            `).join('')}
            <button class="btn btn-secondary btn-sm st-add-option" data-path="${pathStr}" data-bidx="${bi}" type="button">+ 添加选项</button>
          </div>
        `).join('')}
        <button class="btn btn-secondary btn-sm st-add-block" data-path="${pathStr}" type="button">+ 添加选项块</button>
      `;
    }

    return `
      <div class="story-step-card">
        <div class="step-header">
          <div>
            <span class="step-tag ${kindBadge}">#${pathStr.split('.').pop()} · ${kindLabel}</span>
          </div>
          <div class="btn-group" style="display:flex; gap:4px; align-items:center;">
            <div class="step-move-btns">
              <button class="btn btn-secondary st-move" data-path="${pathStr}" data-dir="-1" type="button" title="上移">↑</button>
              <button class="btn btn-secondary st-move" data-path="${pathStr}" data-dir="1" type="button" title="下移">↓</button>
            </div>
            <button class="btn btn-danger btn-sm st-remove" data-path="${pathStr}" type="button">删除</button>
          </div>
        </div>
        ${body}
      </div>
    `;
  }

  _renderTimelineHtml(seg) {
    return `
      <div class="form-scroll-wrapper">
        <div class="detail-header-bar">
          <div>
            <h2 class="detail-title text-purple">${seg.name}</h2>
            <div class="detail-subtitle">剧本文件: ${this.activeFile}.story.json · 共 ${(seg.steps || []).length} 个执行步骤</div>
          </div>
          <div class="btn-group">
            <button id="addDialogueStepBtn" class="btn btn-secondary">+ 对白</button>
            <button id="addChoiceStepBtn" class="btn btn-secondary">+ 抉择</button>
            <button id="addCommandStepBtn" class="btn btn-secondary">+ 指令</button>
            <button id="addJumpStepBtn" class="btn btn-secondary">+ 跳转</button>
            <button id="addBattleStepBtn" class="btn btn-secondary">+ 战斗</button>
            <button id="addBranchStepBtn" class="btn btn-secondary">+ 条件分支</button>
            <button id="saveStoryBtn" class="btn btn-primary">💾 保存剧本</button>
          </div>
        </div>

        <div class="timeline-step-list" id="stepListContainer">
          ${(seg.steps || []).length === 0 ? '<div style="color:var(--text-muted); font-size:14px; text-align:center; padding:60px 0;">当前段落暂无步骤，请点击上方按钮插入对白</div>' : this._renderStepsHtml(seg.steps, 'steps', 0)}
        </div>
      </div>
    `;
  }

  // ===== 数据寻址与结构操作 =====

  _resolveContainer(pathStr) {
    // pathStr 指向一个 steps 数组（如 "steps.3.blocks.0.options.1.steps"），返回该数组
    const keys = pathStr.split('.');
    let obj = this.selectedSegment;
    for (const k of keys) {
      const key = isNaN(k) ? k : parseInt(k, 10);
      obj = obj[key];
      if (obj == null) return null;
    }
    return obj;
  }

  _assign(targetStr, value) {
    const keys = targetStr.split('.');
    let obj = this.selectedSegment;
    for (let i = 0; i < keys.length - 1; i++) {
      const k = keys[i];
      obj = obj[isNaN(k) ? k : parseInt(k, 10)];
    }
    const last = keys[keys.length - 1];
    obj[isNaN(last) ? last : parseInt(last, 10)] = value;
  }

  _ensureOutcomes(step) {
    if (!step.outcomes) step.outcomes = {};
    return step.outcomes;
  }

  _refreshTimeline() {
    const tl = this.container.querySelector('#storyTimeline');
    if (tl) {
      tl.innerHTML = this._renderTimelineHtml(this.selectedSegment);
      this._bindTimelineEvents();
    }
    // 结构可能变化，左侧段落数量徽标同步刷新
    const listEl = this.container.querySelector('#segList');
    if (listEl) {
      listEl.innerHTML = this._renderSegmentListHtml();
      this._bindListClickEvents();
    }
  }

  // ===== 事件绑定 =====

  _bindEvents() {
    this._bindCommonStoryTabs();

    const searchInput = this.container.querySelector('#segSearch');
    if (searchInput) {
      searchInput.oninput = (e) => {
        this.searchKeyword = e.target.value.trim();
        this.container.querySelector('#segList').innerHTML = this._renderSegmentListHtml();
        this._bindListClickEvents();
      };
    }

    const addSegBtn = this.container.querySelector('#addSegBtn');
    if (addSegBtn) {
      addSegBtn.onclick = () => {
        const segName = prompt('请输入新故事段落名称 (例如 "新手村_客栈对饮"):');
        if (segName && segName.trim()) {
          const newSeg = { name: segName.trim(), steps: [] };
          const doc = this.docs[this.activeFile];
          if (!Array.isArray(doc.segments)) doc.segments = [];
          doc.segments.push(newSeg);
          this.selectedSegment = newSeg;
          this._renderLayout();
          this.notify(`已在 ${this.activeFile}.story.json 创建新段落《${newSeg.name}》`);
        }
      };
    }

    this._bindListClickEvents();
    this._bindTimelineEvents();
  }

  _bindListClickEvents() {
    this.container.querySelectorAll('.list-item-card').forEach(card => {
      card.onclick = () => {
        const name = card.dataset.name;
        const segs = this.docs[this.activeFile].segments || [];
        this.selectedSegment = segs.find(s => s.name === name);
        this.container.querySelectorAll('.list-item-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        this.container.querySelector('#storyTimeline').innerHTML = this.selectedSegment ? this._renderTimelineHtml(this.selectedSegment) : '';
        this._bindTimelineEvents();
      };
    });
  }

  _bindTimelineEvents() {
    if (!this.selectedSegment) return;
    const seg = this.selectedSegment;

    // 顶层插入按钮
    const topAdd = (id, make) => {
      const btn = this.container.querySelector(id);
      if (btn) btn.onclick = () => {
        if (!Array.isArray(seg.steps)) seg.steps = [];
        seg.steps.push(make());
        this._refreshTimeline();
      };
    };
    topAdd('#addDialogueStepBtn', () => ({ kind: 'dialogue', speaker: '小虾米', text: '' }));
    topAdd('#addCommandStepBtn', () => ({ kind: 'command', call: '' }));
    topAdd('#addJumpStepBtn', () => ({ kind: 'jump', target: '' }));
    topAdd('#addBattleStepBtn', () => ({ kind: 'battle', battleId: '', outcomes: { win: [] } }));
    topAdd('#addBranchStepBtn', () => ({ kind: 'branch', cases: [], fallback: [] }));
    topAdd('#addChoiceStepBtn', () => ({
      kind: 'choice',
      prompt: { speaker: '', text: '你决定如何应对？' },
      blocks: [{ kind: 'options', options: [{ text: '选项一', steps: [] }, { text: '选项二', steps: [] }] }]
    }));

    // 字段赋值（含嵌套 prompt.speaker 等）
    this.container.querySelectorAll('.st-field').forEach(inp => {
      inp.onchange = () => this._assign(inp.dataset.target, inp.value);
    });

    // 结构操作（统一按 data-path 定位）
    this.container.querySelectorAll('.st-move').forEach(btn => {
      btn.onclick = () => {
        const arr = this._resolveContainer(btn.dataset.path.replace(/\.\d+$/, ''));
        const idx = parseInt(btn.dataset.path.split('.').pop(), 10);
        const dir = parseInt(btn.dataset.dir, 10);
        const to = idx + dir;
        if (arr && to >= 0 && to < arr.length) {
          [arr[idx], arr[to]] = [arr[to], arr[idx]];
          this._refreshTimeline();
        }
      };
    });

    this.container.querySelectorAll('.st-remove').forEach(btn => {
      btn.onclick = () => {
        const arr = this._resolveContainer(btn.dataset.path.replace(/\.\d+$/, ''));
        const idx = parseInt(btn.dataset.path.split('.').pop(), 10);
        if (arr) { arr.splice(idx, 1); this._refreshTimeline(); }
      };
    });

    this.container.querySelectorAll('.st-add-option').forEach(btn => {
      btn.onclick = () => {
        const block = this._resolveContainer(`${btn.dataset.path}.blocks.${btn.dataset.bidx}`);
        if (block) {
          if (!Array.isArray(block.options)) block.options = [];
          block.options.push({ text: '新选项', steps: [] });
          this._refreshTimeline();
        }
      };
    });

    this.container.querySelectorAll('.st-del-option').forEach(btn => {
      btn.onclick = () => {
        const block = this._resolveContainer(`${btn.dataset.path}.blocks.${btn.dataset.bidx}`);
        if (block && Array.isArray(block.options)) {
          block.options.splice(parseInt(btn.dataset.oidx, 10), 1);
          this._refreshTimeline();
        }
      };
    });

    this.container.querySelectorAll('.st-add-block').forEach(btn => {
      btn.onclick = () => {
        const step = this._resolveContainer(btn.dataset.path.replace(/\.blocks\.\d+$/, ''));
        if (step && Array.isArray(step.blocks)) {
          step.blocks.push({ kind: 'options', options: [{ text: '新选项', steps: [] }] });
          this._refreshTimeline();
        }
      };
    });

    this.container.querySelectorAll('.st-del-block').forEach(btn => {
      btn.onclick = () => {
        const step = this._resolveContainer(btn.dataset.path.replace(/\.blocks\.\d+$/, ''));
        if (step && Array.isArray(step.blocks)) {
          step.blocks.splice(parseInt(btn.dataset.idx, 10), 1);
          this._refreshTimeline();
        }
      };
    });

    this.container.querySelectorAll('.st-add-case').forEach(btn => {
      btn.onclick = () => {
        const step = this._resolveContainer(btn.dataset.path.replace(/\.cases\.\d+$/, ''));
        if (step && Array.isArray(step.cases)) {
          step.cases.push({ when: '', steps: [] });
          this._refreshTimeline();
        }
      };
    });

    this.container.querySelectorAll('.st-del-case').forEach(btn => {
      btn.onclick = () => {
        const step = this._resolveContainer(btn.dataset.path.replace(/\.cases\.\d+$/, ''));
        if (step && Array.isArray(step.cases)) {
          step.cases.splice(parseInt(btn.dataset.idx, 10), 1);
          this._refreshTimeline();
        }
      };
    });

    this.container.querySelectorAll('.st-add-lose').forEach(btn => {
      btn.onclick = () => {
        const step = this._resolveContainer(btn.dataset.path);
        if (step) {
          const oc = this._ensureOutcomes(step);
          if (!Array.isArray(oc.lose)) oc.lose = [];
          this._refreshTimeline();
        }
      };
    });

    const saveBtn = this.container.querySelector('#saveStoryBtn');
    if (saveBtn) {
      saveBtn.onclick = async () => {
        saveBtn.innerText = '⏳ 保存中...';
        const res = await this.adapter.saveStoryFile(this.activeFile, this.docs[this.activeFile]);
        saveBtn.innerText = '💾 保存剧本';
        if (res.success) {
          this.notify(`成功保存剧本至 stories/${this.activeFile}.story.json！${describeSaveState(res)}`, saveToastType(res));
        } else {
          this.notify('剧本保存失败: ' + (res.error || '未知错误'), 'error');
        }
      };
    }
  }
}


/**
 * HealthView: 全局数据健康检查
 */
class HealthView {
  constructor(validator, onNavigate) {
    this.validator = validator;
    this.navigate = onNavigate;
    this.issues = [];
    this.stats = null;
    this.container = null;
    this.hasAudited = false;
  }

  render(parentEl) {
    this.container = parentEl;
    if (!this.hasAudited) {
      this._runAudit();
      this.hasAudited = true;
    }
    this._renderLayout();
  }

  _runAudit() {
    const result = this.validator.runFullAudit();
    this.issues = result.issues;
    this.stats = result.stats;
  }

  _renderLayout() {
    const errors = this.issues.filter(i => i.level === 'error');
    const warns = this.issues.filter(i => i.level === 'warn');
    const stats = this.stats || { filesScanned: 0, jsonFailed: 0, checks: 0 };
    const compliance = stats.filesScanned > 0
      ? Math.round(((stats.filesScanned - stats.jsonFailed) / stats.filesScanned) * 100)
      : 100;

    this.container.innerHTML = `
      <div class="health-check-layout">
        <div class="health-header-card">
          <div class="health-title-group">
            <h2>🔍 全局数据健康检查与悬空引用排查</h2>
            <p>已扫描 <strong>${stats.filesScanned}</strong> 个 JSON 文件、执行 <strong>${stats.checks}</strong> 项引用检查：覆盖角色技能/天赋、战棋布阵与站位规则、四类武学状态与触发条件、物品标签、商店商品、剧情跳转与战斗触发、门派开局剧情。解析规则与游戏加载器一致（容忍 // 注释与尾逗号）。</p>
          </div>
          <button id="recheckBtn" class="btn btn-primary">重新全面体检</button>
        </div>

        <div class="health-stats-row">
          <div class="health-stat-card ${errors.length > 0 ? 'card-error' : 'card-ok'}">
            <div class="stat-num">${errors.length}</div>
            <div class="stat-desc">致命引用断裂 (Error)</div>
          </div>
          <div class="health-stat-card ${warns.length > 0 ? 'card-warn' : 'card-ok'}">
            <div class="stat-num">${warns.length}</div>
            <div class="stat-desc">悬空或缺失警告 (Warning)</div>
          </div>
          <div class="health-stat-card ${stats.jsonFailed > 0 ? 'card-error' : 'card-ok'}">
            <div class="stat-num">${compliance}%</div>
            <div class="stat-desc">JSON 语法合规率 (${stats.filesScanned - stats.jsonFailed}/${stats.filesScanned})</div>
          </div>
        </div>

        <div class="health-issues-list">
          ${this.issues.length === 0 ? `
            <div class="health-clean-box">
              <div class="clean-icon">🎉</div>
              <h3>完美！当前 MOD 未发现任何断裂引用或致命问题</h3>
              <p>角色技能与天赋、战棋布阵、武学状态、商店商品、剧情跳转段落均能严密对应。</p>
            </div>
          ` : this.issues.map(iss => `
            <div class="issue-card ${iss.level === 'error' ? 'issue-error' : 'issue-warn'}">
              <div class="issue-badge">${iss.module} · ${iss.level.toUpperCase()}</div>
              <div class="issue-content">
                <h4>${iss.title}</h4>
                <p>${iss.message}</p>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;

    const recheckBtn = this.container.querySelector('#recheckBtn');
    if (recheckBtn) {
      recheckBtn.onclick = () => {
        recheckBtn.innerText = '正在排查...';
        this._runAudit();
        this._renderLayout();
      };
    }
  }
}

/**
 * ModStudioApp: MOD 创作者工坊应用中枢
 */
class ModStudioApp {
  constructor() {
    this.fs = new FileSystemDriver();
    this.refIndex = new ReferenceIndex();
    this.adapter = new JsonDataAdapter(this.fs);
    this.validator = new ModValidator(this.fs, this.refIndex);

    this.currentTab = 'items';
    this.views = {};
    this.isLoaded = false;
  }

  init() {
    this._bindGlobalEvents();
    this._showWelcome();
  }

  showToast(message, type = 'info') {
    const toast = document.getElementById('toastNotification');
    if (!toast) return;
    toast.innerText = message;
    toast.className = `show toast-${type}`;
    setTimeout(() => {
      toast.className = '';
    }, 3000);
    this.refreshDirtyBar();
  }

  // 顶部状态条：展示未落盘更改数量与草稿恢复入口
  refreshDirtyBar() {
    const bar = document.getElementById('dirtyStateBar');
    if (!bar) return;
    const fs = this.fs;
    const dirtyCount = fs.dirtyFiles ? fs.dirtyFiles.size : 0;
    // 只提示不属于当前内存工作区的历史草稿；已在内存 dirty 集合中的草稿以内存为准
    const pendingRestore = this.isLoaded
      ? fs.listDrafts().filter(d => !fs.dirtyFiles.has(d.path))
      : [];

    if (pendingRestore.length > 0) {
      const names = pendingRestore.map(d => d.path).join('、');
      bar.className = 'dsb-visible';
      bar.innerHTML = `
        <span>📜 检测到上次未落盘的 ${pendingRestore.length} 个草稿：${names}</span>
        <button class="dsb-btn primary" id="dsbRestoreBtn">♻️ 恢复草稿继续编辑</button>
        <button class="dsb-btn" id="dsbDiscardBtn">🗑️ 丢弃草稿</button>
      `;
      const restoreBtn = bar.querySelector('#dsbRestoreBtn');
      const discardBtn = bar.querySelector('#dsbDiscardBtn');
      if (restoreBtn) restoreBtn.onclick = () => this.handleRestoreDrafts(pendingRestore);
      if (discardBtn) discardBtn.onclick = () => this.handleDiscardDrafts(pendingRestore);
      return;
    }

    if (dirtyCount > 0) {
      const modeLabel = fs.mode === 'http' ? 'HTTP 预设模式' : '内存模式';
      bar.className = 'dsb-visible';
      bar.innerHTML = `
        <span>⚠️ ${dirtyCount} 个文件的更改仅保存在浏览器内存中（${modeLabel}），刷新页面将丢失</span>
        <button class="dsb-btn primary" id="dsbExportBtn">⬇️ 导出更改文件</button>
        <button class="dsb-btn" id="dsbFlushBtn">📂 挂载 MOD 目录并落盘</button>
      `;
      const exportBtn = bar.querySelector('#dsbExportBtn');
      const flushBtn = bar.querySelector('#dsbFlushBtn');
      if (exportBtn) exportBtn.onclick = () => this.handleExportChanged();
      if (flushBtn) flushBtn.onclick = () => this.handleMountFlush();
      return;
    }

    if (this.isLoaded && fs.mode === 'native') {
      bar.className = 'dsb-clean';
      bar.innerHTML = '<span>✅ 所有更改已同步写入本地 MOD 目录</span>';
      return;
    }

    bar.className = '';
    bar.innerHTML = '';
  }

  async handleExportChanged() {
    const res = await this.fs.exportChangedFiles();
    if (res.success && res.count > 0) {
      this.showToast(`已导出 ${res.count} 个更改文件到浏览器下载目录，请手动放回 MOD 目录对应位置`, 'success');
      this.refreshDirtyBar();
    } else if (res.success) {
      this.showToast('当前没有需要导出的更改', 'info');
    } else {
      this.showToast('导出中断：部分文件未成功下载，请重试', 'error');
    }
  }

  async handleMountFlush() {
    if (this.fs.dirtyFiles.size === 0) {
      this.showToast('当前没有未落盘的更改', 'info');
      return;
    }
    const goOn = confirm(`将把 ${this.fs.dirtyFiles.size} 个更改文件写入你选择的 MOD 根目录。\n请务必选中包含 data/ 子目录的 MOD 根目录，继续吗？`);
    if (!goOn) return;
    const res = await this.fs.mountAndFlush();
    if (res.success) {
      this.showToast(`✅ 已把 ${res.count} 个文件写入本地 MOD 目录`, 'success');
      document.getElementById('currentModLabel').innerText = `当前项目: ${this.fs.currentModName} (原生直写)`;
    } else if (!res.cancelled) {
      this.showToast('落盘失败: ' + (res.error || '未知错误'), 'error');
    }
    this.refreshDirtyBar();
  }

  handleRestoreDrafts(drafts) {
    this.fs.restoreDrafts(drafts);
    this.refIndex.rebuildIndex(this.fs);
    this.views = this._createViews();
    this.switchTab(this.currentTab);
    this.showToast(`已恢复 ${drafts.length} 个草稿文件，确认内容无误后请导出或挂载落盘`, 'success');
    this.refreshDirtyBar();
  }

  handleDiscardDrafts(drafts) {
    const goOn = confirm(`确定丢弃 ${drafts.length} 个未落盘草稿吗？此操作不可撤销。`);
    if (!goOn) return;
    this.fs.discardDrafts(drafts);
    this.showToast('草稿已丢弃', 'info');
    this.refreshDirtyBar();
  }

  async handleLoadPreset(modId = 'wuxia-legend') {
    const label = document.getElementById('currentModLabel');
    if (label) label.innerText = '⏳ 正在加载预设...';
    try {
      const res = await this.fs.loadPresetMod(modId);
      if (res.success) {
        if (label) label.innerText = `当前项目: ${res.name} (HTTP极速模式)`;
        this._onModLoaded(res);
        const openBtn = document.getElementById('openModDirBtn');
        if (openBtn) openBtn.innerText = '📂 切换 MOD 目录';
        this.showToast(`成功载入 MOD《${res.name}》，已读取 ${res.count} 个数据文件并构建图鉴索引！`, 'success');
      } else {
        if (label) label.innerText = this.isLoaded ? `当前项目: ${this.fs.currentModName}` : '未打开 MOD 目录';
        this.showToast(res.error || '未能加载预设，请选择本地目录', 'error');
      }
    } catch (e) {
      console.error(e);
      if (label) label.innerText = this.isLoaded ? `当前项目: ${this.fs.currentModName}` : '未打开 MOD 目录';
      this.showToast('加载预设异常: ' + e.message, 'error');
    }
  }

  async handleOpenDirectory() {
    const openBtn = document.getElementById('openModDirBtn');
    if (openBtn) openBtn.innerText = '⏳ 正在加载...';
    try {
      const res = await this.fs.selectDirectory();
      if (res.success) {
        if (openBtn) openBtn.innerText = '📂 切换 MOD 目录';
        const modeLabel = res.mode === 'native' ? '原生直写' : '内存模式';
        document.getElementById('currentModLabel').innerText = `当前项目: ${res.name} (${modeLabel})`;
        this._onModLoaded(res);
        this.showToast(`成功载入 MOD《${res.name}》，已构建全局引用与原画图鉴网络！`, 'success');
      } else {
        if (openBtn) openBtn.innerText = this.isLoaded ? '📂 切换 MOD 目录' : '📂 打开 MOD 目录';
        if (!res.cancelled) {
          this.showToast('未能读取所选目录，请确认目录内包含 JSON 数据', 'warning');
        }
      }
    } catch (e) {
      console.error(e);
      if (openBtn) openBtn.innerText = this.isLoaded ? '📂 切换 MOD 目录' : '📂 打开 MOD 目录';
      this.showToast('选择目录异常: ' + e.message, 'error');
    }
  }

  _createViews() {
    return {
      items: new ItemView(this.adapter, this.refIndex, (msg, type) => this.showToast(msg, type)),
      skills: new MartialArtsHubView(this.adapter, this.refIndex, (msg, type) => this.showToast(msg, type)),
      characters: new CharacterView(this.adapter, this.refIndex, (msg, type) => this.showToast(msg, type)),
      talents_buffs: new TalentBuffHubView(this.adapter, this.refIndex, (msg, type) => this.showToast(msg, type)),
      shops: new ShopView(this.adapter, this.refIndex, (msg, type) => this.showToast(msg, type)),
      battles: new BattleView(this.adapter, this.refIndex, (msg, type) => this.showToast(msg, type)),
      stories: new StoryView(this.adapter, this.refIndex, (msg, type) => this.showToast(msg, type)),
      health: new HealthView(this.validator, (tab) => this.switchTab(tab))
    };
  }

  // 页面级 datalist：为各工坊的 ID 输入框提供联想数据源
  _populateDatalists() {
    const fill = (id, values) => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = values.map(v => `<option value="${v}"></option>`).join('');
    };
    fill('affixSkillIdList', this.refIndex.skills.map(s => s.id));
    fill('affixExtSkillIdList', this.refIndex.skills.filter(s => s.category === 'external').map(s => s.id));
    fill('affixBuffIdList', (this.refIndex.buffs || []).map(b => b.id));
    fill('affixItemIdList', this.refIndex.items.map(i => i.id));
  }

  _onModLoaded(res) {
    this.refIndex.rebuildIndex(this.fs);
    this.isLoaded = true;

    // 初始化各个工坊子视图
    this.views = this._createViews();

    this.switchTab(this.currentTab);
    // 页面级 ID 联想数据源 + 草稿检查
    this._populateDatalists();
    this.refreshDirtyBar();
  }

  _bindGlobalEvents() {
    const openBtn = document.getElementById('openModDirBtn');
    if (openBtn) {
      openBtn.onclick = () => this.handleOpenDirectory();
    }

    const quickBtn = document.getElementById('quickLoadWuxiaBtn');
    if (quickBtn) {
      quickBtn.onclick = () => this.handleLoadPreset('wuxia-legend');
    }

    document.querySelectorAll('.nav-tab-btn').forEach(btn => {
      btn.onclick = () => {
        if (!this.isLoaded) {
          this.showToast('请先选择 MOD：可点击上方【⚡ 载入《武侠传奇》】或【📂 打开 MOD 目录】！');
          return;
        }
        const tab = btn.dataset.tab;
        this.switchTab(tab);
      };
    });
  }

  switchTab(tabName) {
    this.currentTab = tabName;
    document.querySelectorAll('.nav-tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tabName);
    });

    const mainContainer = document.getElementById('mainAppContainer');
    if (!this.views[tabName]) return;

    mainContainer.innerHTML = '';
    this.views[tabName].render(mainContainer);
  }

    const isFileProtocol = location.protocol === 'file:';
    const mainContainer = document.getElementById('mainAppContainer');
    mainContainer.innerHTML = `
      <div class="welcome-hero-box">
        <div class="welcome-card">
          <div class="welcome-badge">纯前端 · 零服务依赖 · 本地安全直写 · 原画图鉴直显</div>
          <h1>《金庸群侠传XR》MOD 创作者工坊</h1>
          <p class="welcome-subtitle">专为神兵塑造、武学创新、侠客资质配置与 11×4 战棋布阵量身打造的可视化创作中心</p>

          <div class="feature-card-grid">
            <div class="f-card">
              <div class="f-icon">🗡️</div>
              <h4>神兵与道具工坊</h4>
              <p>自由挑选神兵插画、调整属性词条、暴击率与专属天赋。</p>
            </div>
            <div class="f-card">
              <div class="f-icon">🥋</div>
              <h4>武学与招式工坊</h4>
              <p>直观选择直线、星芒群攻范围，设置怒气消耗与招式解锁。</p>
            </div>
            <div class="f-card">
              <div class="f-icon">👤</div>
              <h4>侠客与宗师工坊</h4>
              <p>高清立绘可视化选定，四维专精与内功外功一键装配。</p>
            </div>
            <div class="f-card">
              <div class="f-icon">⚔️</div>
              <h4>11×4 战棋工坊</h4>
              <p>微型棋盘直观布阵、调整阵营与面向，招式范围即时演练。</p>
            </div>
            <div class="f-card">
              <div class="f-icon">📜</div>
              <h4>剧情对白流编排</h4>
              <p>气泡化撰写剧情对话、选择题分支与银两道具奖励。</p>
            </div>
          </div>

          <div class="welcome-action-box" style="display:flex; flex-direction:column; align-items:center; gap:12px; max-width:560px; margin:0 auto;">
            <button id="welcomeLoadWuxiaBtn" class="btn btn-primary btn-lg" style="width:100%; font-size:1.05rem; background:linear-gradient(135deg, #059669, #10b981); border:none; box-shadow:0 4px 14px rgba(16,185,129,0.3);">
              ⚡ 一键极速载入《武侠传奇》MOD (推荐)
            </button>
            <div style="display:flex; gap:12px; width:100%;">
              <button id="welcomeLoadBaseBtn" class="btn btn-secondary" style="flex:1; padding:10px;">
                📦 载入《基础数据包》(jyxr-base)
              </button>
              <button id="welcomeOpenModBtn" class="btn btn-secondary" style="flex:1; padding:10px;">
                📂 手动选择本地 MOD 目录...
              </button>
            </div>
            <div class="welcome-hint" style="margin-top:6px; color:var(--text-muted); font-size:0.85rem;">
              全面适配 Chrome / Safari / Edge / Firefox 现代浏览器，支持零等待一键载入与本地磁盘直写
            </div>
            ${isFileProtocol ? `
              <div class="protocol-tip" style="margin-top: 16px; text-align:left; font-size:0.85rem; padding:12px; background:rgba(59,130,246,0.1); border:1px solid rgba(59,130,246,0.25); border-radius:8px;">
                💡 <strong>直写磁盘体验提示</strong>：您当前是通过 <code>file://</code> 打开。<br>
                在 Mac 上只需在 Finder 双击运行 <code>tools/mod_editor/启动MOD编辑器.command</code>，即可通过 <code>localhost</code> 获得一键极速载入与原生磁盘直写体验！
              </div>
            ` : ''}
          </div>
        </div>
      </div>
    `;

    const welcomeLoadWuxiaBtn = mainContainer.querySelector('#welcomeLoadWuxiaBtn');
    if (welcomeLoadWuxiaBtn) {
      welcomeLoadWuxiaBtn.onclick = () => this.handleLoadPreset('wuxia-legend');
    }

    const welcomeLoadBaseBtn = mainContainer.querySelector('#welcomeLoadBaseBtn');
    if (welcomeLoadBaseBtn) {
      welcomeLoadBaseBtn.onclick = () => this.handleLoadPreset('jyxr-base');
    }

    const welcomeBtn = mainContainer.querySelector('#welcomeOpenModBtn');
    if (welcomeBtn) {
      welcomeBtn.onclick = () => this.handleOpenDirectory();
    }
  }
}


// 启动应用
window.addEventListener('DOMContentLoaded', () => {
  const app = new ModStudioApp();
  app.init();
});
